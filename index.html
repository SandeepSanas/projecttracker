<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectTracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ProjectTracker">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  body {
    background-image:
      radial-gradient(ellipse 90% 60% at 15% -10%, rgba(99,102,241,0.28), transparent),
      radial-gradient(ellipse 70% 50% at 95% 5%, rgba(14,165,233,0.24), transparent),
      radial-gradient(ellipse 60% 40% at 50% 105%, rgba(168,85,247,0.20), transparent);
    background-color: #eef2ff;
    min-height: 100vh;
  }
  .data-mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .blink { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
  .alert-pulse { animation: pulse-red 1.5s infinite; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .eyebrow { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .glass {
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1.5px solid rgba(255,255,255,0.6);
    box-shadow: 0 8px 32px rgba(15,23,42,0.10), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  /* Dark mode — toggled by adding class="dark" to <html> */
  html.dark body {
    background-color: #0f172a;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99,102,241,0.22), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(14,165,233,0.16), transparent);
    color: #e2e8f0;
  }
  html.dark .glass {
    background: rgba(30,41,59,0.6);
    border: 1px solid rgba(148,163,184,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  html.dark header { background: rgba(15,23,42,0.75) !important; border-color: rgba(148,163,184,0.15) !important; }
  html.dark aside { background: rgba(15,23,42,0.9) !important; border-color: rgba(148,163,184,0.15) !important; }
  html.dark .text-slate-800 { color: #e2e8f0; }
  html.dark .text-slate-500, html.dark .text-slate-600 { color: #94a3b8; }
  html.dark .text-slate-400 { color: #64748b; }
  html.dark input, html.dark select, html.dark textarea {
    background: rgba(30,41,59,0.8); border-color: rgba(148,163,184,0.25); color: #e2e8f0;
  }
  html.dark .nav-btn:hover, html.dark .hover\\:bg-slate-100:hover { background: rgba(51,65,85,0.6) !important; }
  html.dark .bg-white { background: #1e293b !important; color: #e2e8f0; }
  .blueprint-grid { background-image: linear-gradient(rgba(148,197,255,.09) 1px,transparent 1px), linear-gradient(90deg,rgba(148,197,255,.09) 1px,transparent 1px); background-size:28px 28px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

<!-- LOGIN -->
<div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 overflow-hidden">
  <div class="absolute inset-0 blueprint-grid"></div>
  <form id="login-form" class="relative max-w-sm w-full mx-4 bg-white/[0.06] backdrop-blur-xl rounded-2xl p-6 shadow-2xl border border-white/10 space-y-3">
    <div class="flex flex-col items-center mb-1">
      <img id="login-logo-img" alt="JustClick" class="mx-auto h-16 w-auto object-contain mb-2 drop-shadow-lg bg-white rounded-2xl p-2"/>
      <p class="eyebrow text-sky-400">JustClick</p>
    </div>
    <h1 class="text-2xl font-bold text-white text-center">ProjectTracker</h1>
    <p class="eyebrow text-sky-400 text-center mb-2">Real-time Site Monitor</p>
    <input id="login-email" type="email" required placeholder="Email" class="w-full text-sm rounded-xl px-3 py-2.5 bg-white/90" />
    <div class="relative">
      <input id="login-password" type="password" required placeholder="Password" class="w-full text-sm rounded-xl px-3 py-2.5 pr-10 bg-white/90" />
      <button type="button" id="login-pw-toggle" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 text-sm">👁️</button>
    </div>
    <p id="login-error" class="hidden text-xs text-red-300"></p>
    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold">Sign In</button>
    <p class="text-center text-slate-500 eyebrow pt-1">No account yet? Ask your Company Admin to create one.</p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 border-b border-white/40 px-3 sm:px-4 py-2 flex items-center justify-between gap-2 flex-wrap" style="background: rgba(255,255,255,0.72); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);">
    <div class="flex items-center gap-2 min-w-0">
      <img id="header-logo" class="hidden w-10 h-10 sm:w-14 sm:h-14 rounded-xl object-cover shrink-0" />
      <div class="min-w-0">
        <h1 class="font-bold text-sm truncate">ProjectTracker</h1>
        <p id="header-sub" class="text-[10px] text-slate-500 data-mono truncate"></p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
      <span id="role-label" class="eyebrow text-slate-500"></span>
      <div class="relative">
        <button id="bell-btn" class="text-base px-2 py-1 rounded-lg border relative">🔔<span id="bell-badge" class="hidden absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">0</span></button>
        <div id="bell-panel" class="hidden fixed left-2 right-2 top-14 sm:absolute sm:left-auto sm:right-0 sm:top-auto sm:mt-2 sm:w-72 max-h-96 overflow-y-auto bg-white rounded-2xl shadow-xl border p-2 z-50"></div>
      </div>
      <button id="theme-toggle" class="text-[11px] sm:text-xs px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl border whitespace-nowrap">🌙 Dark</button>
      <button id="logout-btn" class="text-[11px] sm:text-xs px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl border whitespace-nowrap">Sign out</button>
    </div>
  </header>
  <div class="flex flex-col sm:flex-row flex-1 min-h-0">
    <aside class="sm:w-52 sm:shrink-0 border-b sm:border-b-0 sm:border-r bg-white/90">
      <nav id="side-nav" class="flex flex-row sm:flex-col gap-1 text-sm p-2 overflow-x-auto sm:overflow-visible"></nav>
    </aside>
    <main id="view" class="flex-1 overflow-y-auto p-3 sm:p-5 min-w-0"></main>
  </div>
</div>

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Session-only persistence: closing the browser/tab fully signs the person
// out. This is deliberate for a shared-device work tool — a normal page
// refresh (same tab, browser still open) keeps you logged in, but closing
// the browser does not silently leave a session open for the next person.
setPersistence(auth, browserSessionPersistence).catch(() => {});
const db = getFirestore(app);
const storage = getStorage(app);

// ── Session state ────────────────────────────────────────────────
let session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
let unsubscribers = []; // active Firestore listeners for the current view, cleared on nav change

function clearListeners() { unsubscribers.forEach(u => u()); unsubscribers = []; }

// ── Auth wiring ──────────────────────────────────────────────────
document.getElementById('login-logo-img').src = JUSTCLICK_LOGO;

// Clears the login form completely — called after every sign-out so the
// next person to use this device never sees a previous person's typed
// email/password or a stuck "Signing in…" button.
function resetLoginForm() {
  const form = document.getElementById('login-form');
  form.reset();
  document.getElementById('login-password').type = 'password';
  document.getElementById('login-pw-toggle').textContent = '👁️';
  document.getElementById('login-error').classList.add('hidden');
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = false; btn.textContent = 'Sign In';
}
document.getElementById('login-pw-toggle').addEventListener('click', () => {
  const pw = document.getElementById('login-password');
  const btn = document.getElementById('login-pw-toggle');
  const showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁️' : '🙈';
});
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  const btn = e.target.querySelector('button[type="submit"]');
  errBox.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await signInWithEmailAndPassword(auth, email, password);
    // On success the login screen hides itself (finishLogin), so no need
    // to reset the button text here.
  } catch (err) {
    errBox.textContent = friendlyAuthError(err);
    errBox.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});
document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

// ── Theme toggle (light/dark), persisted locally per device ──────
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(mode) {
  document.documentElement.classList.toggle('dark', mode === 'dark');
  themeBtn.textContent = mode === 'dark' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem('pt-theme') || 'light');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('pt-theme', next);
  applyTheme(next);
});

function friendlyAuthError(err) {
  if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') return 'Incorrect email or password.';
  if (err.code === 'auth/user-not-found') return 'No account with that email. Ask your admin to create one.';
  if (err.code === 'auth/too-many-requests') return 'Too many attempts — wait a moment and try again.';
  return err.message;
}

let profileUnsub = null;
onAuthStateChanged(auth, async (user) => {
  clearListeners();
  if (profileUnsub) { profileUnsub(); profileUnsub = null; }
  if (!user) {
    session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
    bellUnsubs.forEach(u => u()); bellUnsubs = []; bellCache = {};
    resetLoginForm();
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  session.uid = user.uid;
  session.email = user.email;

  // Check super_admin first
  const adminSnap = await getDoc(doc(db, 'admins', user.uid));
  if (adminSnap.exists()) {
    session.isSuperAdmin = true;
    session.companyId = null;
    session.profile = { role:'super_admin', name: user.email, permissions:{} };
    finishLogin();
  } else {
    // Find which company this user belongs to via a small lookup doc
    // written when the account was created (see createAuthAccountWithoutSwitchingSession callers).
    const lookupSnap = await getDoc(doc(db, 'userCompanyLookup', user.uid));
    if (!lookupSnap.exists()) {
      alert('Your account is not linked to a company yet. Contact your Company Admin.');
      await signOut(auth);
      return;
    }
    session.companyId = lookupSnap.data().companyId;
    const companySnap = await getDoc(doc(db, 'companies', session.companyId));
    session.companyName = companySnap.exists() ? companySnap.data().name : '';
    session.companyLogoUrl = companySnap.exists() ? (companySnap.data().logoUrl || '') : '';

    // Live-subscribe to this person's own profile so permission changes made
    // by Company Admin apply immediately — no more "log out and back in"
    // needed for a permission change to take effect.
    let firstLoad = true;
    profileUnsub = onSnapshot(doc(db, 'companies', session.companyId, 'users', user.uid), (snap) => {
      session.profile = snap.exists() ? snap.data() : null;
      if (session.profile?.suspended) {
        alert('Your account has been suspended by your Company Admin.');
        signOut(auth);
        return;
      }
      if (firstLoad) { firstLoad = false; finishLogin(); }
      else {
        document.getElementById('role-label').textContent = session.profile?.role || '';
        buildNav(); // re-check what's visible + re-render current view with fresh permissions
      }
    });
  }
});

function finishLogin() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('role-label').textContent = session.profile?.role || 'super_admin';
  document.getElementById('header-sub').textContent = session.isSuperAdmin ? 'Platform Admin' : (session.companyName || session.companyId || '');
  const logoImg = document.getElementById('header-logo');
  logoImg.src = session.companyLogoUrl || JUSTCLICK_LOGO;
  logoImg.classList.remove('hidden');
  buildNav();
  if (!session.isSuperAdmin) startBellWatchers();
}

// ── Nav ──────────────────────────────────────────────────────────
function moduleList() {
  if (session.isSuperAdmin) return [{ id:'companies', label:'Companies' }];
  const role = session.profile?.role;
  const base = [{ id:'dashboard', label:'Dashboard' }];
  // company_admin is the account that sets everyone else's permissions, so
  // it always sees everything. Every other role — INCLUDING management —
  // strictly follows the view permission Company Admin actually set for them.
  const canView = (m) => role === 'company_admin' || !!session.profile?.permissions?.[m]?.view;

  if (canView('society')) base.push({ id:'society', label:'Handover Pack' });
  if (canView('possession')) base.push({ id:'possession', label:'Possession Checklist' });
  if (canView('visual')) base.push({ id:'visual', label:'Site Progress' });
  if (canView('tour')) base.push({ id:'tour', label:'Virtual Tour' });
  if (canView('sla')) base.push({ id:'sla', label:'SLA' });
  if (canView('announcements')) base.push({ id:'announcements', label:'Announcements' });
  if (canView('safety')) base.push({ id:'safety', label:'Safety' });
  GENERIC_MODULES.forEach(cfg => {
    if (['society','possession','tour','sla','announcements','safety'].includes(cfg.id)) return; // already placed above
    if (canView(cfg.id)) base.push({ id: cfg.id, label: cfg.label });
  });
  if (canView('activity')) base.push({ id:'activity', label:'Activity Log' });
  if (role === 'company_admin') base.push({ id:'users', label:'Users' }, { id:'projects', label:'Projects' }, { id:'settings', label:'Company Settings' });
  return base;
}

let currentViewId = null;
function buildNav() {
  const nav = document.getElementById('side-nav');
  const mods = moduleList();
  nav.innerHTML = mods.map(m => `<button data-mod="${m.id}" class="nav-btn text-left px-3 py-2 rounded-xl hover:bg-slate-100 whitespace-nowrap shrink-0">${m.label}</button>`).join('');
  nav.querySelectorAll('[data-mod]').forEach(b => b.addEventListener('click', () => renderView(b.dataset.mod)));
  const stillValid = currentViewId && mods.some(m => m.id === currentViewId);
  renderView(stillValid ? currentViewId : mods[0].id);
}

function renderView(id) {
  currentViewId = id;
  clearListeners();
  document.querySelectorAll('#side-nav [data-mod]').forEach(b => b.classList.toggle('bg-blue-50', b.dataset.mod === id));
  const view = document.getElementById('view');
  if (id === 'companies') return renderCompanies(view);
  if (id === 'users') return renderUsers(view);
  if (id === 'projects') return renderProjects(view);
  if (id === 'settings') return renderSettings(view);
  if (id === 'dashboard') return renderDashboard(view);
  if (id === 'visual') return renderVisual(view);
  if (id === 'activity') return renderActivityLog(view);
  const cfg = GENERIC_MODULES.find(m => m.id === id);
  if (cfg) return renderGenericModule(view, cfg);
}

// ── Create an Auth account WITHOUT logging the browser in as that
//    new user — uses a throwaway secondary Firebase App instance so
//    the admin's own session stays active. No Cloud Functions needed.
let secondaryAppCounter = 0;
async function createAuthAccountWithoutSwitchingSession(email, password) {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
  const secondary = appMod.initializeApp(firebaseConfig, 'secondary-' + (secondaryAppCounter++));
  const secondaryAuth = authMod.getAuth(secondary);
  const cred = await authMod.createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = cred.user.uid;
  await authMod.signOut(secondaryAuth);
  await appMod.deleteApp(secondary);
  return uid;
}

function wireRoleSelect(id) {

    el.value = clean;
  });
}

// Single source of truth for the Users screen's permission checklist —
// 'visual' plus every generic module. Stays in sync automatically as
// GENERIC_MODULES grows.
const ALL_MODULES = ['visual', ...GENERIC_MODULES.map(m => m.id), 'activity'];

// Builds the "tick what they can do" field set per module (View / Add /
// Update / Delete) — reused for both Add User and Edit User so
// permissions stay dynamic/editable. A module only ends up in the
// saved permissions object if at least one box is ticked for it.
function moduleFieldsHTML(prefix, existing = {}) {
  return ALL_MODULES.map(m => {
    const ex = existing[m] || {};
    return `
    <div class="border-b border-slate-100 py-1.5">
      <p class="text-xs font-medium capitalize">${m}</p>
      <div class="flex gap-3 mt-1 text-[11px] text-slate-500">
        ${['view','add','update','delete'].map(p => `
          <label class="flex items-center gap-1">
            <input type="checkbox" class="${prefix}-mod-perm" data-mod="${m}" data-perm="${p}" ${ex[p] ? 'checked' : ''}/> ${p}
          </label>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function readModuleFields(prefix) {
  const permissions = {};
  ALL_MODULES.forEach(m => {
    const perms = {};
    let any = false;
    ['view','add','update','delete'].forEach(p => {
      const el = document.querySelector(`.${prefix}-mod-perm[data-mod="${m}"][data-perm="${p}"]`);
      const checked = el ? el.checked : false;
      perms[p] = checked;
      if (checked) any = true;
    });
    if (any) permissions[m] = perms; // only store modules with at least one permission granted
  });
  return permissions;
}

function cleanDocData(data) {
  const out = {};
  for (const [k, v] of Object.entries(data)) {
    out[k] = (v && typeof v.toDate === 'function') ? v.toDate().toISOString() : v;
  }
  return out;
}

async function downloadCompanyBackup() {
  const status = document.getElementById('settings-backup-status');
  status.textContent = 'Preparing backup — this can take a moment for larger companies…';
  status.className = 'text-xs text-slate-500';
  try {
    const companySnap = await getDoc(doc(db, 'companies', session.companyId));
    const usersSnap = await getDocs(collection(db, 'companies', session.companyId, 'users'));
    const projectsSnap = await getDocs(collection(db, 'companies', session.companyId, 'projects'));

    const backup = {
      exportedAt: new Date().toISOString(),
      exportedBy: session.email,
      company: { id: session.companyId, ...cleanDocData(companySnap.data() || {}) },
      users: usersSnap.docs.map(d => ({ id:d.id, ...cleanDocData(d.data()) })),
      projects: []
    };

    const subCollections = ['towers', 'units', 'activityLog', ...GENERIC_MODULES.map(m => m.id)];
    for (const pdoc of projectsSnap.docs) {
      const projectEntry = { id: pdoc.id, ...cleanDocData(pdoc.data()), data: {} };
      for (const col of subCollections) {
        const colSnap = await getDocs(collection(db, 'companies', session.companyId, 'projects', pdoc.id, col));
        projectEntry.data[col] = colSnap.docs.map(d => ({ id:d.id, ...cleanDocData(d.data()) }));
      }
      backup.projects.push(projectEntry);
    }

    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `projecttracker-backup-${(session.companyName||session.companyId).replace(/\s+/g,'_')}-${Date.now()}.json`; a.click();
    URL.revokeObjectURL(url);
    status.textContent = 'Backup downloaded ✓'; status.className = 'text-xs text-emerald-600';
  } catch (err) {
    status.textContent = 'Backup failed: ' + err.message; status.className = 'text-xs text-red-600';
  }
}

async function loadCompanyProjects(unfiltered = false) {
  const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects'));
  const all = snap.docs.map(d => ({ id:d.id, ...d.data() }));

// ── BELL: alerts for overdue tasks, high-severity open snags, SLA risks,
// and pending NOC/AMC. Watches the first project the person has access to
// (same default the Dashboard uses) so it stays useful without extra setup. ─
let bellCache = {};
let bellUnsubs = [];
async function startBellWatchers() {
  bellUnsubs.forEach(u => u());
  bellUnsubs = [];
  bellCache = {};

  const projects = await loadCompanyProjects();
  if (!projects.length) return;
  const projectId = projects[0].id;
  const role = session.profile?.role;
  const canView = (m) => role === 'company_admin' || !!session.profile?.permissions?.[m]?.view;

  ['snags','tasks','sla','nocs'].filter(canView).forEach(m => {
    const colRef = collection(db, 'companies', session.companyId, 'projects', projectId, m);
    const unsub = onSnapshot(colRef, (snap) => {
      bellCache[m] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderBellAlerts();
    }, () => { bellCache[m] = []; });
    bellUnsubs.push(unsub);
  });
}

function computeBellAlerts() {
  const today = new Date().toISOString().slice(0,10);
  const alerts = [];
  (bellCache.tasks || []).filter(t => t.status !== 'done' && t.due_date && t.due_date < today)
    .forEach(t => alerts.push({ icon:'⏰', text:`Overdue task: ${t.title}`, sub:`Due ${t.due_date}` }));
  (bellCache.snags || []).filter(s => s.severity === 'high' && s.status !== 'resolved')
    .forEach(s => alerts.push({ icon:'🔴', text:`High-severity snag: ${s.title}`, sub: s.unit_number || '' }));
  (bellCache.sla || []).filter(s => s.status === 'at_risk' || s.status === 'breached')
    .forEach(s => alerts.push({ icon:'⚠️', text:`SLA ${s.status.replace('_',' ')}: ${s.title}`, sub: s.category || '' }));
  (bellCache.nocs || []).filter(n => n.status !== 'received')
    .forEach(n => alerts.push({ icon:'📄', text:`NOC pending: ${n.name}`, sub: n.status || '' }));
  return alerts;
}

function renderBellAlerts() {
  const alerts = computeBellAlerts();
  const badge = document.getElementById('bell-badge');
  if (badge) {
    if (alerts.length) { badge.textContent = alerts.length > 99 ? '99+' : alerts.length; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
  const panel = document.getElementById('bell-panel');
  if (panel) {
    panel.innerHTML = alerts.length
      ? `<p class="eyebrow text-slate-500 px-2 py-1">Alerts (${alerts.length})</p>` + alerts.map(a => `
          <div class="p-2 rounded-xl hover:bg-slate-50 text-xs flex gap-2 items-start">
            <span>${a.icon}</span>
            <div><p class="font-medium">${escapeHtml(a.text)}</p>${a.sub ? `<p class="text-slate-400">${escapeHtml(a.sub)}</p>` : ''}</div>
          </div>`).join('')
      : '<p class="text-xs text-slate-400 p-3 text-center">No alerts right now 🎉</p>';
  }
}

// ── Gantt chart: built from real Tasks (created_at → due_date), not fake
// seed data. Bars are colored/positioned proportionally across the date
// range of all visible tasks, matching the original app's visual style. ──
function renderGanttChart(tasks) {
  const host = document.getElementById('gantt-chart');
  if (!host) return;
  const withDates = tasks.filter(t => t.due_date && t.created_at?.toDate);
  if (!withDates.length) { host.innerHTML = '<p class="text-slate-400 text-sm">No tasks with due dates yet.</p>'; return; }

  const starts = withDates.map(t => t.created_at.toDate().getTime());
  const ends = withDates.map(t => new Date(t.due_date).getTime());
  const rangeStart = Math.min(...starts);
  const rangeEnd = Math.max(...ends, rangeStart + 86400000);
  const span = rangeEnd - rangeStart || 1;

  const colorFor = (status) => status === 'done' ? 'bg-emerald-500' : status === 'in_progress' ? 'bg-amber-500' : 'bg-slate-400';
  const labelFor = (status) => status === 'done' ? 'Done' : status === 'in_progress' ? 'Active' : 'Planned';
  const toneFor = (status) => status === 'done' ? 'text-emerald-600' : status === 'in_progress' ? 'text-amber-600' : 'text-slate-400';

  host.innerHTML = `<div class="min-w-[480px] space-y-2">` + withDates.map(t => {
    const s = t.created_at.toDate().getTime();
    const e = new Date(t.due_date).getTime();
    const left = ((s - rangeStart) / span) * 100;
    const width = Math.max(((e - s) / span) * 100, 6);
    return `
      <div class="flex items-center gap-2">
        <div class="w-36 shrink-0"><p class="text-xs font-medium truncate">${escapeHtml(t.title||'')}</p><p class="text-[9px] text-slate-400">${escapeHtml(t.due_date)}</p></div>
        <div class="flex-1 h-6 bg-slate-100 rounded-lg relative">
          <div class="absolute top-0.5 bottom-0.5 rounded-md ${colorFor(t.status)} flex items-center justify-end pr-1.5" style="left:${left}%;width:${width}%">
            <span class="text-[9px] font-bold text-white">${t.status === 'done' ? '100' : t.status === 'in_progress' ? '50' : '0'}%</span>
          </div>
        </div>
        <span class="text-[10px] w-14 text-right ${toneFor(t.status)}">${labelFor(t.status)}</span>
      </div>`;
  }).join('') + `</div>`;
}

function renderDashboardAggregates(canView) {
  const updatedEl = document.getElementById('dash-updated-at');
  if (updatedEl) updatedEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Live · updated ${formatDateTime(new Date())}`;

  const units = dashboardCache.visual || [];
  const snags = dashboardCache.snags || [];
  const tasks = dashboardCache.tasks || [];
  const budget = dashboardCache.budget || [];
  const nocs = dashboardCache.nocs || [];
  const assets = dashboardCache.assets || [];
  const amenities = dashboardCache.amenities || [];
  const sla = dashboardCache.sla || [];
  const society = dashboardCache.society || [];

  // "Handover Progress" = completed units ÷ total units (matches your
  // original's "Handover %" — completed is treated as the handover milestone).
  const handoverPct = units.length ? Math.round((units.filter(u => u.status === 'completed').length / units.length) * 100) : null;
  if (canView('visual')) { renderKPIs(units, handoverPct); renderStatusBreakdown(units); }

  const today = new Date().toISOString().slice(0,10);
  const cards2 = [];

  if (canView('snags')) {
    const open = snags.filter(s => s.status !== 'resolved').length;
    const high = snags.filter(s => s.severity === 'high' && s.status !== 'resolved').length;
    cards2.push({ label:'Open Snags', value: open, sub: high ? `${high} high severity` : '', tone: open ? 'text-amber-600' : '', blink: high > 0 });
  }
  if (canView('tasks')) {
    const overdue = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;
    const pending = tasks.filter(t => t.status !== 'done').length;
    cards2.push({ label:'Overdue Tasks', value: overdue, sub: `${pending} pending total`, tone: overdue ? 'text-red-600' : '', blink: overdue > 0 });
    renderGanttChart(tasks);
  }
  if (canView('budget')) {
    const budgeted = budget.reduce((s,b) => s + (Number(b.budgeted_amount) || 0), 0);
    const actual = budget.reduce((s,b) => s + (Number(b.actual_amount) || 0), 0);
    const pct = budgeted ? Math.round((actual / budgeted) * 100) : 0;
    cards2.push({ label:'Budget Used', value: pct + '%', sub: budgeted ? `₹${actual.toLocaleString('en-IN')} of ₹${budgeted.toLocaleString('en-IN')}` : 'No budget entries yet', tone: pct > 100 ? 'text-red-600' : 'text-blue-600' });
  }
  if (canView('nocs')) {
    const pending = nocs.filter(n => n.status !== 'received').length;
    cards2.push({ label:'NOC', value: `${nocs.length - pending}/${nocs.length}`, sub: `${pending} pending`, tone: 'text-purple-600', blink: pending > 0 });
  }
  if (canView('assets')) {
    const ok = assets.filter(a => a.status === 'completed').length;
    cards2.push({ label:'Assets', value: `${ok}/${assets.length}`, sub: 'operational', tone: 'text-cyan-600' });
  }
  if (canView('amenities')) {
    const done = amenities.filter(a => a.status === 'completed').length;
    cards2.push({ label:'Amenities', value: `${done}/${amenities.length}`, sub: 'completed', tone: 'text-teal-600' });
  }
  if (canView('sla')) {
    const risks = sla.filter(s => s.status === 'at_risk' || s.status === 'breached').length;
    cards2.push({ label:'SLA risks', value: risks, sub: 'At risk + breached', tone: 'text-red-600', blink: risks > 0 });
  }
  if (canView('society')) {
    const done = society.filter(s => s.status === 'completed').length;
    const pct = society.length ? Math.round((done / society.length) * 100) : null;
    cards2.push({ label:'Handover Pack', value: society.length ? `${done}/${society.length}` : '—', sub: pct != null ? `${pct}% complete` : 'No checklist items yet', tone: 'text-indigo-600' });
  }
  if (canView('possession')) {
    const possession = dashboardCache.possession || [];
    const done = possession.filter(p => p.status === 'completed').length;
    const pct = possession.length ? Math.round((done / possession.length) * 100) : null;
    cards2.push({ label:'Possession Checklist', value: possession.length ? `${done}/${possession.length}` : '—', sub: pct != null ? `${pct}% complete` : 'No checklist items yet', tone: 'text-cyan-600' });
  }

  const kpi2El = document.getElementById('kpi-cards-2');
  if (kpi2El) {
    kpi2El.innerHTML = cards2.map(c => `
      <div class="glass rounded-2xl p-4 border border-slate-200 ${c.blink ? 'alert-pulse border-amber-300' : ''}">
        <p class="text-2xl font-bold ${c.tone||''} ${c.blink ? 'blink' : ''}">${c.value}</p>
        <p class="eyebrow text-slate-500 mt-1">${c.label}</p>
        ${c.sub ? `<p class="text-[10px] text-slate-400 mt-0.5">${c.sub}</p>` : ''}
      </div>`).join('');
  }
}

function renderKPIs(units, handoverPct) {
  const total = units.length;
  const completed = units.filter(u => u.status === 'completed').length;
  const delayed = units.filter(u => u.status === 'delayed').length;
  const cards = [
    { label:'Total Units', value: total },
    { label:'Handed Over', value: `${completed}/${total}`, tone:'text-emerald-600' },
    { label:'Delayed', value: delayed, tone: delayed ? 'text-red-600':'' },
    { label:'Handover Progress', value: (handoverPct != null ? handoverPct + '%' : '—'), tone:'text-blue-600' }
  ];
  document.getElementById('kpi-cards').innerHTML = cards.map(c => `
    <div class="glass rounded-2xl p-4 border border-slate-200">

// Hand-rolled SVG pie/donut chart — no external chart library needed,
// so it can never fail to load regardless of network/CDN restrictions.
function pieSVG(counts, hexColors) {
  const total = Object.values(counts).reduce((a,b) => a+b, 0) || 1;
  let angle = -90, paths = '', labels = '';
  Object.entries(counts).forEach(([k,v]) => {
    if (!v) return;
    const slice = (v/total)*360;
    const x1 = 50 + 40*Math.cos(angle*Math.PI/180);
    const y1 = 50 + 40*Math.sin(angle*Math.PI/180);
    const midAngle = angle + slice/2;
    angle += slice;
    const x2 = 50 + 40*Math.cos(angle*Math.PI/180);
    const y2 = 50 + 40*Math.sin(angle*Math.PI/180);
    const large = slice > 180 ? 1 : 0;
    paths += `<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${hexColors[k]}"/>`;
    // Count label on the slice itself, in its own color's slice, positioned
    // partway out from center — skipped for slivers too thin to read.
    if (slice >= 18) {
      const lx = 50 + 28*Math.cos(midAngle*Math.PI/180);
      const ly = 50 + 28*Math.sin(midAngle*Math.PI/180);
      labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#ffffff">${v}</text>`;
    }
  });
  const realTotal = Object.values(counts).reduce((a,b) => a+b, 0);
  return `<svg viewBox="0 0 100 100" class="w-full h-full">${paths}${labels}<circle cx="50" cy="50" r="18" fill="white"/>
    <text x="50" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">${realTotal}</text>
    <text x="50" y="59" text-anchor="middle" font-size="6" fill="#94a3b8" letter-spacing="0.5">UNITS</text>
  </svg>`;
}

function renderStatusBreakdown(units) {

  const colors = { completed:'bg-emerald-500', in_progress:'bg-blue-500', delayed:'bg-red-500', on_hold:'bg-amber-500', pending:'bg-slate-400' };
  const hexColors = { completed:'#10b981', in_progress:'#3b82f6', delayed:'#ef4444', on_hold:'#f59e0b', pending:'#94a3b8' };
  const total = units.length || 1;
  const counts = {}; order.forEach(k=>counts[k]=0);
  units.forEach(u => { if (counts[u.status] !== undefined) counts[u.status]++; });
  document.getElementById('status-breakdown').innerHTML = order.map(k => `
    <div>
      <div class="flex justify-between text-xs mb-1">
        <span class="flex items-center gap-1.5 capitalize"><span class="w-2.5 h-2.5 rounded-full ${colors[k]} inline-block"></span>${k.replace('_',' ')}</span>
        <span>${counts[k]} (${Math.round(counts[k]/total*100)}%)</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2"><div class="${colors[k]} h-2 rounded-full" style="width:${counts[k]/total*100}%"></div></div>
    </div>`).join('');

  const donutEl = document.getElementById('status-donut');

}

function circularProgressSVG(pct, size, strokeWidth, color) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (Math.min(pct,100) / 100) * circumference;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0">
    <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="${strokeWidth}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"
      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy="0.35em" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace" fill="#1e293b">${pct}%</text>
  </svg>`;
}

const VALID_STATUSES = ['pending','in_progress','completed','delayed','on_hold'];

async function runBulkImport(projects) {
  const btn = document.getElementById('bi-run');
  const resultEl = document.getElementById('bi-result');
  const fileInput = document.getElementById('bi-file');
  const pasteText = document.getElementById('bi-paste').value.trim();
  resultEl.innerHTML = '';

  let csvText = pasteText;
  if (fileInput.files[0]) csvText = await fileInput.files[0].text();
  if (!csvText) { resultEl.innerHTML = '<p class="text-red-600">Choose a file or paste CSV text first.</p>'; return; }

  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  if (parsed.errors.length) {
    resultEl.innerHTML = `<p class="text-red-600">CSV problem: ${escapeHtml(parsed.errors[0].message)} (row ${parsed.errors[0].row})</p>`;
    return;
  }
  const rows = parsed.data;
  if (!rows.length) { resultEl.innerHTML = '<p class="text-red-600">No data rows found.</p>'; return; }

  btn.disabled = true; btn.textContent = 'Importing…';

  const projectByName = {};
  projects.forEach(p => projectByName[p.name.trim().toLowerCase()] = p.id);
  const towerCache = {}; // `${projectId}::${towerNameLower}` -> towerId
  const errors = [];
  const toCreate = [];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const rowNum = i + 2;
    const unitNumber = (row.unit_number || '').trim();
    const towerName = (row.tower || '').trim();
    const floorName = (row.floor || '').trim();
    const unitType = (row.type || '').trim();
    let status = (row.status || 'pending').trim().toLowerCase();
    const projectNameRaw = (row.project || '').trim();

    if (!unitNumber || !towerName) { errors.push(`Row ${rowNum}: missing unit_number or tower — skipped.`); continue; }
    if (!VALID_STATUSES.includes(status)) { errors.push(`Row ${rowNum}: unknown status "${status}" — defaulted to "pending".`); status = 'pending'; }

    let projectId = visualProjectId;
    if (projectNameRaw) {
      const match = projectByName[projectNameRaw.toLowerCase()];
      if (!match) { errors.push(`Row ${rowNum}: project "${projectNameRaw}" not found — skipped. Add it under Projects first.`); continue; }
      projectId = match;
    }

    const towerKey = `${projectId}::${towerName.toLowerCase()}`;
    if (!(towerKey in towerCache)) {
      const towerSnap = await getDocs(query(
        collection(db, 'companies', session.companyId, 'projects', projectId, 'towers'),
        where('name', '==', towerName)
      ));
      towerCache[towerKey] = towerSnap.empty
        ? (await addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'towers'), { name: towerName })).id
        : towerSnap.docs[0].id;
    }

    toCreate.push({
      projectId,
      data: {
        unit_number: unitNumber, tower_id: towerCache[towerKey], floor_name: floorName, unit_type: unitType,
        status, completion_pct: status === 'completed' ? 100 : 0,
        created_at: serverTimestamp(), updated_by: session.email
      }
    });
  }

  let created = 0;
  for (let i = 0; i < toCreate.length; i += 450) { // Firestore batch limit is 500 writes
    const chunk = toCreate.slice(i, i + 450);
    const batch = writeBatch(db);
    chunk.forEach(item => {
      const ref = doc(collection(db, 'companies', session.companyId, 'projects', item.projectId, 'units'));
      batch.set(ref, item.data);
    });
    try { await batch.commit(); created += chunk.length; }
    catch (err) { errors.push(`Batch write failed: ${err.message}`); }
  }

  btn.disabled = false; btn.textContent = 'Import';
  resultEl.innerHTML = `
    <p class="text-emerald-600 font-semibold">${created} unit(s) imported successfully.</p>
    ${errors.length ? `<div class="text-amber-600 max-h-32 overflow-y-auto space-y-0.5">${errors.map(e => `<p>⚠ ${escapeHtml(e)}</p>`).join('')}</div>` : ''}
  `;
}

const STATUS_COLORS = { completed:'bg-emerald-500', in_progress:'bg-blue-500', delayed:'bg-red-500', on_hold:'bg-amber-500', pending:'bg-slate-300' };
function renderFilteredUnitGrid(canEdit) {
  const grid = document.getElementById('unit-grid');
  if (!grid) return;
  const statusFilter = document.getElementById('unit-status-filter')?.value || '';
  const typeFilter = document.getElementById('unit-type-filter')?.value || '';
  const units = currentTowerUnitsCache.filter(u =>
    (!statusFilter || u.status === statusFilter) && (!typeFilter || u.unit_type === typeFilter)
  );
  const isAdmin = session.profile?.role === 'company_admin';
  grid.innerHTML = units.map(u => {
    const locked = u.status === 'completed' && !isAdmin;
    const clickable = canEdit && !locked;
    return `<div data-unit="${u.id}" class="unit-box relative w-16 h-16 rounded-xl ${STATUS_COLORS[u.status]||'bg-slate-300'} flex flex-col items-center justify-center text-white text-[10px] font-bold ${clickable?'cursor-pointer':''}" title="${escapeHtml(u.unit_number)}${locked?' (locked)':''}">
      ${locked ? '<span class="absolute top-0.5 right-0.5 text-[9px]">🔒</span>' : ''}
      <span class="data-mono">${escapeHtml(u.unit_number)}</span>

    });
    await addDoc(collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'activityLog'), {
      actor: session.email, action: `Updated unit ${unit.unit_number} → ${next} (${pct}%)`, at: serverTimestamp()
    });
    wrap.remove();
  });
}

// ── GENERIC MODULE ENGINE ────────────────────────────────────────
// Powers every module in GENERIC_MODULES: project-scoped, permission-
// gated (view/add/update/delete), real-time list, "+" button opens an
// add modal (matches the original app's UX), edit modal, delete with
// confirm, file uploads, addable categories, and conditional fields.
const genericProjectId = {}; // remembers each module's selected project independently
let annotatedBlobs = {}; // id -> Blob, set when a photo has been annotated before upload
let multiFileState = {}; // id -> array of {url, name}, staged attachments for multifile fields
const customCategoryCache = {}; // `${moduleId}-${fieldKey}` -> extra options added at runtime

async function loadCustomCategories(moduleId, fieldKey) {
  const cacheKey = `${moduleId}-${fieldKey}`;
  if (customCategoryCache[cacheKey]) return customCategoryCache[cacheKey];
  try {
    const snap = await getDoc(doc(db, 'companies', session.companyId, 'customCategories', cacheKey));
    customCategoryCache[cacheKey] = snap.exists() ? (snap.data().options || []) : [];
  } catch { customCategoryCache[cacheKey] = []; }
  return customCategoryCache[cacheKey];
}

async function addCustomCategory(moduleId, fieldKey, newOption) {
  const cacheKey = `${moduleId}-${fieldKey}`;
  const current = await loadCustomCategories(moduleId, fieldKey);
  if (current.includes(newOption)) return;
  const updated = [...current, newOption];
  customCategoryCache[cacheKey] = updated;
  await setDoc(doc(db, 'companies', session.companyId, 'customCategories', cacheKey), { options: updated });
}

// A field is shown unless it declares showFor and the current type-field
// value isn't in that list (used by Safety: training shows different
// fields than incident_report, etc).
function fieldVisible(f, currentTypeValue) {
  if (!f.showFor) return true;
  return f.showFor.includes(currentTypeValue);
}

// Photo fields render two separate inputs (camera capture + gallery/file
// picker) since relying on the OS's unified file picker to always offer a
// direct camera shortcut turned out to be unreliable across phone brands.
// This returns whichever one the person actually used.
function getChosenFile(id) {
  const cameraEl = document.getElementById(`${id}-camera`);
  const fileEl = document.getElementById(`${id}-file`);
  return (cameraEl && cameraEl.files[0]) || (fileEl && fileEl.files[0]) || null;
}

function fileKind(url) {
  const clean = (url || '').split('?')[0].toLowerCase();
  if (/\.(jpg|jpeg|png|gif|webp)$/.test(clean)) return 'image';
  if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return 'video';
  if (/\.pdf$/.test(clean)) return 'pdf';
  return 'other';
}

function filePreviewHTML(url, galleryUrls, galleryIndex) {
  const kind = fileKind(url);
  const urls = galleryUrls || [url];
  const idx = galleryIndex != null ? galleryIndex : 0;
  const lb = `data-lightbox-urls='${escapeHtml(JSON.stringify(urls))}' data-lightbox-index="${idx}"`;
  if (kind === 'image') return `<img src="${escapeHtml(url)}" class="w-full max-h-40 object-cover rounded-lg cursor-pointer" ${lb}/>`;
  if (kind === 'video') return `<video src="${escapeHtml(url)}" controls class="w-full max-h-48 rounded-lg bg-black"></video>`;
  return `<a href="${escapeHtml(url)}" target="_blank" class="text-sm text-blue-600 underline">📎 Open ${kind === 'pdf' ? 'PDF' : 'file'} ↗</a>`;
}

// ── Lightbox: click any photo thumbnail anywhere in the app to open it
// full-screen, with ‹ › arrows to browse the rest of that item's photos. ──
let lightboxUrls = [];
let lightboxIndex = 0;

function wireLightboxThumbnails(root) {
  (root || document).querySelectorAll('[data-lightbox-urls]').forEach(el => {
    if (el.dataset.lbWired) return; // avoid double-binding on repeated repaints
    el.dataset.lbWired = '1';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      try {
        const urls = JSON.parse(el.dataset.lightboxUrls);
        openLightbox(urls, Number(el.dataset.lightboxIndex || 0));
      } catch {}
    });
  });
}

function openLightbox(urls, index) {
  lightboxUrls = urls;
  lightboxIndex = index;
  renderLightbox();
}
function closeLightbox() {
  const host = document.getElementById('lightbox-host');
  if (host) host.innerHTML = '';
}
function renderLightbox() {
  let host = document.getElementById('lightbox-host');
  if (!host) { host = document.createElement('div'); host.id = 'lightbox-host'; document.body.appendChild(host); }
  const url = lightboxUrls[lightboxIndex];
  const kind = fileKind(url);
  const many = lightboxUrls.length > 1;
  host.innerHTML = `
    <div id="lightbox-backdrop" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-2 sm:p-6 overflow-auto">
      <button id="lightbox-close" class="fixed top-3 right-3 text-white text-3xl leading-none w-10 h-10 flex items-center justify-center bg-black/40 rounded-full z-10">✕</button>
      ${many ? `<button id="lightbox-prev" class="fixed left-1 sm:left-4 top-1/2 -translate-y-1/2 text-white text-4xl px-3 py-4 select-none bg-black/30 rounded-full z-10">‹</button>` : ''}
      ${kind === 'video'
        ? `<video src="${escapeHtml(url)}" controls autoplay class="rounded-lg m-auto" style="max-width:95vw;max-height:85vh;width:auto;height:auto;"></video>`
        : `<img id="lightbox-img" src="${escapeHtml(url)}" class="rounded-lg object-contain m-auto cursor-zoom-in" style="max-width:95vw;max-height:85vh;width:auto;height:auto;"/>`}
      ${many ? `<button id="lightbox-next" class="fixed right-1 sm:right-4 top-1/2 -translate-y-1/2 text-white text-4xl px-3 py-4 select-none bg-black/30 rounded-full z-10">›</button>` : ''}
      ${many ? `<p class="fixed bottom-3 left-1/2 -translate-x-1/2 text-white text-xs data-mono bg-black/40 px-2 py-1 rounded-full">${lightboxIndex+1} / ${lightboxUrls.length}</p>` : ''}
    </div>`;
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-backdrop').addEventListener('click', (e) => { if (e.target.id === 'lightbox-backdrop') closeLightbox(); });
  if (many) {
    document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); lightboxIndex = (lightboxIndex - 1 + lightboxUrls.length) % lightboxUrls.length; renderLightbox(); });
    document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); lightboxIndex = (lightboxIndex + 1) % lightboxUrls.length; renderLightbox(); });
  }
  // Tap the photo to toggle between "fit to screen" and full native
  // resolution (scrollable) — for checking fine detail in a site photo.
  const img = document.getElementById('lightbox-img');
  if (img) {
    let zoomed = false;
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      zoomed = !zoomed;
      img.style.maxWidth = zoomed ? 'none' : '95vw';
      img.style.maxHeight = zoomed ? 'none' : '85vh';
      img.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
    });
  }
}
