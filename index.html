    <div id="lightbox-backdrop" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-2 sm:p-6 overflow-auto">
      <button id="lightbox-close" class="fixed top-3 right-3 text-white text-3xl leading-none w-10 h-10 flex items-center justify-center bg-black/40 rounded-full z-10">✕</button>
      ${many ? `<button id="lightbox-prev" class="fixed left-1 sm:left-4 top-1/2 -translate-y-1/2 text-white text-4xl px-3 py-4 select-none bg-black/30 rounded-full z-10">‹</button>` : ''}
      ${kind === 'video'
        ? `<video src="${escapeHtml(url)}" controls autoplay class="rounded-lg m-auto" style="max-width:95vw;max-height:85vh;width:auto;height:auto;"></video>`
        : `<img id="lightbox-img" src="${escapeHtml(url)}" class="rounded-lg object-contain m-auto cursor-zoom-in" style="max-width:95vw;max-height:85vh;"/>`}
      ${many ? `<button id="lightbox-next" class="fixed right-1 sm:right-4 top-1/2 -translate-y-1/2 text-white text-4xl px-3 py-4 select-none bg-black/30 rounded-full z-10">›</button>` : ''}
      ${many ? `<p class="fixed bottom-3 left-1/2 -translate-x-1/2 text-white text-xs data-mono bg-black/40 px-2 py-1 rounded-full">${lightboxIndex+1} / ${lightboxUrls.length}</p>` : ''}
      ${kind !== 'video' && lightboxContext ? `<button id="lightbox-annotate" class="fixed top-3 left-3 text-xs px-3 py-1.5 rounded-lg bg-white/90 font-semibold z-10">✏️ Annotate</button>` : ''}
    </div>`;
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-backdrop').addEventListener('click', (e) => { if (e.target.id === 'lightbox-backdrop') closeLightbox(); });
  document.getElementById('lightbox-annotate')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.textContent = 'Loading…'; btn.disabled = true;
    try {
      // Fetch the stored photo back as a blob so it can be fed into the
      // same annotation editor used at upload time.
      const resp = await fetch(url);
      const blob = await resp.blob();
      const annotated = await openImageAnnotator(blob);
      if (annotated === blob) { btn.textContent = '✏️ Annotate'; btn.disabled = false; return; } // person skipped
      btn.textContent = 'Saving…';
      const newUrl = await uploadFileOrBlob(annotated, lightboxContext.moduleId, 'annotated.jpg', lightboxContext.projectId);
      await lightboxContext.onAnnotated(url, newUrl);
      closeLightbox();
    } catch (err) {
      btn.textContent = '✏️ Annotate'; btn.disabled = false;
      uiAlert('Could not annotate this photo: ' + err.message + '\n\nIf this keeps happening, the storage bucket needs its CORS setting applied (see cors.json in the deployment notes).');
    }
  });
  if (many) {
    document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); lightboxIndex = (lightboxIndex - 1 + lightboxUrls.length) % lightboxUrls.length; renderLightbox(); });
    document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); lightboxIndex = (lightboxIndex + 1) % lightboxUrls.length; renderLightbox(); });
  }
  // Small source photos previously got stretched to fill the screen
  // regardless of resolution, which looked blurry. Now: once we know the
  // real pixel size, scale up only as far as looks reasonably sharp
  // (capped at 2x native resolution), and never touch large photos —
  // they just fit-to-screen at full quality as before.
  const img = document.getElementById('lightbox-img');
  if (img) {
    let baseWidth, baseHeight;
    const applySize = () => {
      img.style.width = baseWidth + 'px';
      img.style.height = baseHeight + 'px';
    };
    img.addEventListener('load', () => {
      const vw = window.innerWidth * 0.95, vh = window.innerHeight * 0.85;
      const scaleToFit = Math.min(vw / img.naturalWidth, vh / img.naturalHeight);
      const scale = Math.min(scaleToFit, 2); // cap upscaling at 2x to avoid heavy blur
      baseWidth = Math.round(img.naturalWidth * scale);
      baseHeight = Math.round(img.naturalHeight * scale);
      img.style.maxWidth = '95vw'; img.style.maxHeight = '85vh';
      applySize();
    });
    if (img.complete && img.naturalWidth) img.dispatchEvent(new Event('load')); // already-cached image
    let zoomed = false;
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      zoomed = !zoomed;
      if (zoomed) {
        img.style.width = 'auto'; img.style.height = 'auto';
        img.style.maxWidth = 'none'; img.style.maxHeight = 'none';
      } else {
        img.style.maxWidth = '95vw'; img.style.maxHeight = '85vh';
        if (baseWidth) applySize();
      }
      img.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
    });
  }
}

function genericFieldHTML(f, existingValue, prefix, extraCategoryOptions, item) {
  const id = `${prefix}-${f.key}`;
  const label = `${escapeHtml(f.label)}${f.required ? ' *' : ''}`;
  const lab = `<label class="text-[10px] text-slate-500">${label}</label>`;
  const inputCls = 'w-full border rounded-lg px-2 py-1.5 text-sm';
  const optionTag = (value, text, selected) => `<option value="${escapeHtml(value)}" ${selected ? 'selected' : ''}>${escapeHtml(text)}</option>`;
  // A saved value that is no longer in the option list is kept as an option —
  // otherwise opening the form silently switched it to the first choice.
  const withSaved = (options) => (existingValue !== undefined && existingValue !== null && existingValue !== '' && !options.includes(existingValue)) ? [...options, existingValue] : options;
  const wrap = (inner) => `<div data-field-wrap="${f.key}">${inner}</div>`;

  if (f.type === 'computed') {
    if (existingValue === undefined || existingValue === null || existingValue === '') return '';
    return wrap(`${lab}<p class="text-sm data-mono text-slate-600">${escapeHtml(inrFmt(existingValue))} <span class="text-[10px] text-slate-400">(recalculated when you save)</span></p>`);
  }
  if (f.type === 'rows') {
    const rows = Array.isArray(existingValue) && existingValue.length ? existingValue : [{}];
    const lists = [...new Set(f.cols.map(c => c.list).filter(Boolean))].map(l => `<datalist id="dl-${l}">${ROW_LISTS[l]().map(o => `<option value="${escapeHtml(o)}"></option>`).join('')}</datalist>`).join('');
    return wrap(`${lab}
      <div id="${id}" data-cols="${escapeHtml(JSON.stringify(f.cols))}" class="space-y-1">${rows.map(r => rowsRowHTML(f, r)).join('')}</div>
      <button type="button" data-rows-add="${id}" class="text-xs text-blue-600 mt-1">+ Add row</button>${lists}`);
  }
  if (f.type === 'textarea') return wrap(`${lab}
    <textarea id="${id}" class="${inputCls}" rows="2">${escapeHtml(existingValue||'')}</textarea>`);
  if (f.type === 'select') return wrap(`${lab}<select id="${id}" class="${inputCls}">${withSaved(f.options).map(o => optionTag(o, o, o === existingValue)).join('')}</select>`);
  if (f.type === 'select-addable') {
    const allOptions = withSaved([...new Set([...(f.allowBlank ? [''] : []), ...f.options, ...(extraCategoryOptions||[])])]);
    return wrap(`${lab}
      <select id="${id}" class="${inputCls}">
        ${allOptions.map(o => optionTag(o, o === '' ? '— None —' : o, o === (existingValue || (f.allowBlank ? '' : undefined)))).join('')}
        <option value="__add_new__">+ Add new…</option>
      </select>`);
  }
  if (f.type === 'date') return wrap(`${lab}<input id="${id}" type="date" value="${escapeHtml(existingValue||'')}" class="${inputCls}"/>`);
  if (f.type === 'tel') return wrap(`${lab}<div class="flex items-center gap-2"><input id="${id}" type="tel" value="${escapeHtml(existingValue||'')}" class="${inputCls}"/>${existingValue ? `<a href="tel:${escapeHtml(String(existingValue).replace(/[^\d+]/g,''))}" class="shrink-0 text-xs px-2 py-1.5 rounded-lg border text-blue-600">📞 Call</a>` : ''}</div>`);
  if (f.type === 'user-select') {
    const users = extraCategoryOptions || [];
    const formatted = users.map(u => `${u.name} <${u.email}>`);
    // Keep whatever was already saved as a selectable option too, even if
    // it doesn't match any current user.
    const options = withSaved(formatted);
    return wrap(`${lab}
      <select id="${id}" class="${inputCls}">
        <option value="">— Unassigned —</option>
        ${options.map(o => optionTag(o, o, o === existingValue)).join('')}
      </select>`);
  }
  if (f.type === 'ref-select') {
    const opts = extraCategoryOptions || [];
    formRefOptions[id] = opts;
    const existingId = item ? (item[f.key + '_id'] || '') : '';
    let selectedId = existingId && opts.some(o => o.id === existingId) ? existingId : '';
    if (!selectedId && existingValue) {
      const byValue = opts.filter(o => o.value === existingValue);
      if (byValue.length === 1) selectedId = byValue[0].id;
    }
    const legacy = !!existingValue && !selectedId; // typed before this became a list, or the record it pointed to is gone
    return wrap(`${lab}
      <select id="${id}" class="${inputCls}">
        <option value="">— ${f.required ? 'Choose' : 'None'} —</option>
        ${legacy ? optionTag('__keep__', `${existingValue} (as saved)`, true) : ''}
        ${opts.map(o => optionTag(o.id, o.label, o.id === selectedId)).join('')}
      </select>
      ${!opts.length ? `<p class="text-[10px] text-slate-400 mt-0.5">Nothing to choose from yet — add it under "${escapeHtml(moduleLabel(f.source === 'units' ? 'visual' : f.source))}" first.</p>` : ''}`);
  }
  if (f.type === 'number') return wrap(`${lab}<input id="${id}" type="number" step="any" inputmode="decimal" value="${escapeHtml(existingValue != null ? existingValue : '')}" class="${inputCls}"/>`);
  const isPhotoField = (f.accept || '').startsWith('image/');
  const accept = escapeHtml(f.accept || 'image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx');
  const pickers = isPhotoField ? `<div class="flex gap-2 mb-1">
        <label class="flex-1 text-xs px-2 py-1.5 rounded-lg border text-center cursor-pointer bg-white">📷 Take Photo<input id="${id}-camera" type="file" accept="${accept}" capture="environment" class="hidden"/></label>
        <label class="flex-1 text-xs px-2 py-1.5 rounded-lg border text-center cursor-pointer bg-white">🖼️ Gallery / File<input id="${id}-file" type="file" accept="${accept}" class="hidden"/></label>
      </div>` : `<input id="${id}-file" type="file" accept="${accept}" class="w-full text-xs mb-1"/>`;
  if (f.type === 'file') return wrap(`${lab}
    ${existingValue ? `<div class="border rounded-lg p-2 mb-2 bg-slate-50"><p class="eyebrow text-slate-400 mb-1">Current</p>${filePreviewHTML(existingValue)}</div>` : ''}
    <div class="border border-dashed rounded-lg p-2">
      <p class="eyebrow text-slate-400 mb-1">${existingValue ? 'Replace with' : 'Add'}</p>
      <input id="${id}-url" type="url" placeholder="Paste a link (https://…)" class="${inputCls} mb-1"/>
      ${pickers}
      <div id="${id}-preview"></div>
      <button type="button" id="${id}-annotate-btn" class="hidden mt-1.5 text-xs px-2 py-1 rounded-lg border bg-amber-50">✏️ Annotate this photo</button>
      <p id="${id}-annotate-status" class="hidden text-[11px] text-emerald-600 mt-1">✓ Annotated version ready</p>
    </div>`);
  if (f.type === 'multifile') {
    const items = Array.isArray(existingValue) ? existingValue : (existingValue ? [{ url: existingValue }] : []);
    return wrap(`${lab}
      <div id="${id}-list" class="space-y-2 mb-2" data-initial="${escapeHtml(JSON.stringify(items))}"></div>
      <div class="border border-dashed rounded-lg p-2">
        <p class="eyebrow text-slate-400 mb-1">Add attachment</p>
        <input id="${id}-url" type="url" placeholder="Paste a link (https://…)" class="${inputCls} mb-1"/>
        ${pickers}
        <div id="${id}-preview"></div>
        <button type="button" id="${id}-annotate-btn" class="hidden mb-1 text-xs px-2 py-1 rounded-lg border bg-amber-50">✏️ Annotate this photo</button>
        <p id="${id}-annotate-status" class="hidden text-[11px] text-emerald-600 mb-1">✓ Annotated version ready</p>
        <button type="button" id="${id}-add-btn" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white">+ Add to list</button>
        <p id="${id}-add-status" class="text-[11px] mt-1"></p>
      </div>`);
  }
  if (f.type === 'notes-thread') {
    const entries = Array.isArray(existingValue) ? existingValue : (existingValue ? [{ text: existingValue, author: 'earlier record', at: null }] : []);
    return wrap(`${lab}
      <div id="${id}-thread" class="space-y-2 mb-2 max-h-48 overflow-y-auto">
        ${entries.length ? entries.map(e => `
          <div class="border-l-2 border-slate-200 pl-2">
            <p class="text-sm" style="white-space:pre-wrap">${escapeHtml(e.text)}</p>
            <p class="text-[10px] text-slate-400">${escapeHtml(e.author || '')}${e.at ? ' · ' + formatDateTime(new Date(e.at)) : ''}</p>
          </div>`).join('') : '<p class="text-xs text-slate-400">No remarks yet.</p>'}
      </div>
      <div id="${id}-addbox" class="border border-dashed rounded-lg p-2">
        <textarea id="${id}-newtext" placeholder="Add a remark — everyone can see the full history, nothing gets erased" rows="2" class="${inputCls} mb-1"></textarea>
        <button type="button" id="${id}-add-btn" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white">+ Add Remark</button>
        <p id="${id}-add-status" class="text-[11px] mt-1"></p>
      </div>`);
  }
  if (f.type === 'building-checklist') {
    const towers = extraCategoryOptions || [];
    const ticked = existingValue && typeof existingValue === 'object' ? existingValue : {};
    if (!towers.length) return wrap(`${lab}<p class="text-xs text-slate-400">No buildings/towers set up yet — add them under Site Progress first.</p>`);
    return wrap(`<label class="text-[10px] text-slate-500">${label} — tick which are done</label>
      <div class="flex flex-wrap gap-2 mt-1">
        ${towers.map(t => `<label class="flex items-center gap-1.5 text-xs border rounded-lg px-2 py-1.5"><input type="checkbox" id="${id}-${escapeHtml(t.id)}" class="${id}-tower-cb" data-tower-id="${escapeHtml(t.id)}" data-tower-name="${escapeHtml(t.name)}" ${ticked[t.id]?.done?'checked':''}/> ${escapeHtml(t.name)}</label>`).join('')}
      </div>`);
  }
  if (f.type === 'tower-select') {
    const towers = extraCategoryOptions || [];
    const options = withSaved(f.allOption ? [f.allOption, ...towers.map(t => t.name)] : [...towers.map(t => t.name), 'Common Area']);
    return wrap(`${lab}
      <select id="${id}" class="${inputCls}">
        ${options.map(o => optionTag(o, o, o === existingValue)).join('')}
      </select>`);
  }
  return wrap(`${lab}<input id="${id}" type="text" value="${escapeHtml(existingValue||'')}" class="${inputCls}"/>`);
}

// Wires "+Add new…" behavior for any select-addable fields in a form,
// shows/hides conditional fields (Safety type-dependent fields), and the
// attachment, annotation and remark controls.
function wireDynamicFieldBehavior(cfg, prefix, projectId, item) {
  cfg.fields.filter(f => f.type === 'select-addable').forEach(f => {
    const el = document.getElementById(`${prefix}-${f.key}`);
    if (!el) return;
    let previous = el.value;
    el.addEventListener('change', async () => {
      if (el.value !== '__add_new__') { previous = el.value; return; }
      const newVal = ((await uiPrompt(`New ${f.label}:`)) || '').trim();
      if (!newVal) { el.value = previous; return; }
      if (![...el.options].some(o => o.value === newVal)) {
        const [catModule, catKey] = f.vendorList ? ['shared', 'vendor'] : (f.cat || [cfg.id, f.key]);
        await addCustomCategory(catModule, catKey, newVal);
        const opt = document.createElement('option');
        opt.value = newVal; opt.textContent = newVal;
        el.insertBefore(opt, el.lastElementChild);
      }
      el.value = newVal;
      previous = newVal;
    });
  });

  // Choosing a linked record can fill in related fields (e.g. picking a bill
  // fills the vendor on a payment).
  cfg.fields.filter(f => f.type === 'ref-select' && f.copy).forEach(f => {
    const el = document.getElementById(`${prefix}-${f.key}`);
    if (!el) return;
    el.addEventListener('change', () => {
      const opt = (formRefOptions[`${prefix}-${f.key}`] || []).find(o => o.id === el.value);
      if (!opt) return;
      Object.entries(f.copy).forEach(([k, fn]) => {
        const target = document.getElementById(`${prefix}-${k}`);
        if (!target) return;
        const v = fn(opt.data, {});
        if (!v) return;
        if (target.tagName === 'SELECT' && ![...target.options].some(o => o.value === v)) {
          const o = document.createElement('option');
          o.value = v; o.textContent = v;
          target.insertBefore(o, target.lastElementChild);
        }
        target.value = v;
      });
    });
  });

  if (cfg.conditionalOn) {
    const typeEl = document.getElementById(`${prefix}-${cfg.conditionalOn}`);
    if (typeEl) {
      const root = typeEl.closest('.fixed') || document;
      const applyVisibility = () => {
        cfg.fields.forEach(f => {
          const wrap = root.querySelector(`[data-field-wrap="${f.key}"]`);
          if (!wrap) return;
          wrap.style.display = fieldVisible(f, typeEl.value) ? '' : 'none';
          // Some fields (like Safety's Status) offer different options per
          // type — e.g. a Rule is active/archived, but an Incident Report
          // is open/closed. Swap the dropdown's options to match, keeping the
          // current choice whenever it is valid for that type.
          if (f.optionsByType) {
            const selectEl = document.getElementById(`${prefix}-${f.key}`);
            if (!selectEl) return;
            const opts = f.optionsByType[typeEl.value] || f.options;
            const current = selectEl.value;
            selectEl.innerHTML = opts.map(o => `<option value="${escapeHtml(o)}" ${o===current?'selected':''}>${escapeHtml(o)}</option>`).join('');
            if (!opts.includes(current)) selectEl.value = opts[0];
          }
        });
      };
      typeEl.addEventListener('change', applyVisibility);
      applyVisibility();
    }
  }

  // Annotate button: appears when an image is selected for a file/multifile field.
  cfg.fields.filter(f => f.type === 'file' || f.type === 'multifile').forEach(f => {
    const id = `${prefix}-${f.key}`;
    const fileInput = document.getElementById(`${id}-file`);
    const cameraInput = document.getElementById(`${id}-camera`);
    const annotateBtn = document.getElementById(`${id}-annotate-btn`);
    if (!annotateBtn) return;
    let previewUrl = null;
    const onPick = (e) => {
      // Only one of camera/gallery holds the pick at a time.
      if (e?.target === cameraInput && fileInput) fileInput.value = '';
      if (e?.target === fileInput && cameraInput) cameraInput.value = '';
      const file = getChosenFile(id);
      delete annotatedBlobs[id];
      document.getElementById(`${id}-annotate-status`)?.classList.add('hidden');
      annotateBtn.classList.toggle('hidden', !(file && file.type.startsWith('image/')));
      // Immediate visual confirmation that a photo was actually picked.
      const previewEl = document.getElementById(`${id}-preview`);
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
      if (previewEl) {
        if (file && file.type.startsWith('image/')) {
          previewUrl = URL.createObjectURL(file);
          previewEl.innerHTML = `<div class="flex items-center gap-2 mt-1.5">
            <img src="${previewUrl}" class="w-14 h-14 rounded object-cover border"/>
            <span class="text-[11px] text-emerald-600">✓ Photo ready — ${escapeHtml(file.name || 'photo')}</span>
          </div>`;
        } else if (file) {
          previewEl.innerHTML = `<p class="text-[11px] text-emerald-600 mt-1.5">✓ File ready — ${escapeHtml(file.name)}</p>`;
        } else {
          previewEl.innerHTML = '';
        }
      }
    };
    if (fileInput) fileInput.addEventListener('change', onPick);
    if (cameraInput) cameraInput.addEventListener('change', onPick);
    annotateBtn.addEventListener('click', async () => {
      const file = getChosenFile(id);
      if (!file) return;
      const blob = await openImageAnnotator(file);
      if (blob === file) return; // skipped
      annotatedBlobs[id] = blob;
      document.getElementById(`${id}-annotate-status`)?.classList.remove('hidden');
    });
  });

  // Multifile: render current list with Remove buttons, wire "Add to list".
  cfg.fields.filter(f => f.type === 'multifile').forEach(f => {
    const id = `${prefix}-${f.key}`;
    const listEl = document.getElementById(`${id}-list`);
    if (!listEl) return;
    try { multiFileState[id] = JSON.parse(listEl.dataset.initial || '[]'); } catch { multiFileState[id] = []; }
    function paintList() {
      const urls = multiFileState[id].map(x => x.url);
      listEl.innerHTML = multiFileState[id].map((att, i) => `
        <div class="border rounded-lg p-2 flex items-start gap-2">
          <div class="flex-1 min-w-0">${filePreviewHTML(att.url, urls, i)}${att.name ? `<p class="text-xs mt-1 truncate">${escapeHtml(att.name)}</p>` : ''}</div>
          <button type="button" data-remove-idx="${i}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600 shrink-0">Remove</button>
        </div>`).join('') || `<p class="text-xs text-slate-400">No attachments yet.</p>`;
      listEl.querySelectorAll('[data-remove-idx]').forEach(b => b.addEventListener('click', () => {
        multiFileState[id].splice(Number(b.dataset.removeIdx), 1);
        paintList();
      }));
      wireLightboxThumbnails(listEl, multiFilePainters[id]?.context);
    }
    multiFilePainters[id] = { paint: paintList, context: null };
    paintList();

    const addBtn = document.getElementById(`${id}-add-btn`);
    if (!addBtn) return;
    addBtn.addEventListener('click', async () => {
      const urlEl = document.getElementById(`${id}-url`);
      const fileEl = document.getElementById(`${id}-file`);
      const cameraEl = document.getElementById(`${id}-camera`);
      const statusEl = document.getElementById(`${id}-add-status`);
      const chosenFile = getChosenFile(id);
      const say = (t, tone) => { statusEl.textContent = t; statusEl.className = `text-[11px] mt-1 ${tone}`; };
      if ((annotatedBlobs[id] || chosenFile) && !navigator.onLine) {
        say("You're offline — just press Save. This photo will upload by itself when the connection is back.", 'text-amber-600');
        return;
      }
      addBtn.disabled = true; say('Adding…', 'text-slate-500');
      try {
        let url = '';
        if (annotatedBlobs[id]) {
          url = await uploadFileOrBlob(annotatedBlobs[id], cfg.id, 'annotated.jpg', projectId);
        } else if (chosenFile) {
          url = await uploadFileOrBlob(chosenFile, cfg.id, chosenFile.name, projectId);
        } else if (urlEl.value.trim()) {
          url = normalizeLink(urlEl.value);
        } else {
          say('Paste a link or choose a file first.', 'text-red-600');
          return;
        }
        multiFileState[id].push({ url, name: (annotatedBlobs[id] ? 'annotated.jpg' : (chosenFile?.name || '')) });
        paintList();
        urlEl.value = ''; if (fileEl) fileEl.value = ''; if (cameraEl) cameraEl.value = '';
        delete annotatedBlobs[id];
        document.getElementById(`${id}-annotate-btn`)?.classList.add('hidden');
        document.getElementById(`${id}-annotate-status`)?.classList.add('hidden');
        const previewEl = document.getElementById(`${id}-preview`);
        if (previewEl) previewEl.innerHTML = '';
        say('Added ✓ — press Save to keep it.', 'text-emerald-600');
      } catch (err) {
        say(err.message, 'text-red-600');
      } finally {
        addBtn.disabled = false;
      }
    });
  });

  // Remarks thread: each new remark is appended directly to Firestore right
  // away (not part of the main form's Save button) — this is what makes it
  // an actual running history rather than something the next edit overwrites.
  cfg.fields.filter(f => f.type === 'notes-thread').forEach(f => {
    const id = `${prefix}-${f.key}`;
    const addBox = document.getElementById(`${id}-addbox`);
    if (!addBox) return;
    if (!item) {
      // No item yet (this is the "Add new" form) — remarks only make sense
      // once the record exists.
      addBox.innerHTML = `<p class="text-xs text-slate-400">Save this first — you can add remarks afterward.</p>`;
      return;
    }
    const addBtn = document.getElementById(`${id}-add-btn`);
    addBtn.addEventListener('click', async () => {
      const textEl = document.getElementById(`${id}-newtext`);
      const statusEl = document.getElementById(`${id}-add-status`);
      const text = textEl.value.trim();
      if (!text) { statusEl.textContent = 'Write something first.'; statusEl.className = 'text-[11px] mt-1 text-red-600'; return; }
      addBtn.disabled = true; statusEl.textContent = 'Adding…'; statusEl.className = 'text-[11px] mt-1 text-slate-500';
      try {
        const entry = { text, author: session.profile?.name ? `${session.profile.name} (${session.email})` : session.email, at: new Date().toISOString() };
        const legacy = (typeof item[f.key] === 'string' && item[f.key].trim()) ? [{ text: item[f.key], author: 'earlier record', at: null }] : null;
        await settleWrite(updateDoc(doc(db, 'companies', session.companyId, 'projects', projectId, cfg.id, item.id), {
          [f.key]: legacy ? [...legacy, entry] : arrayUnion(entry)
        }));
        if (legacy) item[f.key] = [...legacy, entry];
        const threadEl = document.getElementById(`${id}-thread`);
        const emptyMsg = threadEl.querySelector('p.text-slate-400.text-xs');
        if (emptyMsg) emptyMsg.remove();
        threadEl.insertAdjacentHTML('beforeend', `
          <div class="border-l-2 border-slate-200 pl-2">
            <p class="text-sm" style="white-space:pre-wrap">${escapeHtml(entry.text)}</p>
            <p class="text-[10px] text-slate-400">${escapeHtml(entry.author)} · ${formatDateTime(new Date(entry.at))}</p>
          </div>`);
        threadEl.scrollTop = threadEl.scrollHeight;
        textEl.value = '';
        statusEl.textContent = 'Added ✓'; statusEl.className = 'text-[11px] mt-1 text-emerald-600';
      } catch (err) {
        statusEl.textContent = err.message; statusEl.className = 'text-[11px] mt-1 text-red-600';
      } finally {
        addBtn.disabled = false;
      }
    });
  });

}

// Shared upload helper: compresses images automatically, sets correct
// contentType so images/videos preview inline instead of force-downloading,
// shows progress, and refuses files too large to be practical on site.
const MAX_FILE_MB = 25;
const MAX_VIDEO_MB = 200;
function showUploadProgress(name) {
  const el = toast('', 'info', 0);
  el.innerHTML = `<p class="mb-1">Uploading ${escapeHtml(String(name).slice(0, 40))}… <span data-pct>0%</span></p><div class="w-48 h-1.5 bg-white/30 rounded-full"><div data-bar class="h-1.5 bg-white rounded-full" style="width:0%"></div></div>`;
  return {
    set(frac) { const pct = Math.round((frac || 0) * 100) + '%'; el.querySelector('[data-pct]').textContent = pct; el.querySelector('[data-bar]').style.width = pct; },
    done() { el.remove(); }
  };
}
async function uploadFileOrBlob(fileOrBlob, moduleId, name, projectId) {
  if (!navigator.onLine) throw new Error("You're offline — files can only upload with a connection.");
  let toUpload = fileOrBlob;
  let contentType = fileOrBlob.type || 'application/octet-stream';
  let finalName = name || 'file';
  if (contentType.startsWith('image/') && contentType !== 'image/jpeg') {
    toUpload = await compressImage(fileOrBlob);
    contentType = 'image/jpeg';
  } else if (contentType === 'image/jpeg' && fileOrBlob.size > 900000) {
    toUpload = await compressImage(fileOrBlob); // already jpeg but large — still shrink it
  }
  // Photos are always re-encoded as JPEG above, but the original filename
  // (from a phone) is often .HEIC, .PNG, or uppercase .JPG — force the
  // extension to match the real content so it is recognised as a photo later.
  if (contentType === 'image/jpeg') finalName = finalName.replace(/\.[^.]+$/, '') + '.jpg';
  const mb = toUpload.size / 1048576;
  const limit = contentType.startsWith('video/') ? MAX_VIDEO_MB : MAX_FILE_MB;
  if (mb > limit) throw new Error(`This file is ${Math.round(mb)} MB — the limit is ${limit} MB${contentType.startsWith('video/') ? ' for videos' : ''}.`);
  const safeName = finalName.replace(/[^\w.\-]+/g, '_').slice(-80);
  const fileRef = ref(storage, `companies/${session.companyId}/projects/${projectId}/${moduleId}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safeName}`);
  const bar = showUploadProgress(finalName);
  try {
    await new Promise((resolve, reject) => {
      const task = uploadBytesResumable(fileRef, toUpload, { contentType });
      task.on('state_changed', (s) => bar.set(s.totalBytes ? s.bytesTransferred / s.totalBytes : 0), reject, resolve);
    });
  } finally { bar.done(); }
  return getDownloadURL(fileRef);
}

// Best-effort removal of files this app stored, once nothing points at them.
function deleteStoredFiles(urls) {
  [...new Set(urls || [])].filter(u => /firebasestorage|\.appspot\.com|storage\.googleapis/.test(String(u))).forEach(u => {
    try { deleteObject(ref(storage, u)).catch(() => {}); } catch { /* not one of ours */ }
  });
}
function fileUrlsOf(cfg, item) {
  const urls = [];
  cfg.fields.forEach(f => {
    const v = item?.[f.key];
    if (f.type === 'file' && v) urls.push(v);
    if (f.type === 'multifile') (Array.isArray(v) ? v : (v ? [{ url: v }] : [])).forEach(a => a?.url && urls.push(a.url));
  });
  if (item?.signoff?.url) urls.push(item.signoff.url);
  return urls;
}

// ── Offline photo queue: a photo picked with no signal is kept on the
// device (IndexedDB) and attached to its record automatically once the
// connection is back — even if the app was closed in between. ───────────
function queueDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('pt-upload-queue', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('items', { keyPath: 'key', autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function queueUpload(entry) {
  const dbx = await queueDb();
  await new Promise((resolve, reject) => {
    const tx = dbx.transaction('items', 'readwrite');
    tx.objectStore('items').add(entry);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
  dbx.close();
}
let flushingQueue = false;
async function flushUploadQueue() {
  if (flushingQueue || !navigator.onLine || !session.companyId || !window.indexedDB) return;
  flushingQueue = true;
  try {
    const dbx = await queueDb();
    const all = await new Promise((resolve, reject) => {
      const req = dbx.transaction('items', 'readonly').objectStore('items').getAll();
      req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error);
    });
    let done = 0;
    for (const it of all.filter(x => x.companyId === session.companyId)) {
      try {
        const url = await uploadFileOrBlob(it.blob, it.moduleId, it.name, it.projectId);
        await updateDoc(doc(db, 'companies', it.companyId, 'projects', it.projectId, it.moduleId, it.docId),
          it.single ? { [it.fieldKey]: url } : { [it.fieldKey]: arrayUnion({ url, name: it.name }) });
        await new Promise((resolve) => { const tx = dbx.transaction('items', 'readwrite'); tx.objectStore('items').delete(it.key); tx.oncomplete = resolve; tx.onerror = resolve; });
        done++;
      } catch (err) { console.warn('Queued upload still waiting:', err?.message || err); }
    }
    dbx.close();
    if (done) toast(`${done} photo(s)/file(s) saved offline have now uploaded ✓`, 'success', 5000);
  } catch (err) { console.warn('Upload queue unavailable:', err?.message || err); }
  finally { flushingQueue = false; }
}
window.addEventListener('online', () => setTimeout(flushUploadQueue, 2000));

// ── Image compression: resize + re-encode as JPEG before upload. Runs on
// every photo uploaded anywhere in the app (single-file and multi-file). ─
function compressImage(fileOrBlob, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(fileOrBlob);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { URL.revokeObjectURL(url); blob ? resolve(blob) : reject(new Error('This image could not be processed.')); }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This image format could not be read on this device. Try taking the photo as JPEG.')); };
    img.src = url;
  });
}

// ── Image annotation editor: pen, arrow, rectangle, circle, text — each
// with a color picker — drawn on a canvas over the photo before upload.
// Resolves with the flattened image as a Blob (already compressed size). ─
function openImageAnnotator(fileOrBlob) {
  return new Promise((resolve) => {
    const modalHost = document.createElement('div');
    document.body.appendChild(modalHost);
    const img = new Image();
    const objUrl = URL.createObjectURL(fileOrBlob);

    img.onload = () => {
      const maxW = Math.min(window.innerWidth - 40, 640);
      const scale = Math.min(1, maxW / img.width);
      const cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);

      modalHost.innerHTML = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3">
          <div class="bg-white rounded-2xl p-3 max-w-full space-y-2">
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              <button data-tool="pen" class="ann-tool px-2 py-1 rounded-lg border bg-slate-100">✏️ Pen</button>
              <button data-tool="arrow" class="ann-tool px-2 py-1 rounded-lg border">↗️ Arrow</button>
              <button data-tool="rect" class="ann-tool px-2 py-1 rounded-lg border">▭ Rectangle</button>
              <button data-tool="circle" class="ann-tool px-2 py-1 rounded-lg border">◯ Circle</button>
              <button data-tool="text" class="ann-tool px-2 py-1 rounded-lg border">🅰️ Text</button>
              <span class="w-px h-5 bg-slate-200 mx-1"></span>
              ${['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#000000','#ffffff'].map(c => `<button data-color="${c}" class="ann-color w-5 h-5 rounded-full border-2 ${c==='#ef4444'?'border-slate-800':'border-slate-200'}" style="background:${c}"></button>`).join('')}
              <span class="w-px h-5 bg-slate-200 mx-1"></span>
              <button id="ann-undo" class="px-2 py-1 rounded-lg border">↶ Undo</button>
              <button id="ann-clear" class="px-2 py-1 rounded-lg border">Clear</button>
            </div>
            <canvas id="ann-canvas" width="${cw}" height="${ch}" class="border rounded-lg touch-none max-w-full"></canvas>
            <p class="text-[10px] text-slate-400">Tip: drag any text you've added to reposition it.</p>
            <div class="flex gap-2">
              <button id="ann-use" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Use This Photo</button>
              <button id="ann-skip" class="flex-1 py-2 rounded-xl border text-sm">Skip Annotation</button>
            </div>
          </div>
        </div>`;

      const canvas = modalHost.querySelector('#ann-canvas');
      const ctx = canvas.getContext('2d');
      let tool = 'pen', color = '#ef4444';
      const shapes = []; // committed shapes, for undo + redraw
      let current = null;

      function redraw() {
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        [...shapes, current].filter(Boolean).forEach(drawShape);
      }
      function drawShape(s) {
        ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
        if (s.type === 'pen') {
          ctx.beginPath();
          s.points.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
          ctx.stroke();
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x1, s.y1, s.x2-s.x1, s.y2-s.y1);
        } else if (s.type === 'circle') {
          const rx = Math.abs(s.x2-s.x1)/2, ry = Math.abs(s.y2-s.y1)/2;
          const cx = (s.x1+s.x2)/2, cy = (s.y1+s.y2)/2;
          ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2*Math.PI); ctx.stroke();
        } else if (s.type === 'arrow') {
          const angle = Math.atan2(s.y2-s.y1, s.x2-s.x1);
          ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
          const headLen = 12;
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - headLen*Math.cos(angle-Math.PI/6), s.y2 - headLen*Math.sin(angle-Math.PI/6));
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - headLen*Math.cos(angle+Math.PI/6), s.y2 - headLen*Math.sin(angle+Math.PI/6));
          ctx.stroke();
        } else if (s.type === 'text') {
          ctx.font = '20px Inter, sans-serif';
          ctx.textBaseline = 'top';
          // Wrap to a sensible fixed width rather than "whatever space is
          // left to the right" — otherwise text placed near the right edge
          // wrapped one character per line.
          const maxWidth = Math.min(cw * 0.6, Math.max(cw - s.x1 - 8, 120));
          const words = s.text.split(' ');
          const lines = [];
          let line = '';
          words.forEach(word => {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
            else line = test;
          });
          if (line) lines.push(line);
          // Remember the rendered box so the text can be hit-tested for dragging.
          s._lines = lines;
          s._w = Math.max(...lines.map(l => ctx.measureText(l).width));
          s._h = lines.length * 24;
          lines.forEach((ln, i) => {
            const ly = s.y1 + i * 24;
            ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.strokeText(ln, s.x1, ly); // white outline so text reads on any background
            ctx.fillStyle = s.color; ctx.fillText(ln, s.x1, ly);
          });
        }
      }
      redraw();

      modalHost.querySelectorAll('.ann-tool').forEach(b => b.addEventListener('click', () => {
        tool = b.dataset.tool;
        modalHost.querySelectorAll('.ann-tool').forEach(x => x.classList.remove('bg-slate-100'));
        b.classList.add('bg-slate-100');
      }));
      modalHost.querySelectorAll('.ann-color').forEach(b => b.addEventListener('click', () => {
        color = b.dataset.color;
        modalHost.querySelectorAll('.ann-color').forEach(x => x.classList.remove('border-slate-800'));
        b.classList.add('border-slate-800');
      }));
      modalHost.querySelector('#ann-undo').addEventListener('click', () => { shapes.pop(); redraw(); });
      modalHost.querySelector('#ann-clear').addEventListener('click', () => { shapes.length = 0; redraw(); });

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return [cx * (canvas.width/rect.width), cy * (canvas.height/rect.height)];
      }
      let drawing = false;
      let draggingText = null, dragOffset = [0,0];
      // Finds a text label under the pointer, so existing text can be picked
      // up and repositioned instead of only ever being placed once.
      const textAt = (x, y) => [...shapes].reverse().find(s =>
        s.type === 'text' && s._w != null &&
        x >= s.x1 - 4 && x <= s.x1 + s._w + 4 && y >= s.y1 - 4 && y <= s.y1 + s._h + 4
      );
      canvas.addEventListener('pointerdown', async (e) => {
        const [x,y] = getPos(e);
        // Dragging existing text takes priority over drawing something new,
        // regardless of which tool is selected.
        const hit = textAt(x, y);
        if (hit) { draggingText = hit; dragOffset = [x - hit.x1, y - hit.y1]; canvas.style.cursor = 'move'; return; }
        if (tool === 'text') {
          const text = await uiPrompt('Text to add:');
          if (text && text.trim()) { shapes.push({ type:'text', x1:x, y1:y, text: text.trim(), color }); redraw(); }
          return;
        }
        drawing = true;
        if (tool === 'pen') current = { type:'pen', points:[[x,y]], color };
        else current = { type: tool, x1:x, y1:y, x2:x, y2:y, color };
      });
      canvas.addEventListener('pointermove', (e) => {
        const [x,y] = getPos(e);
        if (draggingText) { draggingText.x1 = x - dragOffset[0]; draggingText.y1 = y - dragOffset[1]; redraw(); return; }
        if (!drawing || !current) return;
        if (tool === 'pen') current.points.push([x,y]);
        else { current.x2 = x; current.y2 = y; }
        redraw();
      });
      const finishStroke = () => { draggingText = null; canvas.style.cursor = ''; if (current) { shapes.push(current); current = null; } drawing = false; redraw(); };
      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointerleave', finishStroke);

      modalHost.querySelector('#ann-skip').addEventListener('click', () => {
        URL.revokeObjectURL(objUrl); modalHost.remove(); resolve(fileOrBlob);
      });
      modalHost.querySelector('#ann-use').addEventListener('click', () => {
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(objUrl); modalHost.remove(); resolve(blob);
        }, 'image/jpeg', 0.88);
      });
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); modalHost.remove(); resolve(fileOrBlob); };
    img.src = objUrl;
  });
}

async function readGenericFields(cfg, prefix, projectId, existingItem = {}) {
  const data = {};
  const refs = {};      // field key -> the record chosen in a ref-select
  const queued = [];    // files picked while offline, uploaded later
  const missing = [];
  const offline = !navigator.onLine;
  // Uploads whatever is sitting in a field's picker. Offline, it is queued
  // instead. A failed upload stops the save with a clear message rather
  // than quietly saving the record without its photo.
  const grab = async (id, f, single) => {
    const blob = annotatedBlobs[id];
    const file = getChosenFile(id);
    const source = blob || file;
    if (!source) return null;
    const name = blob ? 'annotated.jpg' : (file.name || 'photo.jpg');
    if (offline) { queued.push({ blob: source, name, fieldKey: f.key, single }); return null; }
    try {
      const url = await uploadFileOrBlob(source, cfg.id, name, projectId);
      delete annotatedBlobs[id];
      return { url, name };
    } catch (err) {
      throw new Error(`"${f.label}" could not be uploaded: ${err.message}`);
    }
  };
  for (const f of cfg.fields) {
    const id = `${prefix}-${f.key}`;
    if (f.showFor && cfg.conditionalOn) {
      const typeEl = document.getElementById(`${prefix}-${cfg.conditionalOn}`);
      if (typeEl && !fieldVisible(f, typeEl.value)) { data[f.key] = ''; continue; }
    }
    if (f.type === 'computed') { data[f.key] = existingItem[f.key] ?? ''; continue; }
    if (f.type === 'rows') {
      const box = document.getElementById(id);
      data[f.key] = box ? [...box.querySelectorAll('[data-rows-row]')].map(rw => {
        const o = {};
        f.cols.forEach(c => { const v = (rw.querySelector(`[data-k="${c.k}"]`)?.value || '').trim(); o[c.k] = c.t === 'number' ? (v ? Number(v) : 0) : v; });
        return o;
      }).filter(o => f.cols.some(c => o[c.k])) : [];
      continue;
    }
    if (f.type === 'file') {
      const urlEl = document.getElementById(`${id}-url`);
      const uploaded = await grab(id, f, true);
      if (uploaded) data[f.key] = uploaded.url;
      else if (urlEl && urlEl.value.trim()) data[f.key] = normalizeLink(urlEl.value);
      else data[f.key] = existingItem[f.key] || ''; // nothing new provided — keep what was already there
      continue;
    }
    if (f.type === 'multifile') {
      const saved = existingItem[f.key];
      const current = [...(multiFileState[id] || (Array.isArray(saved) ? saved : (saved ? [{ url: saved }] : [])))];
      // A photo can be sitting selected in the picker without ever having
      // been explicitly "added" — attach it rather than dropping it.
      const uploaded = await grab(id, f, false);
      if (uploaded) current.push(uploaded);
      const urlEl = document.getElementById(`${id}-url`);
      if (urlEl && urlEl.value.trim()) current.push({ url: normalizeLink(urlEl.value), name: '' });
      data[f.key] = current;
      continue;
    }
    if (f.type === 'notes-thread') {
      // Remarks are saved by their own "Add Remark" button the moment they
      // are written. They are deliberately NOT part of this save — sending
      // the list back from here used to overwrite remarks added meanwhile.
      if (!existingItem.id) data[f.key] = [];
      continue;
    }
    if (f.type === 'building-checklist') {
      const allBoxes = document.querySelectorAll(`.${CSS.escape(id)}-tower-cb`);
      const ticked = {};
      allBoxes.forEach(cb => { ticked[cb.dataset.towerId] = { done: cb.checked, name: cb.dataset.towerName }; });
      data[f.key] = ticked;
      const total = allBoxes.length, done = [...allBoxes].filter(cb => cb.checked).length;
      data.status = total === 0 ? 'pending' : (done === total ? 'completed' : (done === 0 ? 'pending' : 'in_progress'));
      continue;
    }
    if (f.type === 'ref-select') {
      const el = document.getElementById(id);
      const v = el ? el.value : '__keep__';
      if (v === '__keep__') {
        data[f.key] = existingItem[f.key] || ''; data[f.key + '_id'] = existingItem[f.key + '_id'] || '';
      } else if (!v) {
        data[f.key] = ''; data[f.key + '_id'] = '';
      } else {
        const opt = (formRefOptions[id] || []).find(o => o.id === v);
        data[f.key] = opt ? opt.value : ''; data[f.key + '_id'] = opt ? v : '';
        if (opt) refs[f.key] = opt.data;
      }
      if (f.required && !data[f.key]) missing.push(f.label);
      continue;
    }
    const el = document.getElementById(id);
    const val = el ? el.value.trim() : '';
    if (f.required && !val) missing.push(f.label);
    if (f.type === 'user-select') data[f.key + '_email'] = assigneeEmail(val);
    if (f.type === 'number') { const n = Number(val); data[f.key] = (val === '' || isNaN(n)) ? '' : n; }
    else data[f.key] = val;
  }
  // Fields copied from a chosen linked record (e.g. the unit's tower onto a booking).
  cfg.fields.filter(f => f.type === 'ref-select' && f.copy && refs[f.key]).forEach(f => {
    Object.entries(f.copy).forEach(([k, fn]) => { data[k] = fn(refs[f.key], data); });
  });
  MODULE_HOOKS[cfg.id]?.compute?.(data, { refs, existingItem });
  return { data, missingRequired: missing.length > 0, missing, queued, refs };
}

// Stores any offline-picked files against the record they belong to.
async function queuePendingFiles(queued, cfg, projectId, docId) {
  if (!queued.length) return;
  try {
    for (const q of queued) {
      await queueUpload({ ...q, companyId: session.companyId, projectId, moduleId: cfg.id, docId, queuedAt: Date.now() });
    }
    toast(`Saved. ${queued.length} photo(s)/file(s) will upload by themselves when you're back online.`, 'info', 6000);
  } catch (err) {
    toast('Saved, but the photo could not be kept for later upload — add it again when online.', 'error', 7000);
  }
}

function semanticPillColor(value) {
  const v = String(value||'').toLowerCase();
  const red = ['open','pending','expired','delayed','breached','poor','needs_rework','flagged','rejected','cancelled','high'];
  const amber = ['in_progress','in-progress','expiring','fair','applied','planned','issued','at_risk','scheduled','fix_submitted','certified','checked','blocked','part_paid','requested','assigned','upcoming','draft','raised','ordered','medium'];
  const green = ['resolved','completed','done','received','active','good','new','on_track','returned','closed','ready','approved','paid','booked','registered','filed','fixed','reached'];
  if (red.includes(v)) return 'bg-red-100 text-red-700';
  if (amber.includes(v)) return 'bg-amber-100 text-amber-700';
  if (green.includes(v)) return 'bg-emerald-100 text-emerald-700';
  return 'bg-slate-100 text-slate-600';
}

// Only Snags and Tasks have a genuine "how long has this been open" concept —
// Budget, Drawings, Vendors, etc. don't, so we don't show it there.
const DAYS_OPEN_MODULES = ['snags', 'tasks', 'defects'];

function daysOpenBadge(item, moduleId) {
  if (!DAYS_OPEN_MODULES.includes(moduleId)) return '';
  const createdAt = item.created_at?.toDate ? item.created_at.toDate() : null;
  if (!createdAt) return '';
  if (item.resolved_at?.toDate) {
    const resolvedAt = item.resolved_at.toDate();
    const days = Math.max(0, Math.floor((resolvedAt.getTime() - createdAt.getTime()) / 86400000));
    return `<span class="text-[11px] text-emerald-600">✓ resolved in ${days}d</span>`;
  }
  if (DONE_STATUSES.includes(item.status)) return ''; // done but no timestamp recorded (older record) — just stop counting
  const days = Math.max(0, Math.floor((Date.now() - createdAt.getTime()) / 86400000));
  return `<span class="text-[11px] text-slate-400">· open ${days}d</span>`;
}

// Auto-stamps when a Snag/Task's status crosses into or out of "done" —
// no manual date entry needed, and it's what lets us show accurate
// "resolved in Xd" / "open Xd" without relying on anyone remembering to
// pick a date.
function computeResolvedAtUpdate(cfg, newStatus, existingItem) {
  if (!DAYS_OPEN_MODULES.includes(cfg.id)) return {};
  const wasResolved = existingItem && DONE_STATUSES.includes(existingItem.status);
  const isResolved = DONE_STATUSES.includes(newStatus);
  if (isResolved && !wasResolved) return { resolved_at: serverTimestamp() };
  if (!isResolved && wasResolved) return { resolved_at: null }; // reopened
  return {};
}

// "Updated by X · date time" — shown on every card so it's clear who
// touched a record last and when, matching an audit-trail expectation.
function lastUpdatedLine(item) {
  const who = item.updated_by || item.created_by;
  const ts = (item.updated_at || item.created_at);
  const when = ts?.toDate ? formatDateTime(ts.toDate()) : '';
  if (!who && !when) return '';
  return `<p class="text-[11px] text-slate-400 mt-1">${item.updated_by ? 'Updated' : 'Added'} by ${escapeHtml(who || 'unknown')}${when ? ' · '+when : ''}</p>`;
}

// Past its due date and not yet finished?
function isItemOverdue(cfg, item) {
  return !!cfg.dueField && !!item[cfg.dueField] && item[cfg.dueField] < todayStr() && !DONE_STATUSES.includes(item.status);
}
function cardFieldText(f, value) {
  if (f.type === 'date') return formatDateOnly(value) || String(value);
  if ((f.type === 'number' || f.type === 'computed') && /₹/.test(f.label) && !isNaN(Number(value))) return round2(value).toLocaleString('en-IN');
  return String(value);
}
function thumbsHTML(attachments) {
  const list = (attachments || []).filter(a => a && safeUrl(a.url));
  if (!list.length) return '';
  const urls = list.map(a => safeUrl(a.url));
  return `<div class="flex gap-1 mt-1">${list.slice(0, 4).map((a, i) => fileKind(a.url) === 'image'
    ? `<img src="${escapeHtml(safeUrl(a.url))}" loading="lazy" class="w-10 h-10 rounded object-cover cursor-pointer" data-lightbox-urls='${escapeHtml(JSON.stringify(urls))}' data-lightbox-index="${i}"/>`
    : `<span class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-xs">📎</span>`).join('')}${list.length > 4 ? `<span class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-[10px] text-slate-500">+${list.length - 4}</span>` : ''}</div>`;
}

function genericItemCardHTML(cfg, item, canUpdate, canDelete, focusTowerId) {
  const overdue = isItemOverdue(cfg, item);
  // Snags get a distinctive high-visibility card: colored by severity, with
  // open+high-severity ones pulsing so they can't be missed.
  if (cfg.cardStyle === 'severity-square') {
    const isResolved = item.status === 'resolved';
    const isUrgent = item.severity === 'high' && !isResolved;
    const cardBorder = isResolved ? 'border-emerald-400' : (isUrgent ? 'border-red-400 alert-pulse' : (item.status === 'fix_submitted' ? 'border-amber-400' : 'border-slate-200'));
    const sevPill = { high:'bg-red-100 text-red-700', medium:'bg-amber-100 text-amber-700', low:'bg-slate-100 text-slate-600' }[item.severity] || 'bg-slate-100 text-slate-600';
    return `<div data-gm-card="${escapeHtml(item.id)}" class="glass rounded-xl p-3 border-l-4 ${cardBorder} text-sm cursor-pointer hover:shadow-md transition h-full">
      <div class="flex items-start justify-between gap-2">
        <p class="font-semibold">${item.ref_id ? `<span class="text-[10px] data-mono text-slate-400 mr-1">${escapeHtml(item.ref_id)}</span>` : ''}${escapeHtml(item.title || '(untitled)')}</p>
        <span class="shrink-0 px-2 py-0.5 rounded-full text-[11px] font-medium ${sevPill}">${escapeHtml(item.severity||'')}</span>
      </div>
      <p class="text-xs text-slate-500 mt-1">${escapeHtml(item.unit_number || '')}${item.assigned_to ? ' · Assigned: '+escapeHtml(String(item.assigned_to).split(' <')[0]) : ''}${item.contractor ? ' · ' + escapeHtml(item.contractor) : ''} ${daysOpenBadge(item, 'snags')}</p>
      ${item.due_date ? `<p class="text-[11px] mt-0.5 ${overdue ? 'text-red-600 font-semibold' : 'text-slate-400'}">Fix by ${formatDateOnly(item.due_date)}${overdue ? ' — overdue' : ''}</p>` : ''}
      ${lastUpdatedLine(item)}
      ${thumbsHTML(Array.isArray(item.photos) ? item.photos : [])}
      <div class="flex items-center justify-between mt-2">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${semanticPillColor(item.status)}">${escapeHtml(String(item.status||'').replace(/_/g,' '))}</span>
          <span class="text-[10px] text-slate-400">tap for details</span>
        </div>
        ${canDelete ? `<button data-gm-delete="${escapeHtml(item.id)}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600">Delete</button>` : ''}
      </div>
    </div>`;
  }

  // Use the first field with a value from titleFields (if the module
  // defines one), otherwise fall back to the first field in the config —
  // whichever field ends up as the bold title never also shows as a pill
  // or in the secondary line below.
  let primaryField = cfg.fields[0];
  if (cfg.titleFields) {
    const match = cfg.titleFields.map(k => cfg.fields.find(f => f.key === k)).find(f => f && item[f.key]);
    if (match) primaryField = match;
  }
  const primary = item[primaryField.key] ? cardFieldText(primaryField, item[primaryField.key]) : '(untitled)';
  const subtitle = cfg.subtitleField ? item[cfg.subtitleField] : '';
  const isPill = (f) => f.type === 'select' || f.type === 'tower-select';
  const skipTypes = ['file', 'multifile', 'notes-thread', 'building-checklist', 'rows'];
  const selectFields = cfg.fields.filter(f => isPill(f) && f.key !== primaryField.key && f.key !== cfg.subtitleField && item[f.key]);
  const otherFields = cfg.fields.filter(f => f.key !== primaryField.key && f.key !== cfg.subtitleField && !isPill(f) && !skipTypes.includes(f.type) && item[f.key] !== undefined && item[f.key] !== null && item[f.key] !== '' && item[f.key] !== 0);
  const buildingField = cfg.fields.find(f => f.type === 'building-checklist' && item[f.key]);
  const fileField = cfg.fields.find(f => f.type === 'file' && item[f.key]);
  // Normalize: older records may have saved this field as a plain string
  // before it became a multi-attachment field — treat that the same way.
  const multiFieldRaw = cfg.fields.find(f => f.type === 'multifile' && item[f.key] && (Array.isArray(item[f.key]) ? item[f.key].length : true));
  const multiItems = multiFieldRaw ? (Array.isArray(item[multiFieldRaw.key]) ? item[multiFieldRaw.key] : [{ url: item[multiFieldRaw.key] }]) : [];

  // Open/pending items get a red left border; completed/resolved/done items
  // get green; everything else stays neutral.
  const doneStates = ['done','completed','resolved','received','closed','returned','paid','filed','registered','approved','reached'];
  const openStates = ['open','pending','needs_rework','flagged'];
  let cardBorder = '';
  if (cfg.id === 'safety') {
    // Only Incident Reports get the urgent pulsing treatment while open —
    // Rules/Checklists/Training are reference material, not emergencies.
    if (item.type === 'incident_report' && item.status === 'open') cardBorder = 'border-l-4 border-red-400 alert-pulse';
    else if (item.type === 'incident_report' && item.status === 'closed') cardBorder = 'border-l-4 border-emerald-400';
    else if (item.status === 'completed' || item.status === 'active') cardBorder = 'border-l-4 border-emerald-400';
  } else if (cfg.id === 'sla' && item.status === 'breached') cardBorder = 'border-l-4 border-red-500 alert-pulse';
  else if (cfg.id === 'sla' && item.status === 'at_risk') cardBorder = 'border-l-4 border-amber-400 alert-pulse';
  else if (overdue) cardBorder = 'border-l-4 border-red-400 alert-pulse';
  else if (cfg.id === 'bills' && canActOnBill(item.status)) cardBorder = 'border-l-4 border-amber-400 alert-pulse';
  else if (item.status && openStates.includes(item.status)) cardBorder = 'border-l-4 border-red-400';
  else if (item.status && doneStates.includes(item.status)) cardBorder = 'border-l-4 border-emerald-400';

  const fileUrl = fileField ? safeUrl(item[fileField.key]) : '';
  return `<div data-gm-card="${escapeHtml(item.id)}" class="glass rounded-xl p-3 text-sm flex justify-between items-start gap-2 cursor-pointer hover:shadow-md transition h-full ${cardBorder}">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        ${item.ref_id ? `<span class="text-[10px] data-mono text-slate-400 shrink-0">${escapeHtml(item.ref_id)}</span>` : ''}
        <p class="font-semibold">${escapeHtml(primary)}${subtitle ? ` <span class="text-slate-500">· ${escapeHtml(String(subtitle))}</span>` : ''}</p>
        ${overdue ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-100 text-red-700">overdue</span>` : ''}
        ${cfg.id === 'bills' && canActOnBill(item.status) ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-700">needs you</span>` : ''}
        ${selectFields.map(f => `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${semanticPillColor(item[f.key])}">${escapeHtml(String(item[f.key]).replace(/_/g,' '))}</span>`).join('')}
      </div>
      ${otherFields.length ? `<p class="text-xs text-slate-500 mt-1 break-words line-clamp-2">${otherFields.map(f => { const t = cardFieldText(f, item[f.key]); return `${escapeHtml(f.label.split(' — ')[0].split(' (')[0])}: ${escapeHtml(t.slice(0,80))}${t.length>80?'…':''}`; }).join(' · ')} ${daysOpenBadge(item, cfg.id)}</p>` : (daysOpenBadge(item, cfg.id) ? `<p class="text-xs text-slate-400 mt-1">${daysOpenBadge(item, cfg.id)}</p>` : '')}
      ${lastUpdatedLine(item)}
      ${fileUrl ? (fileKind(fileUrl)==='image'
          ? `<img src="${escapeHtml(fileUrl)}" loading="lazy" class="w-full h-20 object-cover rounded-lg mt-1 cursor-pointer" data-lightbox-urls='${escapeHtml(JSON.stringify([fileUrl]))}' data-lightbox-index="0"/>`
          : `<a href="${escapeHtml(fileUrl)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-600 underline" data-stop-click>📎 ${escapeHtml(fileField.label)}</a>`) : ''}
      ${buildingField ? (() => {
        const entries = Object.values(item[buildingField.key]);
        const done = entries.filter(e => e.done).length;
        return `<div class="flex flex-wrap gap-1.5 mt-1.5">
          ${entries.map(e => `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${e.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${e.done?'🟢':'⚪'} ${escapeHtml(e.name)}</span>`).join('')}
        </div>
        <p class="text-[10px] text-slate-400 mt-1">${done} of ${entries.length} buildings done</p>`;
      })() : ''}
      ${thumbsHTML(multiItems)}
    </div>
    ${canDelete ? `<button data-gm-delete="${escapeHtml(item.id)}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600 shrink-0">Delete</button>` : ''}
  </div>`;
}

// Completed/approved records are locked for everyone except Company Admin.
const LOCKED_STATES = ['done','completed','resolved','received','closed','returned'];
function isItemLocked(cfg, item) {
  if (isCompanyAdmin()) return false;
  return [...LOCKED_STATES, ...(cfg.lockedStatuses || [])].includes(item.status);
}
// The words used to name a record in logs, confirmations and headings.
function itemTitle(cfg, item) {
  let field = cfg.fields[0];
  if (cfg.titleFields) {
    const match = cfg.titleFields.map(k => cfg.fields.find(f => f.key === k)).find(f => f && item[f.key]);
    if (match) field = match;
  }
  const v = item[field.key];
  return v ? (field.type === 'date' ? formatDateOnly(v) : String(v)) : '';
}

        ${cfg.fields.some(f => f.type === 'select' && f.key === 'status') ? `<select id="gm-status-filter" class="border rounded-lg px-2 py-1.5 text-sm"><option value="">All statuses</option></select>` : ''}
        ${cfg.id !== 'possession' ? `<select id="gm-tower-filter" class="hidden border rounded-lg px-2 py-1.5 text-sm"><option value="">All towers</option></select>` : ''}
      </div>

    <div id="gm-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch"></div>

  if (canAdd) document.getElementById('gm-add-btn').addEventListener('click', () => openGenericAdd(cfg, projectId));

  // Floating action bar — only appears once something's selected.
  function paintBulkBar() {
    const bar = document.getElementById('gm-bulk-bar');
    if (!bar) return;
    // Drop selections for records that no longer exist.
    [...selectedIds].forEach(id => { if (!latestItems.some(i => i.id === id)) selectedIds.delete(id); });
    if (!selectedIds.size) { bar.innerHTML = ''; return; }
    const statusField = cfg.fields.find(f => f.type === 'select' && f.key === 'status');

    const bulkStatusAllowed = canUpdate && statusField && (!cfg.statusFlow || isAdmin) && !statusField.optionsByType;
    bar.innerHTML = `
      <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 glass rounded-2xl border border-slate-300 shadow-xl px-3 py-2 flex items-center gap-2 flex-wrap max-w-[95vw]">

          ${statusField.options.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o.replace(/_/g,' '))}</option>`).join('')}
        </select>` : ''}
        ${canDelete ? `<button id="gm-bulk-delete" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600">Delete</button>` : ''}
        <button id="gm-bulk-clear" class="text-xs px-2 py-1 rounded-lg border">Clear</button>
      </div>`;
    // Locked records are left out of bulk changes — the same rule as editing one by one.
    const splitLocked = () => {
      const chosen = latestItems.filter(i => selectedIds.has(i.id));
      return { open: chosen.filter(i => !isItemLocked(cfg, i)), locked: chosen.filter(i => isItemLocked(cfg, i)) };
    };
    document.getElementById('gm-bulk-clear')?.addEventListener('click', () => { selectedIds.clear(); paintGmList(getFilteredItems()); });
    document.getElementById('gm-bulk-status')?.addEventListener('change', async (e) => {

      if (!open.length) { await uiAlert('All the selected items are locked (completed or approved). Only a Company Admin can change them.'); e.target.value = ''; return; }
      if (!await uiConfirm(`Set ${open.length} item(s) to "${newStatus.replace(/_/g,' ')}"?${locked.length ? `\n\n${locked.length} locked item(s) will be skipped.` : ''}`)) { e.target.value = ''; return; }
      try {
        const writer = makeBatchWriter();
        for (const existing of open) {
          await writer.update(itemRef(existing.id), {
            status: newStatus, updated_by: session.email, updated_at: serverTimestamp(),
            ...computeResolvedAtUpdate(cfg, newStatus, existing)
          });
        }
        await settleWrite(writer.flush());
        logActivity(projectId, `Bulk updated ${open.length} ${cfg.label} to "${newStatus}"`);
      } catch (err) { await uiAlert('Could not update: ' + err.message); }
      selectedIds.clear();
      paintGmList(getFilteredItems());
    });
    document.getElementById('gm-bulk-delete')?.addEventListener('click', async () => {
      const { open, locked } = splitLocked();
      if (!open.length) { await uiAlert('All the selected items are locked (completed or approved). Only a Company Admin can delete them.'); return; }
      if (!await uiConfirm(`Delete ${open.length} item(s)? This can't be undone.${locked.length ? `\n\n${locked.length} locked item(s) will be skipped.` : ''}`, { danger: true, okText: 'Delete' })) return;
      try {
        const writer = makeBatchWriter();
        for (const existing of open) await writer.del(itemRef(existing.id));
        await settleWrite(writer.flush());
        deleteStoredFiles(open.flatMap(i => fileUrlsOf(cfg, i)));
        logActivity(projectId, `Bulk deleted ${open.length} ${cfg.label} record(s)`);
      } catch (err) { await uiAlert('Could not delete: ' + err.message); }
      selectedIds.clear();
      paintGmList(getFilteredItems());
    });
  }

  // Populates the status/tower dropdowns from whatever values are actually
  // present in the loaded data.
  function refreshFilterOptions() {
    const statusSel = document.getElementById('gm-status-filter');
    if (statusSel) {
      const current = statusSel.value;
      const statuses = [...new Set(latestItems.map(i => i.status).filter(Boolean))].sort();
      statusSel.innerHTML = '<option value="">All statuses</option>' + statuses.map(s => `<option value="${escapeHtml(s)}" ${s===current?'selected':''}>${escapeHtml(String(s).replace(/_/g,' '))}</option>`).join('');
    }
    const towerSel = document.getElementById('gm-tower-filter');
    if (towerSel) {
      const towers = [...new Set(latestItems.map(i => i.tower).filter(Boolean))].sort();
      if (towers.length) {
        const current = towerSel.value;
        towerSel.classList.remove('hidden');
        towerSel.innerHTML = '<option value="">All towers</option>' + towers.map(t => `<option value="${escapeHtml(t)}" ${t===current?'selected':''}>${escapeHtml(t)}</option>`).join('');
      } else {
        towerSel.classList.add('hidden');
      }
    }
  }

  function getFilteredItems() {
    const term = document.getElementById('gm-search')?.value.trim().toLowerCase() || '';
    const statusFilter = document.getElementById('gm-status-filter')?.value || '';
    const towerFilter = document.getElementById('gm-tower-filter')?.value || '';
    let result = latestItems;
    if (activeTypeFilter) result = result.filter(item => item.type === activeTypeFilter);
    if (statusFilter) result = result.filter(item => item.status === statusFilter);
    if (towerFilter) result = result.filter(item => item.tower === towerFilter);
    if (cfg.id === 'possession' && activePossessionTower) {
      result = result.filter(item => item.tower === activePossessionTower);
    }
    if (term) result = result.filter(item =>
      String(item.ref_id || '').toLowerCase().includes(term) ||
      cfg.fields.some(f => f.type !== 'multifile' && f.type !== 'file' && exportCellText(f, item[f.key]).toLowerCase().includes(term))
    );
    return result;
  }
  // Reset paging when the person changes what they're looking at.
  const repaintFromTop = () => { visibleCount = PAGE_SIZE; paintGmList(getFilteredItems()); };
  document.getElementById('gm-status-filter')?.addEventListener('change', repaintFromTop);
  document.getElementById('gm-tower-filter')?.addEventListener('change', repaintFromTop);

  function paintSafetyBadges() {
    const host = document.getElementById('safety-type-badges');
    if (!host) return;
    const types = ['rule','training','incident_report','checklist'];
    const labels = { rule:'Rules', training:'Training', incident_report:'Incident Reports', checklist:'Checklist' };
    const allBtn = `<button data-type-filter="__all__" class="text-xs px-3 py-1.5 rounded-full border ${!activeTypeFilter ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-slate-50'}">All <span class="data-mono">${latestItems.length}</span></button>`;
    host.innerHTML = allBtn + types.map(t => {
      const count = latestItems.filter(i => i.type === t).length;
      const active = activeTypeFilter === t;
      return `<button data-type-filter="${t}" class="text-xs px-3 py-1.5 rounded-full border ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-slate-50'}">${labels[t]} <span class="data-mono">${count}</span></button>`;
    }).join('');
    host.querySelectorAll('[data-type-filter]').forEach(b => b.addEventListener('click', () => {
      activeTypeFilter = b.dataset.typeFilter === '__all__' ? '' : b.dataset.typeFilter;
      visibleCount = PAGE_SIZE;
      paintSafetyBadges();
      paintGmList(getFilteredItems());
    }));
  }

  // Tower badges — each shows that tower's % complete across all its
  // checklist items. Click a tower to filter; "All" shows everything.
  function paintPossessionTowerBadges() {
    const host = document.getElementById('possession-tower-badges');
    if (!host) return;
    const towerNames = [...projectTowers.map(t => t.name), 'Common Area'];
    const allBtn = `<button data-tower-filter="__all__" class="text-xs px-3 py-1.5 rounded-full border ${!activePossessionTower ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-slate-50'}">All <span class="data-mono">${latestItems.length}</span></button>`;
    host.innerHTML = allBtn + towerNames.map(name => {
      const relevant = latestItems.filter(i => i.tower === name);
      const done = relevant.filter(i => i.status === 'completed').length;
      const pct = relevant.length ? Math.round((done / relevant.length) * 100) : 0;
      const active = activePossessionTower === name;
      const pctColor = active ? '' : (pct === 100 ? 'text-emerald-600' : pct > 0 ? 'text-amber-600' : 'text-red-500');
      return `<button data-tower-filter="${escapeHtml(name)}" class="text-xs px-3 py-1.5 rounded-full border ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-slate-50'}">${escapeHtml(name)} <span class="data-mono ${pctColor}">${done}/${relevant.length} · ${pct}%</span></button>`;
    }).join('');
    host.querySelectorAll('[data-tower-filter]').forEach(b => b.addEventListener('click', () => {
      activePossessionTower = b.dataset.towerFilter === '__all__' ? '' : b.dataset.towerFilter;
      visibleCount = PAGE_SIZE;
      paintPossessionTowerBadges();
      paintGmList(getFilteredItems());
    }));
  }

  document.getElementById('gm-search').addEventListener('input', repaintFromTop);

  // ── Summary panel (billing, budget, stock, sales…) painted live from
  // this screen's records plus the related screens it depends on. ──
  const otherData = {};
  const summaryCtx = { cfg, projectId, projectName: activeProjectName, canAdd, canUpdate, canDelete };
  function paintSummary() {
    const host = document.getElementById('gm-summary');
    if (!host || !summaryPainter) return;
    try { summaryPainter.paint(host, latestItems, otherData, summaryCtx); }
    catch (err) { console.error(err); host.innerHTML = `<p class="text-xs text-red-600">Summary could not be shown: ${escapeHtml(err.message)}</p>`; }
  }
  if (summaryPainter) {
    (summaryPainter.others || []).forEach(other => {
      unsubscribers.push(onSnapshot(collection(db, ...base, other), (snap) => {
        otherData[other] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        paintSummary();
      }, () => { otherData[other] = []; paintSummary(); }));
    });
  }

  const unsub = onSnapshot(collection(db, ...base, cfg.id), (snap) => {
    const rawItems = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    // A daily log reads newest-first — unlike the other modules, which sort
    // by status priority (open work before completed work).
    const items = cfg.id === 'diary'
      ? rawItems.sort((a, b) => (b.entry_date || '').localeCompare(a.entry_date || ''))
      : cfg.id === 'stages'
        ? rawItems.sort((a, b) => (Number(a.sequence) || 999) - (Number(b.sequence) || 999))
        : sortItemsForDisplay(rawItems);
    latestItems = items;
    refreshFilterOptions();
    if (cfg.id === 'safety') paintSafetyBadges();
    if (cfg.id === 'possession') {
      paintPossessionTowerBadges();
      const orphaned = items.filter(i => !i.tower);
      const noticeEl = document.getElementById('possession-cleanup-notice');
      if (noticeEl) {
        noticeEl.innerHTML = orphaned.length && canDelete ? `
          <div class="text-xs bg-amber-50 text-amber-700 rounded-lg px-3 py-2 flex items-center justify-between gap-2">
            <span>${orphaned.length} old-format checklist record(s) found from before this module's redesign — they don't show anywhere and were inflating the totals.</span>
            <button id="possession-cleanup-btn" class="px-2 py-1 rounded-lg border border-amber-300 bg-white shrink-0">Delete them</button>
          </div>` : '';
        document.getElementById('possession-cleanup-btn')?.addEventListener('click', async () => {
          if (!await uiConfirm(`Delete ${orphaned.length} old-format record(s)? This can't be undone.`, { danger: true, okText: 'Delete' })) return;
          const writer = makeBatchWriter();
          for (const o of orphaned) await writer.del(itemRef(o.id));
          await settleWrite(writer.flush());
          logActivity(projectId, `Cleaned up ${orphaned.length} old-format Possession Checklist record(s)`);
        });
      }
    }
    paintGmList(getFilteredItems());
    paintSummary();

    // Handover Pack gets a progress bar: % of to-do items marked completed
    if (cfg.id === 'society') {
      const total = items.length || 1;
      const done = items.filter(i => i.status === 'completed').length;
      const pct = Math.round((done / total) * 100);
      const bar = document.getElementById('handover-progress');
      if (bar) bar.innerHTML = `
        <div class="flex justify-between text-xs mb-1"><span class="font-semibold">Handover Progress</span><span class="data-mono">${done} / ${items.length} (${pct}%)</span></div>
        <div class="w-full bg-slate-200 rounded-full h-3"><div class="bg-emerald-500 h-3 rounded-full transition-all" style="width:${pct}%"></div></div>`;
    }
  }, (err) => { const el = document.getElementById('gm-list'); if (el) el.innerHTML = `<p class="text-red-600 text-sm">Error: ${escapeHtml(err.message)}</p>`; });
  unsubscribers.push(unsub);
}

    if (!location) { status.textContent = 'Give this batch a folder/location name.'; status.className = 'text-xs text-red-600'; return; }

    setTimeout(() => { modal.innerHTML = ''; }, 1200);
