// Checks whether a near-identical record already exists before saving —
// this is what was letting the same thing get added twice with no
// warning. Compares whichever fields actually distinguish an entry for
// that module (e.g. same checklist item + same tower for Possession
// Checklist), falling back to just the primary field for modules that
// don't define a specific scope.
// Builds a short "Status: open → resolved, Assigned To: X → Y" summary of
// what actually changed on an edit — this is what makes the Activity Log
// a real change history instead of just "updated by X" with no detail of
// what happened, which matters if there's ever a dispute later.
function summarizeFieldChanges(cfg, before, after) {
  const skip = ['photos','resolution_photos','remarks','notes','description','specifications'];
  const changes = [];
  for (const f of cfg.fields) {
    if (skip.includes(f.key) || ['multifile', 'notes-thread', 'file', 'rows', 'building-checklist'].includes(f.type)) continue;
    if (!(f.key in after)) continue;
    const oldVal = (before[f.key] ?? '').toString();
    const newVal = (after[f.key] ?? '').toString();
    if (oldVal !== newVal && (oldVal || newVal)) {
      changes.push(`${f.label.split(' — ')[0]}: ${oldVal || '—'} → ${newVal || '—'}`);
    }
  }
  return changes.slice(0, 3).join(', ') + (changes.length > 3 ? `, +${changes.length-3} more` : '');
}

// Looks for a record that matches on the fields that identify an entry for
// this module. Uses a filtered query on the first of those fields instead
// of downloading the whole list.
async function findLikelyDuplicate(cfg, projectId, data) {
  const checkFields = cfg.duplicateCheckFields || [cfg.fields[0].key];
  const norm = (v) => (v ?? '').toString().trim().toLowerCase();
  const first = checkFields.find(k => norm(data[k]));
  if (!first) return null; // nothing to compare against
  try {
    const snap = await getDocs(query(
      collection(db, 'companies', session.companyId, 'projects', projectId, cfg.id),
      where(first, '==', data[first]), limit(25)
    ));
    const match = snap.docs.find(d => {
      const existing = d.data();
      return checkFields.every(k => !norm(data[k]) || norm(existing[k]) === norm(data[k]));
    });
    if (!match) return null;
    return itemTitle(cfg, match.data()) || cfg.label;
  } catch { return null; }
}

// Dates that sensibly start at "today" on a new entry.
const TODAY_DEFAULT_KEYS = ['entry_date', 'bill_date', 'payment_date', 'receipt_date', 'demand_date', 'reported_date', 'order_date', 'booking_date'];

async function openGenericAdd(cfg, projectId, prefill = {}, extraData = {}) {
  const modal = getModalHost('gm-add-modal');
  resetFormState('gm-f');
  const extraCats = await loadFieldExtras(cfg, projectId, null);
  const isAdmin = isCompanyAdmin();
  const startValue = (f) => prefill[f.key] ?? (f.type === 'date' && TODAY_DEFAULT_KEYS.includes(f.key) ? todayStr() : '');
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-md w-full max-h-[85vh] overflow-y-auto space-y-2 relative">
        <button id="gm-f-close-x" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-xl leading-none w-8 h-8 flex items-center justify-center">✕</button>
        <h3 class="font-bold text-sm pr-8">Add ${escapeHtml(cfg.label)}</h3>
        ${cfg.fields.map(f => genericFieldHTML(f, startValue(f), 'gm-f', extraCats[f.key], null)).join('')}
        <div class="flex gap-2 pt-2">
          <button id="gm-f-save" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Add</button>
          <button id="gm-f-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="gm-f-error" class="hidden text-xs text-red-600"></p>
      </div>
    </div>`;
  wireDynamicFieldBehavior(cfg, 'gm-f', projectId);
  if (cfg.statusFlow && !isAdmin) {
    // New entries always start at the first step of the approval chain.
    const st = document.getElementById('gm-f-status');
    if (st) { st.value = 'pending'; st.disabled = true; }
  }
  const close = () => { resetFormState('gm-f'); modal.innerHTML = ''; };
  document.getElementById('gm-f-cancel').addEventListener('click', close);
  document.getElementById('gm-f-close-x').addEventListener('click', close);
  document.getElementById('gm-f-save').addEventListener('click', async () => {
    const btn = document.getElementById('gm-f-save');
    const errEl = document.getElementById('gm-f-error');
    const fail = (msg) => { errEl.textContent = msg; errEl.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Add'; };
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      const { data, missing, queued, refs } = await readGenericFields(cfg, 'gm-f', projectId);
      if (missing.length) return fail(`Please fill in: ${missing.join(', ')}.`);
      if (cfg.statusFlow && !isAdmin) data.status = 'pending';

      const dupe = await findLikelyDuplicate(cfg, projectId, data);
      if (dupe && !await uiConfirm(`This looks like it might already exist:\n\n"${dupe}"\n\nAdd it anyway?`, { okText: 'Add anyway' })) return fail('');

      const hooks = MODULE_HOOKS[cfg.id] || {};
      const hookCtx = { projectId, refs, existingItem: null, isNew: true };
      const warning = hooks.beforeSave ? await hooks.beforeSave(data, hookCtx) : null;
      if (warning && !await uiConfirm(`${warning}\n\nSave anyway?`, { okText: 'Save anyway' })) return fail('');

      const refId = await nextReferenceId(cfg, projectId);
      // The ID is created up front so photos picked offline can be attached
      // to this exact record later.
      const newRef = doc(collection(db, 'companies', session.companyId, 'projects', projectId, cfg.id));
      await settleWrite(setDoc(newRef, {
        ...data, ...extraData, ref_id: refId, created_at: serverTimestamp(), created_by: session.email,
        ...computeResolvedAtUpdate(cfg, data.status, null)
      }));
      await queuePendingFiles(queued, cfg, projectId, newRef.id);
      logActivity(projectId, `Added ${cfg.label} — ${itemTitle(cfg, data)}`);
      if (hooks.afterSave) Promise.resolve(hooks.afterSave({ ...data, id: newRef.id, ref_id: refId }, hookCtx)).catch(err => console.warn(err));
      close();
    } catch (err) {
      fail(err.message || String(err));
    }
  });
}

// Clicking any card opens this — full detail view for everyone. If the
// person has update permission, fields are editable with a Save button;
// otherwise it's a clean read-only detail panel.
async function openGenericDetail(cfg, projectId, item, canUpdate, onSaved) {
  const modal = getModalHost('gm-detail-modal');
  const isAdmin = isCompanyAdmin();
  const isLocked = isItemLocked(cfg, item);

  const itemDocRef = doc(db, 'companies', session.companyId, 'projects', projectId, cfg.id, item.id);

  const extras = DETAIL_EXTRAS[cfg.id];
  const ctx = { cfg, projectId, item, canUpdate, effectiveEdit, isLocked, itemDocRef, close, modal, onSaved };
  const hasBeforeAfter = safeUrl(item.photos?.[0]?.url) && safeUrl(item.resolution_photos?.[0]?.url);
  const sliderId = 'ba-' + item.id.replace(/[^\w-]/g, '');
  // Shown at the top of BOTH the read-only and the editable view.
  const topSections = `
    ${SIGNOFF_MODULES.includes(cfg.id) ? signOffSectionHTML(item, canUpdate) : ''}
    ${extras ? extras.html(item, ctx) : ''}
    ${hasBeforeAfter ? `
      <div>
        <p class="text-[10px] text-slate-500 uppercase mb-1">Before / After — drag to compare</p>
        ${beforeAfterSliderHTML(safeUrl(item.photos[0].url), safeUrl(item.resolution_photos[0].url), sliderId)}
      </div>` : ''}
    ${DAYS_OPEN_MODULES.includes(cfg.id) && item.created_at?.toDate ? `
      <p class="text-[11px] text-slate-500">Opened: ${formatDateTime(item.created_at.toDate())}${item.resolved_at?.toDate ? ` → Resolved: ${formatDateTime(item.resolved_at.toDate())} (${Math.max(0, Math.floor((item.resolved_at.toDate().getTime() - item.created_at.toDate().getTime())/86400000))} days)` : ''}</p>
    ` : ''}`;
  const wireTop = () => {
    if (hasBeforeAfter) wireBeforeAfterSlider(sliderId);
    if (SIGNOFF_MODULES.includes(cfg.id)) wireSignOff(cfg, projectId, item, modal);

  const lbContext = {

      const updates = {};
      cfg.fields.filter(f => f.type === 'multifile').forEach(f => {
        const fid = `gm-ef-${f.key}`;
        const arr = Array.isArray(item[f.key]) ? item[f.key] : [];
        if (arr.some(a => a.url === oldUrl)) {
          updates[f.key] = arr.map(a => a.url === oldUrl ? { ...a, url: newUrl } : a);
          item[f.key] = updates[f.key];
        }
        if (multiFileState[fid]) {
          multiFileState[fid] = multiFileState[fid].map(a => a.url === oldUrl ? { ...a, url: newUrl } : a);
          multiFilePainters[fid]?.paint();
        }
      });
      if (Object.keys(updates).length) {
        await settleWrite(updateDoc(itemDocRef, { ...updates, updated_by: session.email, updated_at: serverTimestamp() }));
        deleteStoredFiles([oldUrl]);
      }
    }
  };
  cfg.fields.filter(f => f.type === 'multifile').forEach(f => {
    const painter = multiFilePainters[`gm-ef-${f.key}`];
    if (painter) { painter.context = lbContext; painter.paint(); }

  wireLightboxThumbnails(modal);
  wireTop();
  document.getElementById('gm-ef-cancel').addEventListener('click', close);
  document.getElementById('gm-ef-close-x').addEventListener('click', close);
  document.getElementById('gm-ef-save').addEventListener('click', async () => {
    const btn = document.getElementById('gm-ef-save');
    const errEl = document.getElementById('gm-ef-error');
    const fail = (msg) => { errEl.textContent = msg; errEl.classList.toggle('hidden', !msg); btn.disabled = false; btn.textContent = 'Save'; };
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { data, missing, queued, refs } = await readGenericFields(cfg, 'gm-ef', projectId, item);
      if (missing.length) return fail(`Please fill in: ${missing.join(', ')}.`);
      if (cfg.statusFlow && !isAdmin) data.status = item.status;
      const hooks = MODULE_HOOKS[cfg.id] || {};
      const hookCtx = { projectId, refs, existingItem: item, isNew: false };
      const warning = hooks.beforeSave ? await hooks.beforeSave(data, hookCtx) : null;
      if (warning && !await uiConfirm(`${warning}\n\nSave anyway?`, { okText: 'Save anyway' })) return fail('');
      await settleWrite(updateDoc(itemDocRef, {
        ...data, updated_by: session.email, updated_at: serverTimestamp(),
        ...computeResolvedAtUpdate(cfg, data.status, item)
      }));
      await queuePendingFiles(queued, cfg, projectId, item.id);
      // Attachments removed in this edit are no longer used by anything.
      const stillUsed = new Set(fileUrlsOf(cfg, { ...item, ...data }));
      deleteStoredFiles(fileUrlsOf(cfg, item).filter(u => !stillUsed.has(u)));
      const changeSummary = summarizeFieldChanges(cfg, item, data);
      logActivity(projectId, `Updated ${cfg.label} — ${itemTitle(cfg, { ...item, ...data })}${changeSummary ? ` (${changeSummary})` : ''}`);
      if (hooks.afterSave) Promise.resolve(hooks.afterSave({ ...item, ...data }, hookCtx)).catch(err => console.warn(err));
      close();
      if (onSaved) onSaved();
    } catch (err) {
      fail(err.message || String(err));
    }
  });
}

// ── CSV / PDF export — same approach as the original app: CSV as a
// downloadable Blob, PDF as a printable window (person hits Ctrl+P → Save as PDF).
// Plain-text form of any field's value, for exports and search.
function exportCellText(f, v, forPrint = false) {
  if (v === undefined || v === null) return '';
  if (f.type === 'rows') return rowsText(f, v);
  if (f.type === 'multifile') {
    const atts = (Array.isArray(v) ? v : (v ? [{ url: v }] : [])).filter(a => a && a.url);
    return forPrint ? (atts.length ? `${atts.length} file(s)` : '') : atts.map(a => a.url).join(' | ');
  }
  if (f.type === 'file') return forPrint ? (v ? '1 file' : '') : String(v);
  if (f.type === 'notes-thread') return (Array.isArray(v) ? v : (v ? [{ text: v }] : [])).map(e => `${e.text}${e.author ? ' — ' + e.author : ''}`).join(' | ');
  if (f.type === 'building-checklist') return Object.values(v || {}).map(e => `${e.name}: ${e.done ? 'done' : 'pending'}`).join('; ');
  if (f.type === 'date' && forPrint) return formatDateOnly(v) || String(v);
  if (typeof v === 'object') return '';
  return String(v);
}

function csvCell(value) {
  let str = String(value ?? '');
  // A cell starting with = + - @ would be run as a formula by Excel; a
  // leading apostrophe makes it plain text. Real numbers are left alone.
  if (/^[=+\-@]/.test(str) && isNaN(Number(str))) str = "'" + str;
  // Only quote when necessary — quoting plain numbers makes spreadsheet
  // apps treat them as text.
  if (/[",\r\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
  return str;
}

function exportGenericCSV(cfg, items, projectName) {
  const headers = ['Ref', ...cfg.fields.map(f => f.label)];
  const rows = [
    [`Project: ${projectName || ''}`],
    [`${cfg.label} — exported ${formatDateTime(new Date())}`],
    [],
    headers,
    ...items.map(item => [item.ref_id || '', ...cfg.fields.map(f => exportCellText(f, item[f.key]))])
  ];
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `${cfg.id}-${todayStr()}.csv`);
}

async function genericDeleteFlow(cfg, projectId, item) {
  if (isItemLocked(cfg, item)) { await uiAlert(`This item is marked "${String(item.status).replace(/_/g,' ')}" and is locked. Only a Company Admin can delete it.`); return; }
  const label = itemTitle(cfg, item);
  if (!await uiConfirm(`Delete this ${cfg.label} entry${label ? ` — "${label}"` : ''}? This can't be undone.`, { danger: true, okText: 'Delete' })) return;
  try {
    await settleWrite(deleteDoc(doc(db, 'companies', session.companyId, 'projects', projectId, cfg.id, item.id)));
    deleteStoredFiles(fileUrlsOf(cfg, item));
    logActivity(projectId, `Deleted ${cfg.label} — ${label}`);
  } catch (err) { await uiAlert('Could not delete: ' + err.message); }
}

// ── My Items: everything assigned to the logged-in person, across every
// project they have access to — not per-module, since a field engineer
// juggling Snags and Tasks shouldn't have to check separate screens.
function assigneeEmail(value) {
  const m = /<([^>]+)>/.exec(String(value || ''));
  return (m ? m[1] : String(value || '')).trim().toLowerCase();
}
async function renderMyItems(view) {
  const seq = renderSeq;
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projects = await loadCompanyProjects();
  if (seq !== renderSeq) return;
  if (!projects.length) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet.</p>`; return; }

  const myEmail = (session.email || '').toLowerCase().trim();
  const myLabel = `${session.profile?.name || ''} <${session.email || ''}>`;

  view.innerHTML = `
    <h2 class="text-xl font-bold mb-1">My Items</h2>
    <p class="text-xs text-slate-500 mb-4">Everything assigned to you, across all your projects.</p>
    <div id="my-items-list" class="space-y-2"><p class="text-slate-400 text-sm">Loading…</p></div>
    <div id="gm-detail-modal"></div>`;

  // Matched on the person's email only — matching on part of a name used to
  // show "Ram" the items assigned to "Ramesh". Only records assigned to this
  // person are fetched, not every snag and task in every project.
  const assignableModules = GENERIC_MODULES.filter(m => m.fields.some(f => f.key === 'assigned_to') && canViewModule(m.id));
  const found = new Map();
  await Promise.all(projects.flatMap(project => assignableModules.flatMap(cfg => {
    const col = collection(db, 'companies', session.companyId, 'projects', project.id, cfg.id);
    return [query(col, where('assigned_to_email', '==', myEmail)), query(col, where('assigned_to', '==', myLabel))].map(async (q) => {
      try {
        (await getDocs(q)).docs.forEach(d => {
          if (assigneeEmail(d.data().assigned_to) !== myEmail) return;
          found.set(`${project.id}/${cfg.id}/${d.id}`, { cfg, item: { id: d.id, ...d.data() }, projectId: project.id, projectName: project.name });
        });
      } catch { /* no access to that screen in that project */ }
    });
  })));
  if (seq !== renderSeq) return;

  const results = [...found.values()].sort((a, b) => {
    const rankDiff = statusSortRank(a.item.status) - statusSortRank(b.item.status);
    if (rankDiff !== 0) return rankDiff;
    const ad = a.item[a.cfg.dueField] || '9999', bd = b.item[b.cfg.dueField] || '9999';
    if (ad !== bd) return ad.localeCompare(bd);
    const at = a.item.created_at?.toDate ? a.item.created_at.toDate().getTime() : 0;
    const bt = b.item.created_at?.toDate ? b.item.created_at.toDate().getTime() : 0;
    return at - bt;
  });

  const listEl = document.getElementById('my-items-list');
  if (!listEl) return;
  listEl.innerHTML = results.length ? results.map((r, i) => {
    const overdue = isItemOverdue(r.cfg, r.item);
    const due = r.item[r.cfg.dueField];
    return `
    <div data-my-item="${i}" class="glass rounded-xl p-3 text-sm cursor-pointer hover:shadow-md transition ${overdue ? 'border-l-4 border-red-400' : ''}">
      <div class="flex items-center justify-between gap-2">
        <p class="font-semibold">${r.item.ref_id ? `<span class="text-[10px] data-mono text-slate-400 mr-1">${escapeHtml(r.item.ref_id)}</span>` : ''}${escapeHtml(itemTitle(r.cfg, r.item))}</p>
        <span class="text-[10px] px-2 py-0.5 rounded-full shrink-0 ${semanticPillColor(r.item.status)}">${escapeHtml(String(r.item.status||'').replace(/_/g,' '))}</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">${escapeHtml(r.cfg.label)} · ${escapeHtml(r.projectName)}${due ? ` · <span class="${overdue ? 'text-red-600 font-semibold' : ''}">due ${formatDateOnly(due)}${overdue ? ' — overdue' : ''}</span>` : ''}</p>
    </div>`;
  }).join('') : '<p class="text-slate-400 text-sm">Nothing assigned to you right now 🎉</p>';

  listEl.querySelectorAll('[data-my-item]').forEach(el => el.addEventListener('click', () => {
    const r = results[Number(el.dataset.myItem)];
    // My Items spans every project — opening one switches the global
    // project selector to match, so the rest of the app stays in sync.
    setActiveProject(r.projectId);
    openGenericDetail(r.cfg, r.projectId, r.item, canDo(r.cfg.id, 'update'), () => renderView('my-items'));
  }));
}

async function renderActivityLog(view) {
  const seq = renderSeq;
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projects = await loadCompanyProjects();
  if (seq !== renderSeq) return;
  if (!projects.length) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet.</p>`; return; }
  activityProjectId = getActiveProjectId(projects);
  const isAdmin = isCompanyAdmin();

  view.innerHTML = `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-xl font-bold">Activity Log</h2>
      <div class="flex items-center gap-2">
        ${isAdmin ? `<button id="activity-csv-btn" class="text-xs px-3 py-1.5 rounded-xl border">↓ CSV (admin)</button>` : ''}
      </div>
    </div>
    <div id="activity-list" class="space-y-2"></div>
    <div id="activity-more" class="mt-3"></div>`;

  let latestEntries = [];
  if (isAdmin) {
    document.getElementById('activity-csv-btn').addEventListener('click', () => {
      const projectName = projects.find(p => p.id === activityProjectId)?.name || '';
      const rows = [
        [`Project: ${projectName}`], [`Activity Log — exported ${formatDateTime(new Date())} — ${latestEntries.length} most recent entries`], [],
        ['Actor','Action','Date/Time'],
        ...latestEntries.map(a => [a.actor||'System', a.action||'', a.at?.toDate ? formatDateTime(a.at.toDate()) : ''])
      ];
      const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
      downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `activity-log-${todayStr()}.csv`);
    });
  }

  // Only the newest entries are fetched; "Load more" asks for the next 100.
  const PAGE = 100;
  let pageSize = PAGE;
  let unsubLog = null;
  const subscribe = () => {
    if (unsubLog) unsubLog();
    const q = query(
      collection(db, 'companies', session.companyId, 'projects', activityProjectId, 'activityLog'),
      orderBy('at', 'desc'), limit(pageSize)
    );
    unsubLog = onSnapshot(q, (snap) => {
      const host = document.getElementById('activity-list');
      if (!host) return;
      latestEntries = snap.docs.map(d => d.data());
      host.innerHTML = latestEntries.map(a => `
        <div class="glass rounded-xl p-3 text-sm">
          <p class="font-medium">${escapeHtml(a.actor || 'System')}</p>
          <p class="text-slate-500 text-xs">${escapeHtml(a.action || '')}</p>
          <p class="text-[10px] text-slate-400 mt-1">${a.at?.toDate ? formatDateTime(a.at.toDate()) : 'just now'}</p>
        </div>`).join('') || '<p class="text-slate-400 text-sm">No activity recorded yet.</p>';
      const more = document.getElementById('activity-more');
      if (more) {
        more.innerHTML = latestEntries.length >= pageSize ? `<button id="activity-more-btn" class="w-full py-2 rounded-xl border text-sm">Load ${PAGE} older entries</button>` : '';
        document.getElementById('activity-more-btn')?.addEventListener('click', () => { pageSize += PAGE; subscribe(); });
      }
    }, (err) => { const host = document.getElementById('activity-list'); if (host) host.innerHTML = `<p class="text-red-600 text-sm">Error: ${escapeHtml(err.message)}</p>`; });
  };
  subscribe();
  unsubscribers.push(() => { if (unsubLog) unsubLog(); });
}

const projectBase = (projectId) => ['companies', session.companyId, 'projects', projectId];
async function readDocs(q) {
  try { return (await getDocs(q)).docs.map(dd => ({ id: dd.id, ...dd.data() })); }
  catch { return null; } // no access
}

// Brings each demand's status in line with the money received for its booking.
async function syncDemandStatuses(projectId, bookingId) {
  if (!bookingId) return;
  const base = projectBase(projectId);
  const [demands, collections] = await Promise.all([
    readDocs(query(collection(db, ...base, 'demands'), where('booking_id', '==', bookingId))),
    readDocs(query(collection(db, ...base, 'collections'), where('booking_id', '==', bookingId)))
  ]);
  if (!demands || !collections) return;
  const ledger = computeSalesLedger([{ id: bookingId, status: 'booked' }], demands, collections);
  for (const dm of demands.filter(x => x.status !== 'cancelled')) {
    const bal = ledger.demandBalances[dm.id] ?? (Number(dm.amount) || 0);
    const next = bal <= 0 ? 'paid' : (bal < (Number(dm.amount) || 0) ? 'part_paid' : 'raised');
    if (next !== dm.status) await updateDoc(doc(db, ...base, 'demands', dm.id), { status: next, updated_by: session.email, updated_at: serverTimestamp() }).catch(() => {});
  }
}

const MODULE_HOOKS = {
  bills: {
    compute(data, { refs }) {
      const order = refs.order || null;
      const amt = Number(data.amount) || 0;
      data.gst = round2(amt * (Number(data.gst_pct) || 0) / 100);
      data.total_amount = round2(amt + data.gst);
      // Blank retention/TDS % means "as agreed on the work order".
      const retPct = data.retention_pct !== '' ? Number(data.retention_pct) : (order ? Number(order.retention_pct) || 0 : 0);
      const tdsPct = data.tds_pct !== '' ? Number(data.tds_pct) : (order ? Number(order.tds_pct) || 0 : 0);
      data.retention = round2(amt * retPct / 100);
      data.tds = round2(amt * tdsPct / 100);
      data.net_payable = round2(data.total_amount - data.retention - data.tds - (Number(data.advance_recovery) || 0));
    },
    // Checks the bill against its work order before saving.
    async beforeSave(data, { projectId, refs, existingItem }) {
      const order = refs.order;
      if (!order || !Number(order.order_value)) return null;
      const others = await readDocs(query(collection(db, ...projectBase(projectId), 'bills'), where('order_id', '==', order.id)));
      if (!others) return null;
      const already = others.filter(b => b.id !== existingItem?.id && b.status !== 'rejected').reduce((t, b) => t + (Number(b.amount) || 0), 0);
      const total = already + (Number(data.amount) || 0);
      const value = Number(order.order_value);
      if (total > value + 0.5) return `Bills against order ${order.order_no} would add up to ${inrFmt(total)} (before GST) — ${inrFmt(total - value)} more than the order value of ${inrFmt(value)}.`;
      return null;
    }
  },
  orders: {
    compute(data) {
      if (!Number(data.order_value) && Array.isArray(data.items)) {
        const sum = data.items.reduce((t, r) => t + (Number(r.qty) || 0) * (Number(r.rate) || 0), 0);
        if (sum) data.order_value = round2(sum);
      }
    }
  },
  diary: {
    compute(data, { existingItem }) {
      if (!Array.isArray(data.labour)) return;
      const sum = data.labour.reduce((t, r) => t + (Number(r.nos) || 0), 0);
      const previousAuto = (Array.isArray(existingItem?.labour) ? existingItem.labour : []).reduce((t, r) => t + (Number(r.nos) || 0), 0);
      const typed = Number(data.manpower_count) || 0;
      // Recalculate when the total was blank, or was simply the old auto-sum
      // (i.e. nobody typed their own figure).
      if (sum && (!typed || (existingItem && typed === previousAuto && Number(existingItem.manpower_count) === previousAuto))) data.manpower_count = sum;
    }
  },
  payments: {
    // A bill that is now fully paid moves to "paid" by itself.
    async afterSave(data, { projectId }) {
      if (!data.bill_no_id) return;
      const base = projectBase(projectId);
      const billSnap = await getDoc(doc(db, ...base, 'bills', data.bill_no_id));
      if (!billSnap.exists() || billSnap.data().status !== 'approved') return;
      const pays = await readDocs(query(collection(db, ...base, 'payments'), where('bill_no_id', '==', data.bill_no_id)));
      if (!pays) return;
      const paid = pays.reduce((t, p) => t + (Number(p.amount) || 0), 0);
      if (paid + 0.5 >= billPayableOf(billSnap.data())) {
        await updateDoc(billSnap.ref, { status: 'paid', updated_by: session.email, updated_at: serverTimestamp() });
        logActivity(projectId, `Vendor bill ${billSnap.data().bill_no || ''} marked paid — fully covered by payments`);
      }
    }
  },
  indents: {
    compute(data) { if (data.order_id && ['requested', 'approved'].includes(data.status)) data.status = 'ordered'; }
  },
  stock: {
    // Receiving material against a request closes that request.
    async afterSave(data, { projectId }) {
      if (data.entry_type === 'outward' || !data.indent_id) return;
      await updateDoc(doc(db, ...projectBase(projectId), 'indents', data.indent_id), { status: 'received', updated_by: session.email, updated_at: serverTimestamp() });
    }
  },
  stages: { compute(data) { if (data.status === 'reached' && !data.reached_date) data.reached_date = todayStr(); } },
  rera: { compute(data) { if (data.status === 'filed' && !data.filed_date) data.filed_date = todayStr(); } },
  demands: { async afterSave(data, { projectId }) { await syncDemandStatuses(projectId, data.booking_id); } },
  collections: { async afterSave(data, { projectId }) { await syncDemandStatuses(projectId, data.booking_id); } },
  bookings: {
    // Keeps an existing buyer link in step with the booking.
    async afterSave(data, { projectId }) { if (data.share_token) await publishBuyerShare(projectId, data); }
  }
};

// ── Panels shown at the top of a record ─────────────────────────
function historyHTML(history) {
  if (!Array.isArray(history) || !history.length) return '';
  return `<div class="rounded-lg border bg-slate-50 p-2 space-y-1">${history.slice(-5).map(h => `<p class="text-[10px] text-slate-500">${h.result === 'pass' ? '✅' : '❌'} ${escapeHtml(h.label || h.step || '')} — ${escapeHtml(h.by || '')}${h.at ? ' · ' + formatDateTime(new Date(h.at)) : ''}${h.note ? ': ' + escapeHtml(h.note) : ''}</p>`).join('')}</div>`;
}

const DETAIL_EXTRAS = {
  // Vendor bill approval chain.
  bills: {
    html(item) {
      const status = item.status || 'pending';
      const step = BILL_FLOW[status];
      const breakdown = `<div class="rounded-lg border p-2 text-xs">

        <div class="rounded-lg border border-blue-200 bg-blue-50 p-2 space-y-2">

          </div>
        </div>` : `<p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">Waiting for the ${step.who} to ${step.verb.toLowerCase()} this bill.</p>`) : '';
      return breakdown + chain + historyHTML(item.approval_history) + action;
    },
    wire(item, ctx) {
      const status = item.status || 'pending';
      const step = BILL_FLOW[status];
      if (!step) return;
      const act = async (next, result, note) => {
        try {
          await settleWrite(updateDoc(ctx.itemDocRef, {
            status: next, updated_by: session.email, updated_at: serverTimestamp(),
            approval_history: arrayUnion({ step: status, label: result === 'pass' ? step.verb : 'Reject', result, by: session.profile?.name || session.email, note, at: new Date().toISOString() })
          }));
          logActivity(ctx.projectId, `${result === 'pass' ? step.verb + (step.verb.endsWith('e') ? 'd' : 'ed') : 'Rejected'} vendor bill ${item.bill_no || ''}${note ? ' — ' + note : ''}`);
          ctx.close();
        } catch (err) { await uiAlert('Could not update the bill: ' + err.message); }
      };
      document.getElementById('bill-pass')?.addEventListener('click', async () => {
        const note = await uiPrompt(`${step.verb} bill ${item.bill_no || ''} for ${inrFmt(billPayableOf(item))}? Add a note (optional):`, '', { okText: step.verb });
        if (note !== null) act(step.next, 'pass', note.trim());
      });
      document.getElementById('bill-reject')?.addEventListener('click', async () => {
        const note = ((await uiPrompt('Why is this bill being rejected?', '', { okText: 'Reject' })) || '').trim();
        if (note) act('rejected', 'fail', note);
      });
    }
  },

  // Snag workflow: open → fix submitted → verified by someone else.
  snags: {
    html(item, ctx) {
      if (!ctx.canUpdate || item.status === 'resolved') return historyHTML(item.fix_history);
      const mine = item.fix_submitted_by === session.email && !isCompanyAdmin();
      let action = '';
      if (item.status === 'fix_submitted') {
        action = mine
          ? `<p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">You submitted this fix — someone else needs to verify it.</p>`
          : `<div class="rounded-lg border border-blue-200 bg-blue-50 p-2 space-y-2">
              <p class="text-xs font-semibold text-blue-800">Fix submitted${item.fix_submitted_by ? ' by ' + escapeHtml(item.fix_submitted_by) : ''} — check the work and decide</p>
              <div class="flex gap-2">
                <button id="snag-verify" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">✅ Verified — resolve</button>
                <button id="snag-reopen" class="flex-1 py-1.5 rounded-lg bg-red-500 text-white text-xs font-semibold">↩ Not fixed — reopen</button>
              </div>
            </div>`;
      } else {
        action = `<button id="snag-submit" class="w-full py-1.5 rounded-lg border border-blue-300 text-blue-700 text-xs font-semibold">🛠 Fix done — submit for verification</button>`;
      }
      return historyHTML(item.fix_history) + action;
    },
    wire(item, ctx) {
      const move = async (next, label, result, note) => {
        try {
          await settleWrite(updateDoc(ctx.itemDocRef, {
            status: next, updated_by: session.email, updated_at: serverTimestamp(),
            ...(next === 'fix_submitted' ? { fix_submitted_by: session.email } : {}),
            fix_history: arrayUnion({ label, result, by: session.profile?.name || session.email, note, at: new Date().toISOString() }),
            ...computeResolvedAtUpdate(ctx.cfg, next, item)
          }));
          logActivity(ctx.projectId, `Snag "${item.title || ''}": ${label.toLowerCase()}${note ? ' — ' + note : ''}`);
          ctx.close();
          if (ctx.onSaved) ctx.onSaved();
        } catch (err) { await uiAlert('Could not update the snag: ' + err.message); }
      };
      document.getElementById('snag-submit')?.addEventListener('click', async () => {
        const note = await uiPrompt('What was done? (optional — add "after" photos in the form first if you have them)', '', { okText: 'Submit fix' });
        if (note !== null) move('fix_submitted', 'Fix submitted', 'pass', note.trim());
      });
      document.getElementById('snag-verify')?.addEventListener('click', async () => {
        const note = await uiPrompt('Verification note (optional):', '', { okText: 'Resolve' });
        if (note !== null) move('resolved', 'Fix verified', 'pass', note.trim());
      });
      document.getElementById('snag-reopen')?.addEventListener('click', async () => {
        const note = ((await uiPrompt('What is still wrong?', '', { okText: 'Reopen' })) || '').trim();
        if (note) move('in_progress', 'Fix rejected', 'fail', note);
      });
    }
  },

  // Booking: money position + the buyer's read-only link.
  bookings: {
    html(item, ctx) {
      const link = item.share_token ? buyerShareUrl(item.share_token) : '';
      return `<div id="bk-ledger" class="rounded-lg border p-2 text-xs text-slate-500">Loading payment position…</div>
        <div class="rounded-lg border p-2 space-y-1.5">
          <p class="text-xs font-semibold">Buyer's link</p>
          ${link ? `<input id="bk-link" readonly value="${escapeHtml(link)}" class="w-full border rounded-lg px-2 py-1 text-[11px] data-mono"/>
            <div class="flex gap-2 flex-wrap">
              <button id="bk-copy" class="text-xs px-2 py-1 rounded-lg border">Copy link</button>
              ${ctx.canUpdate ? `<button id="bk-refresh" class="text-xs px-2 py-1 rounded-lg border">↻ Update what the buyer sees</button>
              <button id="bk-revoke" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600">Turn link off</button>` : ''}
            </div>
            <p class="text-[10px] text-slate-400">Anyone with this link can see this unit's status, payments, open snags and recent site photos — no login. It shows a copy taken when you last pressed Update.</p>`
          : (ctx.canUpdate ? `<button id="bk-create" class="text-xs px-2 py-1.5 rounded-lg border border-blue-300 text-blue-700">🔗 Create a read-only link for the buyer</button>
            <p class="text-[10px] text-slate-400">The buyer sees construction status, their payments and dues, open snags and recent site photos — nothing else.</p>` : '<p class="text-[10px] text-slate-400">No link created yet.</p>')}
          <p id="bk-status" class="text-[11px]"></p>
        </div>`;
    },
    wire(item, ctx) {
      const base = projectBase(ctx.projectId);
      Promise.all([
        readDocs(query(collection(db, ...base, 'demands'), where('booking_id', '==', item.id))),
        readDocs(query(collection(db, ...base, 'collections'), where('booking_id', '==', item.id)))
      ]).then(([demands, collections]) => {
        const host = document.getElementById('bk-ledger');
        if (!host) return;
        if (!demands || !collections) { host.textContent = 'Payment position is on the Demand Letters and Collections screens.'; return; }
        const r = computeSalesLedger([item], demands, collections).rows[0] || { demanded: 0, collected: 0, due: 0, overdue: 0 };
        const cell = (l, v, cls = '') => `<div><p class="text-[10px] text-slate-500">${l}</p><p class="font-bold data-mono ${cls}">${v}</p></div>`;
        host.innerHTML = `<div class="flex flex-wrap gap-4">${cell('Agreement', inrFmt(item.agreement_value))}${cell('Demanded', inrFmt(r.demanded))}${cell('Received', inrFmt(r.collected), 'text-emerald-600')}${cell('Due', inrFmt(r.due), r.due ? 'text-amber-600' : '')}${r.overdue ? cell('Overdue', inrFmt(r.overdue), 'text-red-600') : ''}</div>`;
      });
      const say = (t, cls = 'text-slate-500') => { const el = document.getElementById('bk-status'); if (el) { el.textContent = t; el.className = 'text-[11px] ' + cls; } };
      const publish = async () => {
        say('Preparing the buyer view…');
        try {
          const token = await publishBuyerShare(ctx.projectId, item);
          item.share_token = token;
          say('Buyer link is up to date ✓', 'text-emerald-600');
          return token;
        } catch (err) { say('Could not publish: ' + err.message, 'text-red-600'); return null; }
      };
      document.getElementById('bk-create')?.addEventListener('click', async () => {
        const token = await publish();
        if (token) openGenericDetail(ctx.cfg, ctx.projectId, item, ctx.canUpdate, ctx.onSaved); // repaint with the link shown
      });
      document.getElementById('bk-refresh')?.addEventListener('click', publish);
      document.getElementById('bk-copy')?.addEventListener('click', () => {
        const el = document.getElementById('bk-link');
        el.select();
        (navigator.clipboard?.writeText(el.value) || Promise.reject()).then(() => say('Link copied ✓', 'text-emerald-600')).catch(() => say('Press and hold the link to copy it.'));
      });
      document.getElementById('bk-revoke')?.addEventListener('click', async () => {
        if (!await uiConfirm('Turn off the buyer link? Anyone who has it will no longer be able to open it.', { danger: true, okText: 'Turn off' })) return;
        try {
          await deleteDoc(doc(db, 'publicShares', item.share_token));
          await updateDoc(ctx.itemDocRef, { share_token: '' });
          item.share_token = '';
          openGenericDetail(ctx.cfg, ctx.projectId, item, ctx.canUpdate, ctx.onSaved);

  demands: {
    html() { return `<button id="dm-print" class="w-full py-1.5 rounded-lg border text-xs font-semibold">🖨 Print demand letter</button>`; },

    wire(item, ctx) { document.getElementById('rc-print')?.addEventListener('click', () => printReceipt(ctx.projectId, item)); }
  },

  // Payment plan stage: raise demand letters for every booked unit it applies to.
  stages: {
    html(item) {

      if (!canDo('demands', 'add')) return `<p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">Stage reached. Someone with permission to add Demand Letters can raise them from here.</p>`;
      return `<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-2 space-y-1.5">
        <p class="text-xs font-semibold text-emerald-800">Stage reached${item.reached_date ? ' on ' + formatDateOnly(item.reached_date) : ''}</p>
        <button id="stg-raise" class="w-full py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">📨 Raise demand letters for this stage</button>
        <p class="text-[10px] text-slate-500">One demand per booked/registered unit${item.tower && item.tower !== 'All towers' ? ' in ' + escapeHtml(item.tower) : ''}, for ${escapeHtml(String(item.pct || 0))}% of its agreement value. Units that already have a demand for this stage are skipped.</p>

  // Defect liability: is this complaint inside the liability period?
  defects: {
    html(item) {
      if (!item.handover_date) return `<p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">This unit has no recorded handover date, so the defect liability period can't be worked out.</p>`;
      const end = parseLocalDate(item.handover_date);

    }
  }
};

const kpiCell = (label, value, cls = '') => `<div class="flex-1 min-w-[110px]"><p class="eyebrow text-slate-500">${label}</p><p class="text-lg font-bold data-mono ${cls}">${value}</p></div>`;
const th = (cols) => `<thead><tr class="text-left text-slate-500">${cols.map(c => `<th class="py-1 pr-2">${c}</th>`).join('')}</tr></thead>`;
const tableWrap = (head, body) => `<div class="overflow-x-auto mt-2"><table class="w-full text-xs">${th(head)}<tbody>${body}</tbody></table></div>`;

function paintBillingSummary(host, bills, pays) {
  const led = computeBillLedger(bills, pays);
  const vendorRows = led.vendors.map(v => `<tr class="border-t"><td class="py-1 pr-2">${escapeHtml(v.name)}</td><td class="pr-2 data-mono">${inrFmt(v.billed)}</td><td class="pr-2 data-mono">${inrFmt(v.paid)}</td><td class="data-mono font-semibold">${inrFmt(v.due)}</td></tr>`).join('');
  const ledgerRows = [...led.rows].sort((a, b) => (b.bill.bill_date || '').localeCompare(a.bill.bill_date || '')).map(r =>
    `<tr class="border-t"><td class="py-1 pr-2 data-mono">${escapeHtml(r.bill.bill_no || '')}</td><td class="pr-2">${escapeHtml(r.bill.vendor || '')}</td><td class="pr-2 data-mono">${inrFmt(r.payable)}</td><td class="pr-2 data-mono">${inrFmt(r.paid)}</td><td class="pr-2 data-mono font-semibold">${inrFmt(r.balance)}</td><td>${r.state}</td></tr>`).join('');
  const dueRows = led.dueSoon.map(r => `<tr class="border-t"><td class="py-1 pr-2 data-mono">${escapeHtml(r.bill.bill_no || '')}</td><td class="pr-2">${escapeHtml(r.bill.vendor || '')}</td><td class="pr-2 data-mono font-semibold">${inrFmt(r.balance)}</td><td class="${r.dueIn < 0 ? 'text-red-600 font-semibold' : ''}">${r.dueIn < 0 ? Math.abs(r.dueIn) + ' day(s) overdue' : r.dueIn === 0 ? 'due today' : 'in ' + r.dueIn + ' day(s)'}</td></tr>`).join('');
  host.innerHTML = `
    <div class="flex flex-wrap gap-4 mb-3">${kpiCell('Approved bills', inrFmt(led.billed))}${kpiCell('Paid', inrFmt(led.paid), 'text-emerald-600')}${kpiCell('Outstanding', inrFmt(led.outstanding), 'text-red-600')}${kpiCell('In approval', `${led.inApprovalCount} · ${inrFmt(led.inApprovalAmt)}`)}${led.retentionHeld ? kpiCell('Retention held', inrFmt(led.retentionHeld)) : ''}</div>
    <p class="text-[11px] text-slate-500 mb-2">Outstanding counts approved bills only, at net payable (after retention, TDS and advance recovery). Unpaid by age: <b>${inrFmt(led.ageing.a)}</b> 0–30 days · <b>${inrFmt(led.ageing.b)}</b> 31–60 · <b class="${led.ageing.c ? 'text-red-600' : ''}">${inrFmt(led.ageing.c)}</b> over 60.</p>
    ${led.unmatched ? `<p class="text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2 mb-2">${led.unmatched} payment(s) are not linked to a bill — open each one and choose the bill under "Against Bill".</p>` : ''}

async function raiseDemandsForStage(projectId, stage) {
  const base = projectBase(projectId);
  const [bookings, existing] = await Promise.all([
    readDocs(collection(db, ...base, 'bookings')),
    readDocs(query(collection(db, ...base, 'demands'), where('stage_id', '==', stage.id)))
  ]);
  if (!bookings || !existing) { await uiAlert('You need access to Sales & Bookings and Demand Letters to do this.'); return; }
  const pct = Number(stage.pct) || 0;
  if (!pct) { await uiAlert('This stage has no percentage set.'); return; }
  const eligible = bookings.filter(b => (b.status === 'booked' || b.status === 'registered') && (!stage.tower || stage.tower === 'All towers' || b.tower === stage.tower));
  const have = new Set(existing.filter(dm => dm.status !== 'cancelled').map(dm => dm.booking_id));
  const noValue = eligible.filter(b => !have.has(b.id) && !(Number(b.agreement_value) > 0));
  const todo = eligible.filter(b => !have.has(b.id) && Number(b.agreement_value) > 0);
  if (!todo.length) {
    await uiAlert(eligible.length
      ? `Nothing to raise: ${eligible.length - noValue.length} unit(s) already have a demand for this stage${noValue.length ? `, and ${noValue.length} booking(s) have no agreement value entered` : ''}.`
      : 'There are no booked or registered units for this stage yet.');
    return;
  }
  const today = todayStr();
  const dueDate = addDaysStr(today, session.demandDueDays ?? 15);
  const total = todo.reduce((t, b) => t + round2(Number(b.agreement_value) * pct / 100), 0);
  if (!await uiConfirm(`Raise ${todo.length} demand letter(s) for "${stage.stage_name}" at ${pct}% of agreement value?\n\nTotal ${inrFmt(total)}, due ${formatDateOnly(dueDate)}.${noValue.length ? `\n\n${noValue.length} booking(s) are skipped because no agreement value is entered.` : ''}`, { okText: 'Raise demands' })) return;
  try {
    const cfg = GENERIC_MODULES.find(m => m.id === 'demands');
    const refIds = await reserveReferenceIds(cfg, projectId, todo.length);
    const writer = makeBatchWriter();
    todo.forEach((b, i) => { /* queued below */ });
    for (let i = 0; i < todo.length; i++) {
      const b = todo[i];
      await writer.set(doc(collection(db, ...base, 'demands')), {
        booking: REF_SOURCES.bookings.value(b), booking_id: b.id, unit: b.unit || '', buyer_name: b.buyer_name || '',
        stage: REF_SOURCES.stages.value(stage), stage_id: stage.id,
        description: `${stage.stage_name} — ${pct}% of agreement value`,
        amount: round2(Number(b.agreement_value) * pct / 100),
        demand_date: today, due_date: dueDate, status: 'raised', notes: '', remarks: [],
        ref_id: refIds[i], created_at: serverTimestamp(), created_by: session.email
      });
    }
    await settleWrite(writer.flush());
    logActivity(projectId, `Raised ${todo.length} demand letter(s) for stage "${stage.stage_name}" — ${inrFmt(total)}`);
    toast(`${todo.length} demand letter(s) raised ✓ — see Demand Letters`, 'success', 5000);
  } catch (err) { await uiAlert('Could not raise the demands: ' + err.message); }
}

// Amount in words, Indian numbering (lakh / crore).
function inrWords(amount) {
  const n = Math.round(Number(amount) || 0);
  if (n === 0) return 'Zero';
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (x) => x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : '');
  const three = (x) => (x >= 100 ? ones[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const parts = [];
  const crore = Math.floor(n / 10000000), lakh = Math.floor(n / 100000) % 100, thousand = Math.floor(n / 1000) % 100, rest = n % 1000;
  if (crore) parts.push((crore > 999 ? inrWords(crore) : three(crore)) + ' Crore');
  if (lakh) parts.push(two(lakh) + ' Lakh');
  if (thousand) parts.push(two(thousand) + ' Thousand');
  if (rest) parts.push(three(rest));
  return parts.join(' ');
}

    ${TEMPLATE_NOTE}`;
  openPrintWindow(`Demand letter ${dm.ref_id || ''}`, html);
}

// ── Possession pack: possession letter, the unit's snag list, key
// handover record and the signed possession checklist, as one printable PDF. ─
async function generatePossessionPack(projectId, unit, towerName) {
  const base = projectBase(projectId);
  const project = (projectsCache || []).find(p => p.id === projectId);
  const waiting = toast('Preparing possession pack…', 'info', 0);
  const [bookings, snagsById, snagsByNumber, keys, possession] = await Promise.all([
    readDocs(query(collection(db, ...base, 'bookings'), where('unit_id', '==', unit.id))),
    readDocs(query(collection(db, ...base, 'snags'), where('unit_id', '==', unit.id))),
    readDocs(query(collection(db, ...base, 'snags'), where('unit_number', '==', unit.unit_number))),
    readDocs(query(collection(db, ...base, 'keys'), where('unit_number', '==', unit.unit_number))),
    readDocs(collection(db, ...base, 'possession'))
  ]);
  waiting.remove();
  const booking = (bookings || []).find(b => b.status !== 'cancelled') || null;
  const snagMap = new Map();
  [...(snagsById || []), ...(snagsByNumber || []).filter(s => !s.unit_id)].forEach(s => snagMap.set(s.id, s));
  const snags = [...snagMap.values()];
  const checklist = (possession || []).filter(p => p.tower === towerName || p.tower === 'Common Area');
  const buyer = unit.handover?.to || booking?.buyer_name || '';
  const hDate = unit.handover?.date || '';
  const cell = 'border:1px solid #ccc;padding:5px 8px;font-size:12px;text-align:left;vertical-align:top';
  const table = (head, rows) => `<table style="border-collapse:collapse;width:100%">${head ? `<thead><tr>${head.map(h => `<th style="${cell};background:#f1f5f9">${h}</th>`).join('')}</tr></thead>` : ''}<tbody>${rows.map(r => `<tr>${r.map(c => `<td style="${cell}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const noAccess = '<p style="font-size:12px;color:#999">Not included — you do not have access to this screen.</p>';
  const openSnags = snags.filter(s => s.status !== 'resolved');
  const html = `${letterHeadHTML(project)}
    <h2 style="text-align:center;font-size:17px;margin:0 0 14px">POSSESSION PACK — UNIT ${escapeHtml(unit.unit_number)}</h2>
    ${table(null, [
      ['Tower / Building', escapeHtml(towerName || '—')], ['Unit', `${escapeHtml(unit.unit_number)}${unit.unit_type ? ' · ' + escapeHtml(unit.unit_type) : ''}${unit.floor_name ? ' · Floor ' + escapeHtml(unit.floor_name) : ''}`],
      ['Purchaser', escapeHtml(buyer || '—') + (booking?.co_applicant ? ' and ' + escapeHtml(booking.co_applicant) : '')],
      ['Status', escapeHtml(STATUS_LEGEND.find(s => s.key === unitStatus(unit))?.label || '')],
      ['Date of possession', hDate ? formatDateOnly(hDate) : '________________'],
      ['Handed over by', escapeHtml(unit.handover?.by || '________________')]
    ])}

    <h3 style="font-size:14px;margin:22px 0 6px">1. Possession letter</h3>
    <p style="font-size:13px;line-height:1.7">This is to record that vacant and peaceful possession of Unit <b>${escapeHtml(unit.unit_number)}</b>${towerName ? ', ' + escapeHtml(towerName) : ''}, in the project <b>${escapeHtml(project?.name || '')}</b>${project?.location ? ' at ' + escapeHtml(project.location) : ''}, has been handed over by <b>${escapeHtml(session.companyName || 'the Promoter')}</b> to <b>${escapeHtml(buyer || '________________')}</b> on <b>${hDate ? formatDateOnly(hDate) : '____________'}</b>.</p>
    <p style="font-size:13px;line-height:1.7">The purchaser has inspected the unit and its fittings and accepts possession, subject to the open items listed in section 2 below, which the promoter will attend to. The keys listed in section 3 have been received.</p>

    <h3 style="font-size:14px;margin:22px 0 6px">2. Snag list for this unit</h3>
    ${snags === null || (snagsById === null && snagsByNumber === null) ? noAccess : (snags.length
      ? `<p style="font-size:12px">${openSnags.length} open, ${snags.length - openSnags.length} resolved.</p>` + table(['Ref', 'Snag', 'Severity', 'Status', 'Resolved on'], snags.sort((a, b) => statusSortRank(a.status) - statusSortRank(b.status)).map(s => [escapeHtml(s.ref_id || ''), escapeHtml(s.title || ''), escapeHtml(s.severity || ''), escapeHtml(String(s.status || '').replace(/_/g, ' ')), s.resolved_at?.toDate ? formatDateOnly(localDateStr(s.resolved_at.toDate())) : '—']))
      : '<p style="font-size:12px">No snags recorded against this unit.</p>')}

    <h3 style="font-size:14px;margin:22px 0 6px">3. Key handover record</h3>
    ${keys === null ? noAccess : (keys.length
      ? table(['Key holder', 'Issued on', 'Returned on', 'Status'], keys.map(k => [escapeHtml(k.key_holder || ''), formatDateOnly(k.issued_date) || '—', formatDateOnly(k.returned_date) || '—', escapeHtml(k.status || '')]))
      : table(['Keys handed over (description)', 'Nos.', 'Received by'], [['&nbsp;', '&nbsp;', '&nbsp;'], ['&nbsp;', '&nbsp;', '&nbsp;']]))}

    <h3 style="font-size:14px;margin:22px 0 6px">4. Possession checklist — ${escapeHtml(towerName || '')} and common areas</h3>
    ${possession === null ? noAccess : (checklist.length
      ? table(['Item', 'Area', 'Status', 'Signed off by'], checklist.sort((a, b) => String(a.tower).localeCompare(String(b.tower)) || String(a.item).localeCompare(String(b.item))).map(p => [escapeHtml(p.item || ''), escapeHtml(p.tower || ''), p.status === 'completed' ? '✔ Completed' : 'Pending',
          p.signoff?.url && safeUrl(p.signoff.url) ? `<img src="${escapeHtml(safeUrl(p.signoff.url))}" style="height:28px"/><br/><span style="font-size:10px">${escapeHtml(p.signoff.by || '')}${p.signoff.at ? ' · ' + formatDateOnly(localDateStr(new Date(p.signoff.at))) : ''}</span>` : '—']))
      : '<p style="font-size:12px">No checklist items recorded.</p>')}

    <table style="width:100%;margin-top:48px;font-size:13px"><tr>
      <td style="width:50%">For <b>${escapeHtml(session.companyName || '')}</b><br/><br/><br/><br/>Authorised Signatory</td>
      <td style="width:50%">Purchaser(s)<br/><br/><br/><br/>${escapeHtml(buyer || '')}</td>
    </tr></table>
    ${TEMPLATE_NOTE}`;
  openPrintWindow(`Possession pack — ${unit.unit_number}`, html, 900);
}

// ── Buyer's read-only link ──────────────────────────────────────
// Publishing copies a small, fixed set of facts about one unit into a
// separate public record identified by a long random token. The buyer's
// page reads only that record — never the project's own data.
function buyerShareUrl(token) { return `${location.origin}${location.pathname}?share=${encodeURIComponent(token)}`; }
function newShareToken() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}
async function publishBuyerShare(projectId, booking) {
  const base = projectBase(projectId);
  const project = (projectsCache || []).find(p => p.id === projectId) || {};
  const [unitSnap, demands, collections, snags, diary] = await Promise.all([
    booking.unit_id ? getDoc(doc(db, ...base, 'units', booking.unit_id)).catch(() => null) : null,
    readDocs(query(collection(db, ...base, 'demands'), where('booking_id', '==', booking.id))),
    readDocs(query(collection(db, ...base, 'collections'), where('booking_id', '==', booking.id))),
    booking.unit_id ? readDocs(query(collection(db, ...base, 'snags'), where('unit_id', '==', booking.unit_id))) : [],
    readDocs(query(collection(db, ...base, 'diary'), orderBy('entry_date', 'desc'), limit(6)))
  ]);
  const unit = unitSnap && unitSnap.exists() ? unitSnap.data() : {};
  const ledger = computeSalesLedger([{ ...booking, status: booking.status === 'available' ? 'booked' : booking.status }], demands || [], collections || []);
  const pos = ledger.rows[0] || { demanded: 0, collected: 0, due: 0 };
  const photos = [];
  (diary || []).forEach(dd => (Array.isArray(dd.photos) ? dd.photos : []).forEach(p => { if (photos.length < 9 && safeUrl(p.url) && fileKind(p.url) === 'image') photos.push({ url: p.url, date: dd.entry_date || '' }); }));
  const token = booking.share_token || newShareToken();
  const snapshot = {
    companyId: session.companyId, projectId, bookingId: booking.id,
    companyName: session.companyName || '', companyLogoUrl: session.companyLogoUrl || '',
    projectName: project.name || '', projectLocation: project.location || '', reraNo: project.rera_no || '',
    targetDate: project.target_date || '',
    unit: booking.unit || '', unitType: unit.unit_type || '', floor: unit.floor_name || '',
    buyerName: booking.buyer_name || '',
    stage: unitStatus(unit), handoverDate: unit.handover?.date || '',
    agreementValue: Number(booking.agreement_value) || 0,
    demanded: pos.demanded, collected: pos.collected, due: pos.due,
    demands: (demands || []).filter(dm => dm.status !== 'cancelled').sort((a, b) => (a.demand_date || '').localeCompare(b.demand_date || '')).map(dm => ({
      ref: dm.ref_id || '', description: dm.description || dm.stage || '', amount: Number(dm.amount) || 0, date: dm.demand_date || '', due: dm.due_date || '', balance: ledger.demandBalances[dm.id] ?? (Number(dm.amount) || 0)
    })),
    receipts: (collections || []).sort((a, b) => (a.receipt_date || '').localeCompare(b.receipt_date || '')).map(c => ({ ref: c.ref_id || '', amount: Number(c.amount) || 0, date: c.receipt_date || '', mode: c.mode || '' })),
    snags: (snags || []).map(s => ({ title: s.title || '', status: s.status || '' })),
    photos,
    updatedAt: new Date().toISOString()
  };
  await setDoc(doc(db, 'publicShares', token), snapshot);
  if (!booking.share_token) await updateDoc(doc(db, ...base, 'bookings', booking.id), { share_token: token });
  return token;
}

  document.body.appendChild(host);
  let s = null;
  try {
    const snap = /^[a-f0-9]{32,64}$/.test(token) ? await getDoc(doc(db, 'publicShares', token)) : null;

  if (!s) {

      <h1 class="text-xl font-bold">${escapeHtml(s.unit || '')}</h1>
      <p class="text-xs text-slate-500">${[s.unitType, s.floor ? 'Floor ' + s.floor : '', s.buyerName].filter(Boolean).map(escapeHtml).join(' · ')}</p>
    </div>

      <h2 class="font-semibold text-sm mb-3">Progress</h2>
      <div class="space-y-1.5">
        ${UNIT_PIPELINE.map((st, i) => `<div class="flex items-center gap-2 text-sm"><span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] text-white ${i < stageIdx || s.stage === 'handed_over' ? 'bg-emerald-500' : i === stageIdx ? 'bg-blue-600' : 'bg-slate-300'}">${i < stageIdx || s.stage === 'handed_over' ? '✓' : i + 1}</span><span class="${i === stageIdx ? 'font-semibold' : 'text-slate-500'}">${st.key === 'crm_review' ? 'Final checks' : st.key === 'quality_review' ? 'Quality inspection' : st.label}</span></div>`).join('')}

      ${sideState ? `<p class="text-xs text-amber-700 bg-amber-50 rounded-lg px-2 py-1.5 mt-2">Work on this unit is currently marked "${escapeHtml(sideState.label)}".</p>` : ''}
      ${s.handoverDate ? `<p class="text-xs text-emerald-700 mt-2">🔑 Handed over on ${formatDateOnly(s.handoverDate)}</p>` : (s.targetDate ? `<p class="text-xs text-slate-500 mt-2">Project target completion: ${formatDateOnly(s.targetDate)}</p>` : '')}
    </div>

    </div>` : ''}
    <p class="text-[11px] text-slate-400 text-center mt-4">Information as of ${formatDateTime(new Date(s.updatedAt))}. For any question, please contact ${escapeHtml(s.companyName || 'the developer')}.</p>`;
  wireLightboxThumbnails(host);
}
if (SHARE_TOKEN) renderBuyerPortal(SHARE_TOKEN);

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// DD/MM/YYYY, h:mm AM/PM — built explicitly rather than relying on
// .toLocaleString(), which uses whatever locale the browser reports and
// can come out as MM/DD/YYYY or otherwise look "wrong" depending on device
// settings. Uses the Date object's local-time getters, so it always shows
// the viewer's own local time, correctly.
function formatDateTime(date) {
  const dd = String(date.getDate()).padStart(2, '0');
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const yyyy = date.getFullYear();
  let h = date.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const min = String(date.getMinutes()).padStart(2, '0');
  return `${dd}/${mm}/${yyyy}, ${h}:${min} ${ampm}`;
}

// ── PWA: register service worker so the app becomes installable ──
// Show a clear badge when the device loses connection, so nobody wonders
// whether their work is saving. Firestore queues writes locally and syncs
// them automatically once the connection is back.
function updateOfflineBadge() {
  const badge = document.getElementById('offline-badge');
  if (badge) badge.classList.toggle('hidden', navigator.onLine);
}
window.addEventListener('online', updateOfflineBadge);
window.addEventListener('offline', updateOfflineBadge);
updateOfflineBadge();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {
      // Fails silently if service-worker.js wasn't uploaded alongside
      // index.html — the app still works fully, just isn't installable.
    });
  });
}

// ── Scroll lock: whenever any popup/modal is open (photo viewer, add/edit
// forms, etc.) the page behind it should not scroll — that's what was
// causing the "screen jumps around while scrolling" issue. Every modal in
// this app uses the same "fixed inset-0" backdrop pattern, so instead of
// wiring lock/unlock into every single open/close function individually,
// this watches the whole page once and locks/unlocks automatically based
// on whether any modal is currently present.
function updateScrollLock() {
  const modalOpen = !!document.querySelector('.fixed.inset-0:not(#login-screen)');
  document.body.style.overflow = modalOpen ? 'hidden' : '';
}
new MutationObserver(updateScrollLock).observe(document.body, { childList: true, subtree: true });
