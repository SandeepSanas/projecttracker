<style>

<body class="bg-slate-50 text-slate-800 font-sans">

<!-- LOGIN -->
<div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 overflow-hidden">
  <div class="absolute inset-0 blueprint-grid"></div>
  <form id="login-form" class="relative max-w-sm w-full mx-4 bg-white/[0.06] backdrop-blur-xl rounded-2xl p-6 shadow-2xl border border-white/10 space-y-3">
    <div class="flex flex-col items-center mb-1">

    </div>

<!-- APP -->
<div id="app" class="hidden app-h overflow-hidden flex flex-col">
  <header class="sticky top-0 z-40 border-b border-white/40 px-3 sm:px-4 py-2 flex items-center justify-between gap-2 flex-wrap" style="background: rgba(255,255,255,0.72); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);">

    </div>
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">

        <div id="bell-panel" class="hidden fixed left-2 right-2 top-14 sm:absolute sm:left-auto sm:right-0 sm:top-auto sm:mt-2 sm:w-72 max-h-96 overflow-y-auto bg-white rounded-2xl shadow-xl border p-2 z-50"></div>
      </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  setPersistence, browserSessionPersistence,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, collection,
  onSnapshot, query, where, orderBy, serverTimestamp, updateDoc, getDocs, deleteDoc, writeBatch, arrayUnion,
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, limit,
  runTransaction, Timestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, uploadBytesResumable, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBudo4nJSg91lpbEUXuaHMhZ4C86252Slk",
  authDomain: "unittracker-41273.firebaseapp.com",
  projectId: "unittracker-41273",
  storageBucket: "unittracker-41273.firebasestorage.app",
  messagingSenderId: "563517467794",
  appId: "1:563517467794:web:8795f4a6b249a3db294a4b"
};

const JUSTCLICK_LOGO = "./logo.jpg";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Session-only persistence: closing the browser/tab fully signs the person
// out. This is deliberate for a shared-device work tool — a normal page
// refresh (same tab, browser still open) keeps you logged in, but closing
// the browser does not silently leave a session open for the next person.
setPersistence(auth, browserSessionPersistence).catch(() => {});
// Offline support: cache data locally so the app still works in a
// basement/dead zone. Writes made offline queue up and sync automatically
// once signal returns. Multi-tab manager keeps it consistent if someone
// has the app open in more than one tab.
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch {
  db = getFirestore(app); // fall back if the browser blocks local storage (e.g. private mode)
}
const storage = getStorage(app);

// ── Session state ────────────────────────────────────────────────
let session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
let unsubscribers = []; // active Firestore listeners for the current view, cleared on nav change

function clearListeners() { unsubscribers.forEach(u => u()); unsubscribers = []; }

// ── Small shared helpers ─────────────────────────────────────────
// Every async screen captures renderSeq when it starts and stops if the
// person has since navigated elsewhere — otherwise a slow screen could
// paint over the one they moved to.
let renderSeq = 0;

// A buyer's read-only link (…/index.html?share=TOKEN) shows their unit's
// status without any login.
const SHARE_TOKEN = new URLSearchParams(location.search).get('share');

// Dates: always the viewer's LOCAL calendar date. toISOString() is UTC, which
// is "yesterday" in India until 5:30 am.
function localDateStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayStr() { return localDateStr(); }
function parseLocalDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const dt = new Date(s);
  return isNaN(dt.getTime()) ? null : dt;
}
// Whole days from today to a YYYY-MM-DD date (negative = already past).
function daysUntilDate(s) {
  const target = parseLocalDate(s);
  if (!target) return null;
  return Math.round((target.getTime() - parseLocalDate(todayStr()).getTime()) / 86400000);
}
function addDaysStr(dateStr, days) {
  const dt = parseLocalDate(dateStr) || new Date();
  dt.setDate(dt.getDate() + days);
  return localDateStr(dt);
}
function formatDateOnly(s) {
  const dt = parseLocalDate(s);
  if (!dt) return '';
  return `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`;
}
function numOr(value, fallback) {
  const n = Number(value);
  return (value === '' || value == null || isNaN(n)) ? fallback : n;
}
// Only http(s) links are ever put into an href — a pasted "javascript:" link
// would otherwise run when someone else taps it.
function safeUrl(u) {
  const s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}
function normalizeLink(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(s)) return 'https://' + s;
  throw new Error('Links must start with https:// — "' + s.slice(0, 40) + '" is not a valid link.');
}
function isModalOpen() { return !!document.querySelector('.fixed.inset-0:not(#login-screen)'); }
function getModalHost(id) {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement('div'); el.id = id; document.getElementById('view').appendChild(el); }
  return el;
}

// Toast: brief message at the bottom of the screen.
function toast(message, tone = 'info', ms = 3500) {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'fixed bottom-4 right-4 z-[130] space-y-2 max-w-[90vw]';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  const color = tone === 'error' ? 'bg-red-600' : tone === 'success' ? 'bg-emerald-600' : 'bg-slate-800';
  el.className = `${color} text-white text-xs px-3 py-2 rounded-xl shadow-lg`;
  el.textContent = message;
  host.appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
  return el;
}

// Firestore write promises only resolve once the SERVER confirms. Offline
// that never happens, which used to leave forms stuck on "Saving…" even
// though the change was safely queued on the device. This waits for the
// server when it answers promptly, and otherwise lets the screen carry on.
function settleWrite(promise) {
  let finished = false;
  const guarded = Promise.resolve(promise).then(v => { finished = true; return v; });
  guarded.catch((err) => {
    if (finished) return;
    finished = true;
    console.error('Write failed', err);
    toast('A change could not be saved: ' + (err?.message || err), 'error', 7000);
  });
  const waitMs = navigator.onLine ? 8000 : 350;
  return Promise.race([guarded, new Promise(res => setTimeout(res, waitMs))]);
}
function logActivity(projectId, action) {
  if (!projectId || !session.companyId) return;
  addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'activityLog'), {
    actor: session.email, action, at: serverTimestamp()
  }).catch(() => {});
}

// ── In-app dialogs (replace the browser's alert / confirm / prompt) ──
function uiDialog({ title = '', message = '', input = false, defaultValue = '', placeholder = '', okText = 'OK', cancelText = null, danger = false, requireText = null }) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[120] p-4" data-ui-dialog>
        <div class="bg-white rounded-2xl p-4 max-w-sm w-full space-y-3 shadow-2xl">
          ${title ? `<h3 class="font-bold text-sm">${escapeHtml(title)}</h3>` : ''}
          ${message ? `<p class="text-sm text-slate-600" style="white-space:pre-wrap">${escapeHtml(message)}</p>` : ''}
          ${input ? `<input data-ui-input type="text" value="${escapeHtml(defaultValue)}" placeholder="${escapeHtml(placeholder)}" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>` : ''}
          <div class="flex gap-2 pt-1">
            <button data-ui-ok class="flex-1 py-2 rounded-xl ${danger ? 'bg-red-600' : 'bg-blue-600'} text-white text-sm font-semibold">${escapeHtml(okText)}</button>
            ${cancelText ? `<button data-ui-cancel class="flex-1 py-2 rounded-xl border text-sm">${escapeHtml(cancelText)}</button>` : ''}
          </div>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const inputEl = wrap.querySelector('[data-ui-input]');
    const okBtn = wrap.querySelector('[data-ui-ok]');
    const done = (value) => { document.removeEventListener('keydown', onKey, true); wrap.remove(); resolve(value); };
    const ok = () => {
      if (requireText && (inputEl?.value || '').trim() !== requireText) { inputEl.classList.add('border-red-500'); return; }
      done(input ? inputEl.value : true);
    };
    const cancel = () => done(input ? null : false);
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); cancelText ? cancel() : ok(); }
      else if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); ok(); }
    };
    document.addEventListener('keydown', onKey, true);
    okBtn.addEventListener('click', ok);
    wrap.querySelector('[data-ui-cancel]')?.addEventListener('click', cancel);
    setTimeout(() => (inputEl || okBtn).focus(), 30);
  });
}
const uiAlert = (message, title = '') => uiDialog({ message, title });
const uiConfirm = (message, opts = {}) => uiDialog({ message, cancelText: 'Cancel', okText: opts.okText || 'Yes', danger: !!opts.danger, title: opts.title || '' });
const uiPrompt = (message, defaultValue = '', opts = {}) => uiDialog({ message, input: true, defaultValue, cancelText: 'Cancel', okText: opts.okText || 'OK', placeholder: opts.placeholder || '', title: opts.title || '' });

// Escape closes the top-most popup.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || document.querySelector('[data-ui-dialog]')) return;
  const open = [...document.querySelectorAll('.fixed.inset-0:not(#login-screen)')];
  const top = open[open.length - 1];
  if (!top) return;
  const closeBtn = top.querySelector('[id$="close-x"], [id$="-cancel"], #lightbox-close, #ann-skip, #gm-detail-close');
  if (closeBtn) closeBtn.click();
});

// Opens a print-ready window; tells the person if the browser blocked it.
function openPrintWindow(title, bodyHtml, delayMs = 500) {
  const w = window.open('', '_blank');
  if (!w) { uiAlert('Your browser blocked the report window. Allow pop-ups for this site and try again.'); return null; }
  w.document.write(`<html><head><title>${escapeHtml(title)}</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="font-family:system-ui;padding:24px;max-width:860px;margin:0 auto">${bodyHtml}<script>setTimeout(()=>print(),${delayMs})<\/script></body></html>`);
  w.document.close();
  return w;
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Auth wiring ──────────────────────────────────────────────────
document.getElementById('login-logo-img').src = JUSTCLICK_LOGO;

// Clears the login form completely — called after every sign-out so the
// next person to use this device never sees a previous person's typed
// email/password or a stuck "Signing in…" button.
function resetLoginForm() {
  const form = document.getElementById('login-form');
  form.reset();
  document.getElementById('login-password').type = 'password';
  document.getElementById('login-pw-toggle').textContent = '👁️';
  document.getElementById('login-error').classList.add('hidden');

function friendlyAuthError(err) {
  if (err.code === 'auth/email-already-in-use') return 'A login with that email already exists.';
  if (err.code === 'auth/weak-password') return 'That password is too weak — use at least 8 characters.';
  if (err.code === 'auth/invalid-email') return 'That email address does not look right.';
  if (err.code === 'auth/network-request-failed') return 'No connection — check your internet and try again.';
  if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') return 'Incorrect email or password.';
  if (err.code === 'auth/user-not-found') return 'No account with that email. Ask your admin to create one.';
  if (err.code === 'auth/too-many-requests') return 'Too many attempts — wait a moment and try again.';
  return err.message;
}

let profileUnsub = null;
let hadSession = false;
onAuthStateChanged(auth, async (user) => {
  if (SHARE_TOKEN) return; // buyer view — no staff session on this page
  clearListeners();
  if (profileUnsub) { profileUnsub(); profileUnsub = null; }
  if (!user) {
    stopProjectsWatcher();
    bellUnsubs.forEach(u => u()); bellUnsubs = []; bellCache = {};
    // A full reload is the only reliable way to drop everything held in
    // memory (user lists, categories, cached records) so the next person on a
    // shared device can never see the previous company's data.
    if (hadSession) { location.reload(); return; }
    session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
    resetLoginForm();
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  session.uid = user.uid;
  session.email = user.email;

  try {
    // Check super_admin first
    const adminSnap = await getDoc(doc(db, 'admins', user.uid)).catch(() => null);
    if (adminSnap && adminSnap.exists()) {
      session.isSuperAdmin = true;
      session.companyId = null;
      session.profile = { role:'super_admin', name: user.email, permissions:{} };
      finishLogin();
      return;
    }
    // Find which company this user belongs to via a small lookup doc
    // written when the account was created.
    const lookupSnap = await getDoc(doc(db, 'userCompanyLookup', user.uid));
    if (!lookupSnap.exists()) {
      await failLogin('Your account is not linked to a company yet. Contact your Company Admin.');
      return;
    }
    session.companyId = lookupSnap.data().companyId;
    const companySnap = await getDoc(doc(db, 'companies', session.companyId));
    applyCompanySettings(companySnap.exists() ? companySnap.data() : {});

    // Live-subscribe to this person's own profile so permission changes made
    // by Company Admin apply immediately.
    let firstLoad = true;
    profileUnsub = onSnapshot(doc(db, 'companies', session.companyId, 'users', user.uid), (snap) => {
      if (!snap.exists() && snap.metadata.fromCache) return; // offline and not cached yet — wait for the server
      const prev = session.profile;
      session.profile = snap.exists() ? snap.data() : null;
      if (!session.profile) { failLogin('Your access has been removed. Contact your Company Admin.'); return; }
      if (session.profile.suspended) { failLogin('Your account has been suspended by your Company Admin.'); return; }
      if (firstLoad) { firstLoad = false; finishLogin(); return; }
      document.getElementById('role-label').textContent = session.profile.role || '';
      const sig = (p) => JSON.stringify([p?.role, p?.permissions, p?.assignedProjects, p?.canApproveQuality, p?.canApproveCRM, p?.canCertifyBills, p?.canCheckBills, p?.canApproveBills]);
      if (sig(prev) === sig(session.profile)) return;
      refreshProjectSelector();
      // Don't throw away a form someone is in the middle of filling in — just
      // refresh the menu now; the screen itself picks up the new rights the
      // next time it is opened.
      buildNav(!isModalOpen());
    }, (err) => { failLogin('Could not load your profile: ' + err.message); });
  } catch (err) {
    await failLogin('Sign-in could not be completed: ' + (err?.message || err) + ' Check your connection and try again.');
  }
});

function applyCompanySettings(c) {

// ── Projects: one live listener for the whole session. Every screen reads
// from this instead of re-fetching the project list on each navigation. ──
let projectsCache = null;
let projectsUnsub = null;
let projectsReady = null;
function startProjectsWatcher() {
  stopProjectsWatcher();
  let resolveReady;
  projectsReady = new Promise(res => { resolveReady = res; });
  projectsUnsub = onSnapshot(collection(db, 'companies', session.companyId, 'projects'), (snap) => {
    projectsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
    resolveReady();
    refreshProjectSelector();
    if (currentViewId === 'projects' && document.getElementById('project-list')) loadProjectList();
  }, () => { projectsCache = projectsCache || []; resolveReady(); });
}
function stopProjectsWatcher() {
  if (projectsUnsub) projectsUnsub();
  projectsUnsub = null; projectsCache = null; projectsReady = null;
}
function visibleProjects() {
  const live = (projectsCache || []).filter(p => !p.archived);
  const assigned = session.profile?.assignedProjects;
  if (assigned && assigned.length) return live.filter(p => assigned.includes(p.id));
  return live; // no restriction set = access to all projects
}

// ── Global project selector: one place to choose which project you're
// looking at. Every module reads from this, so switching here switches
// the whole app rather than each screen tracking its own project. ──────
let activeProjectId = null;

function setActiveProject(id, { rerender = false } = {}) {
  if (!id || id === activeProjectId) return;
  activeProjectId = id;
  try { localStorage.setItem(`pt-project-${session.companyId}`, id); } catch {}
  const sel = document.getElementById('global-project-select');
  if (sel) sel.value = id;
  startBellWatchers();
  if (rerender && currentViewId) renderView(currentViewId);
}

function refreshProjectSelector() {
  const sel = document.getElementById('global-project-select');
  if (!sel || session.isSuperAdmin || !projectsCache) return;
  const projects = visibleProjects();
  if (!projects.length) { sel.classList.add('hidden'); activeProjectId = null; return; }
  const previous = activeProjectId;
  if (!activeProjectId || !projects.some(p => p.id === activeProjectId)) {
    let remembered = null;
    try { remembered = localStorage.getItem(`pt-project-${session.companyId}`); } catch {}
    activeProjectId = (remembered && projects.some(p => p.id === remembered)) ? remembered : projects[0].id;
  }
  sel.innerHTML = projects.map(p => `<option value="${escapeHtml(p.id)}" ${p.id===activeProjectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
  sel.classList.remove('hidden');
  if (!sel.dataset.wired) {
    sel.dataset.wired = '1';
    sel.addEventListener('change', () => setActiveProject(sel.value, { rerender: true }));
  }
  if (previous !== activeProjectId) {
    startBellWatchers();
    // The project being viewed was archived/removed/unassigned — move the open screen to the new one.
    if (previous && currentViewId && !isModalOpen()) renderView(currentViewId);
  }
}

// Every module calls this instead of tracking its own project.
function getActiveProjectId(projects) {
  if (activeProjectId && projects.some(p => p.id === activeProjectId)) return activeProjectId;
  const first = projects[0]?.id || null;
  if (first) setActiveProject(first); else activeProjectId = null;
  return activeProjectId;
}

  activity:'Activity Log', users:'Users', projects:'Projects', settings:'Company Settings'
};
function moduleLabel(id) {
  return FIXED_LABELS[id] || GENERIC_MODULES.find(m => m.id === id)?.label || id;
}
// company_admin is the account that sets everyone else's permissions, so
// it always sees everything. Every other role — INCLUDING management —
// strictly follows the view permission Company Admin actually set for them.
function isCompanyAdmin() { return session.profile?.role === 'company_admin'; }
function canDo(moduleId, perm) { return isCompanyAdmin() || !!session.profile?.permissions?.[moduleId]?.[perm]; }
function canViewModule(moduleId) { return canDo(moduleId, 'view'); }

function moduleList() {
  if (session.isSuperAdmin) return [{ id:'companies', label:'Companies', group:'Platform' }];
  const out = [];
  NAV_GROUPS.forEach(([group, ids]) => ids.forEach(id => {
    let ok;
    if (['portfolio', 'dashboard', 'my-items'].includes(id)) ok = true;
    else if (['users', 'projects', 'settings'].includes(id)) ok = isCompanyAdmin();
    else ok = canViewModule(id);
    if (ok) out.push({ id, label: moduleLabel(id), group });
  }));
  // Any module not placed in a group above still shows up (under "More").
  GENERIC_MODULES.forEach(cfg => {
    if (NAV_GROUPS.some(g => g[1].includes(cfg.id))) return;
    if (canViewModule(cfg.id)) out.push({ id: cfg.id, label: cfg.label, group: 'More' });
  });
  return out;
}

let currentViewId = null;
function buildNav(rerender = true) {
  const nav = document.getElementById('side-nav');
  const mods = moduleList();
  let lastGroup = null;
  nav.innerHTML = mods.map(m => {
    const header = m.group !== lastGroup ? `<p class="hidden sm:block eyebrow text-slate-400 px-3 pt-3 pb-0.5">${escapeHtml(m.group)}</p>` : '';
    lastGroup = m.group;
    return `${header}<button data-mod="${escapeHtml(m.id)}" class="nav-btn text-left px-3 py-2 rounded-xl hover:bg-slate-100 whitespace-nowrap shrink-0">${escapeHtml(m.label)}</button>`;
  }).join('');
  nav.querySelectorAll('[data-mod]').forEach(b => b.addEventListener('click', () => renderView(b.dataset.mod)));
  const stillValid = currentViewId && mods.some(m => m.id === currentViewId);
  if (!rerender && stillValid) { markActiveNav(currentViewId); return; }
  const defaultView = session.profile?.defaultView;
  const fallback = mods.some(m => m.id === 'dashboard') ? 'dashboard' : mods[0].id;
  const preferredDefault = (!currentViewId && defaultView && mods.some(m => m.id === defaultView)) ? defaultView : fallback;
  renderView(stillValid ? currentViewId : preferredDefault);
}

function markActiveNav(id) {
  document.querySelectorAll('#side-nav [data-mod]').forEach(b => {
    const active = b.dataset.mod === id;
    b.classList.toggle('bg-blue-50', active);
    b.classList.toggle('text-blue-700', active);
    b.classList.toggle('font-semibold', active);
  });
}

function renderView(id) {
  currentViewId = id;
  renderSeq++;
  clearListeners();
  markActiveNav(id);
  const view = document.getElementById('view');
  view.scrollTop = 0;
  if (id === 'companies') return renderCompanies(view);
  if (id === 'users') return renderUsers(view);
  if (id === 'projects') return renderProjects(view);
  if (id === 'settings') return renderSettings(view);
  if (id === 'portfolio') return renderPortfolio(view);
  if (id === 'dashboard') return renderDashboard(view);
  if (id === 'my-items') return renderMyItems(view);
  if (id === 'visual') return renderVisual(view);
  if (id === 'activity') return renderActivityLog(view);
  const cfg = GENERIC_MODULES.find(m => m.id === id);
  if (cfg) return renderGenericModule(view, cfg);
}

// ── Create an Auth account WITHOUT logging the browser in as that
//    new user — uses a throwaway secondary Firebase App instance so
//    the admin's own session stays active. No Cloud Functions needed.
let secondaryAppCounter = 0;
async function createAuthAccountWithoutSwitchingSession(email, password) {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
  const secondary = appMod.initializeApp(firebaseConfig, 'secondary-' + (secondaryAppCounter++));
  try {
    const secondaryAuth = authMod.getAuth(secondary);
    const cred = await authMod.createUserWithEmailAndPassword(secondaryAuth, email, password);
    const uid = cred.user.uid;
    await authMod.signOut(secondaryAuth);
    return uid;
  } finally {
    await appMod.deleteApp(secondary).catch(() => {});
  }
}
function randomPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => chars[b % chars.length]).join('') + '#7k';
}
// Creates the login. With no password typed, a random one is used that
// nobody ever sees, and the person gets an email link to set their own.
async function createLoginAccount(email, typedPassword) {
  const typed = (typedPassword || '').trim();
  if (typed && typed.length < 8) throw new Error('Temporary password must be at least 8 characters (or leave it blank to send an email link).');
  const uid = await createAuthAccountWithoutSwitchingSession(email, typed || randomPassword());
  let invited = false;
  if (!typed) {
    try { await sendPasswordResetEmail(auth, email); invited = true; } catch { invited = false; }
  }
  return { uid, invited };
}

function wireRoleSelect(id) {

    const newRole = await uiPrompt('New role name (e.g. accountant, site_supervisor):');
    const clean = (newRole || '').trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

    if (![...el.options].some(o => o.value === clean)) {

    el.value = clean;
    previous = clean;
  });
}

// Single source of truth for the Users screen's permission checklist —
// 'visual' plus every generic module. Stays in sync automatically as
// GENERIC_MODULES grows.
const ALL_MODULES = ['visual', ...GENERIC_MODULES.map(m => m.id), 'activity'];

// Builds the "tick what they can do" field set per module (View / Add /
// Update / Delete) — reused for both Add User and Edit User so
// permissions stay dynamic/editable. A module only ends up in the
// saved permissions object if at least one box is ticked for it.
function approvalRightsHTML(prefix, existing = {}) {
  const box = (key, id, html) => `<label class="flex items-center gap-2 mb-1"><input type="checkbox" id="${prefix}-${id}" ${existing[key]?'checked':''}/> ${html}</label>`;
  return `<div class="text-xs border rounded-lg p-2">
    <p class="eyebrow text-slate-500 mb-1">Unit approval rights</p>
    ${box('canApproveQuality', 'approve-quality', 'Can Pass/Fail at <b>Quality Review</b>')}
    ${box('canApproveCRM', 'approve-crm', 'Can Pass/Fail at <b>CRM/Sales Review</b>')}
    <p class="eyebrow text-slate-500 mb-1 mt-2">Vendor bill approval chain</p>
    ${box('canCertifyBills', 'bill-certify', 'Step 1 — can <b>Certify</b> bills (site engineer)')}
    ${box('canCheckBills', 'bill-check', 'Step 2 — can <b>Check</b> bills (accounts)')}
    ${box('canApproveBills', 'bill-approve', 'Step 3 — can <b>Approve</b> bills for payment (owner)')}
    <p class="text-[10px] text-slate-400 mt-1">Company Admins can always approve, regardless of these.</p>
  </div>`;
}
function readApprovalRights(prefix) {
  const on = (id) => !!document.getElementById(`${prefix}-${id}`)?.checked;
  return {
    canApproveQuality: on('approve-quality'), canApproveCRM: on('approve-crm'),
    canCertifyBills: on('bill-certify'), canCheckBills: on('bill-check'), canApproveBills: on('bill-approve')
  };
}

function defaultViewOptionsHTML(id, selected) {
  const ids = [...new Set(['dashboard', 'portfolio', 'my-items', 'visual', ...GENERIC_MODULES.map(m => m.id)])];
  return `<div>
    <p class="eyebrow text-slate-500 mb-1">Default landing page after login</p>
    <select id="${id}" class="w-full border rounded-lg px-2 py-1.5 text-sm">
      ${ids.map(o => `<option value="${escapeHtml(o)}" ${o===(selected||'dashboard')?'selected':''}>${escapeHtml(moduleLabel(o))}</option>`).join('')}
    </select>
  </div>`;
}

// Permission checklist, grouped the same way as the side menu and labelled
// with the screen names people actually see.
function moduleFieldsHTML(prefix, existing = {}) {
  const groups = [];
  NAV_GROUPS.forEach(([group, ids]) => {
    const mods = ids.filter(id => ALL_MODULES.includes(id));
    if (mods.length) groups.push([group, mods]);
  });
  const placed = groups.flatMap(g => g[1]);
  const rest = ALL_MODULES.filter(m => !placed.includes(m));
  if (rest.length) groups.push(['Other', rest]);
  return `<div class="flex gap-2 mb-1">
      <button type="button" data-perm-all="${prefix}" data-perm-mode="view" class="text-[11px] px-2 py-0.5 rounded border">Tick all "view"</button>
      <button type="button" data-perm-all="${prefix}" data-perm-mode="all" class="text-[11px] px-2 py-0.5 rounded border">Tick everything</button>
      <button type="button" data-perm-all="${prefix}" data-perm-mode="none" class="text-[11px] px-2 py-0.5 rounded border">Clear</button>
    </div>` + groups.map(([group, mods]) => `
    <p class="eyebrow text-slate-400 mt-2">${escapeHtml(group)}</p>
    ${mods.map(m => {
      const ex = existing[m] || {};
      return `
      <div class="border-b border-slate-100 py-1.5">
        <p class="text-xs font-medium">${escapeHtml(moduleLabel(m))}</p>
        <div class="flex gap-3 mt-1 text-[11px] text-slate-500">
          ${['view','add','update','delete'].map(p => `
            <label class="flex items-center gap-1">
              <input type="checkbox" class="${prefix}-mod-perm" data-mod="${m}" data-perm="${p}" ${ex[p] ? 'checked' : ''}/> ${p}
            </label>`).join('')}
        </div>
      </div>`;
    }).join('')}`).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-perm-all]');
  if (!b) return;
  const mode = b.dataset.permMode;
  document.querySelectorAll(`.${b.dataset.permAll}-mod-perm`).forEach(cb => {
    cb.checked = mode === 'all' ? true : mode === 'none' ? false : (cb.dataset.perm === 'view' ? true : cb.checked);
  });
});

function readModuleFields(prefix) {
  const permissions = {};
  ALL_MODULES.forEach(m => {
    const perms = {};
    let any = false;
    ['view','add','update','delete'].forEach(p => {
      const el = document.querySelector(`.${prefix}-mod-perm[data-mod="${m}"][data-perm="${p}"]`);
      const checked = el ? el.checked : false;
      perms[p] = checked;
      if (checked) any = true;
    });
    if (any) permissions[m] = perms; // only store modules with at least one permission granted
  });
  return permissions;
}

// How many active Company Admins exist besides this user — used to stop the
// last admin being removed, suspended or demoted (which would lock everyone out).
function otherActiveAdmins(uid) {
  return userListCache.filter(u => u.id !== uid && u.role === 'company_admin' && !u.suspended).length;
}

        <button id="eu-close-x" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-xl leading-none w-8 h-8 flex items-center justify-center">✕</button>

        <p class="text-[11px] text-slate-400">${escapeHtml(u.email)}</p>
        <input id="eu-name" value="${escapeHtml(u.name)}" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
        ${roleSelectHTML}
        ${defaultViewOptionsHTML('eu-default-view', u.defaultView)}
        ${approvalRightsHTML('eu', u)}

          <div class="flex flex-wrap gap-2">${projects.map(p => `<label class="flex items-center gap-1"><input type="checkbox" class="eu-project" value="${escapeHtml(p.id)}" ${assigned.includes(p.id)?'checked':''}/> ${escapeHtml(p.name)}${p.archived ? ' (archived)' : ''}</label>`).join('')}</div>
        </div>` : ''}
        <div class="text-xs">
          <p class="eyebrow text-slate-500 mb-1">Module access &amp; permissions</p>
          <div id="eu-modules" class="max-h-64 overflow-y-auto">${moduleFieldsHTML('eu', u.permissions || {})}</div>
        </div>
        <div class="flex gap-2">
          <button id="eu-reset-pw" type="button" class="flex-1 py-1.5 rounded-lg border text-xs">✉️ Send password reset email</button>
          ${isSelf ? '' : `<button id="eu-suspend" type="button" class="flex-1 py-1.5 rounded-lg border text-xs ${u.suspended ? 'text-emerald-700 border-emerald-300' : 'text-red-700 border-red-300'}">${u.suspended ? '▶ Reactivate' : '⏸ Suspend'}</button>`}
        </div>
        <div class="flex gap-2 pt-2">
          <button id="eu-save" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Save</button>
          <button id="eu-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="eu-error" class="hidden text-xs text-red-600"></p>
        <p id="eu-info" class="hidden text-xs text-emerald-600"></p>
      </div>
    </div>`;
  wireRoleSelect('eu-role');
  if (isSelf) document.getElementById('eu-role').disabled = true;
  const showErr = (msg) => { const el = document.getElementById('eu-error'); el.textContent = msg; el.classList.remove('hidden'); };
  document.getElementById('eu-close-x').addEventListener('click', () => modal.innerHTML = '');

  document.getElementById('eu-reset-pw').addEventListener('click', async () => {
    const infoEl = document.getElementById('eu-info');
    try {
      await sendPasswordResetEmail(auth, u.email);
      infoEl.textContent = `Reset email sent to ${u.email}.`;
      infoEl.classList.remove('hidden');
    } catch (err) { showErr(err.message); }
  });
  document.getElementById('eu-suspend')?.addEventListener('click', async () => {
    const nowSuspended = !u.suspended;
    if (nowSuspended && u.role === 'company_admin' && otherActiveAdmins(uid) === 0) { showErr('This is the only active Company Admin — make someone else an admin first.'); return; }
    if (!await uiConfirm(nowSuspended ? 'Suspend this user? They will be signed out immediately and blocked from logging in until reactivated.' : 'Reactivate this user?', { danger: nowSuspended })) return;
    try {
      await updateDoc(doc(db, 'companies', session.companyId, 'users', uid), { suspended: nowSuspended });
      modal.innerHTML = '';
      loadUserList();
    } catch (err) { showErr(err.message); }
  });

  document.getElementById('eu-cancel').addEventListener('click', () => modal.innerHTML = '');
  document.getElementById('eu-save').addEventListener('click', async () => {
    const btn = document.getElementById('eu-save');
    const newRole = isSelf ? u.role : document.getElementById('eu-role').value;
    if (newRole === '__add_new__') { showErr('Choose a role.'); return; }
    if (u.role === 'company_admin' && newRole !== 'company_admin' && !u.suspended && otherActiveAdmins(uid) === 0) {
      showErr('This is the only active Company Admin — make someone else an admin before changing this role.'); return;
    }
    if (u.role !== 'company_admin' && newRole === 'company_admin' &&
        !await uiConfirm(`Make ${u.name} a Company Admin?\n\nThey will be able to see and change everything, including users and permissions.`, { okText: 'Make admin' })) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    const assignedProjects = [...document.querySelectorAll('.eu-project:checked')].map(c => c.value);
    try {
      await updateDoc(doc(db, 'companies', session.companyId, 'users', uid), {
        name: document.getElementById('eu-name').value.trim() || u.name,
        role: newRole,
        permissions: readModuleFields('eu'),
        assignedProjects,
        defaultView: document.getElementById('eu-default-view').value,
        ...readApprovalRights('eu')
      });
      modal.innerHTML = '';
      loadUserList();
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; btn.textContent = 'Save';
    }
  });
}

async function deleteUserFlow(uid) {
  if (uid === session.uid) { await uiAlert('You cannot remove your own account. Ask another Company Admin to do it.'); return; }
  const target = userListCache.find(u => u.id === uid);
  if (target?.role === 'company_admin' && !target.suspended && otherActiveAdmins(uid) === 0) {
    await uiAlert('This is the only active Company Admin — make someone else an admin first.'); return;
  }
  if (!await uiConfirm("Remove this user's access? They will be signed out and blocked from the app immediately.\n\nNote: this removes their app profile. The underlying login account itself can only be deleted from the Firebase console.", { danger: true, okText: 'Remove' })) return;
  try {
    await deleteDoc(doc(db, 'companies', session.companyId, 'users', uid));
    await deleteDoc(doc(db, 'userCompanyLookup', uid)).catch(() => {});
  } catch (err) { await uiAlert('Could not remove: ' + err.message); }
  loadUserList();
}

// ── Backup / restore ────────────────────────────────────────────
// Firestore timestamps are written as { __ts: ISO } so a restore can turn
// them back into real timestamps (older backups used plain ISO strings,
// which still restore — just as text).
function cleanDocData(data) {
  const out = {};
  for (const [k, v] of Object.entries(data)) {
    out[k] = (v && typeof v.toDate === 'function') ? { __ts: v.toDate().toISOString() } : v;
  }
  return out;
}
function reviveDocData(data) {
  const out = {};
  for (const [k, v] of Object.entries(data || {})) {
    if (k === 'id') continue;
    if (v && typeof v === 'object' && !Array.isArray(v) && typeof v.__ts === 'string' && Object.keys(v).length === 1) {
      out[k] = Timestamp.fromDate(new Date(v.__ts));
    } else out[k] = v;
  }
  return out;
}
function projectSubCollections() {
  return ['towers', 'units', 'activityLog', 'counters', ...GENERIC_MODULES.map(m => m.id)];
}
// Batches writes in groups of 400 (Firestore allows 500 per batch).
function makeBatchWriter() {
  let batch = writeBatch(db), pending = 0, total = 0;
  const roll = async () => { if (pending >= 400) { await batch.commit(); batch = writeBatch(db); pending = 0; } };
  return {
    async set(refx, data) { batch.set(refx, data); pending++; total++; await roll(); },
    async update(refx, data) { batch.update(refx, data); pending++; total++; await roll(); },
    async del(refx) { batch.delete(refx); pending++; total++; await roll(); },
    async flush() { if (pending) { await batch.commit(); batch = writeBatch(db); pending = 0; } },
    get total() { return total; }
  };
}

async function buildCompanyBackup() {
  const companySnap = await getDoc(doc(db, 'companies', session.companyId));
  const usersSnap = await getDocs(collection(db, 'companies', session.companyId, 'users'));
  const projectsSnap = await getDocs(collection(db, 'companies', session.companyId, 'projects'));
  const catsSnap = await getDocs(collection(db, 'companies', session.companyId, 'customCategories')).catch(() => ({ docs: [] }));
  const backup = {
    format: 2,
    exportedAt: new Date().toISOString(),
    exportedBy: session.email,
    company: { id: session.companyId, ...cleanDocData(companySnap.data() || {}) },
    users: usersSnap.docs.map(d => ({ id:d.id, ...cleanDocData(d.data()) })),
    customCategories: catsSnap.docs.map(d => ({ id:d.id, ...cleanDocData(d.data()) })),
    projects: []
  };
  for (const pdoc of projectsSnap.docs) {
    const projectEntry = { id: pdoc.id, ...cleanDocData(pdoc.data()), data: {} };
    for (const col of projectSubCollections()) {
      try {
        const colSnap = await getDocs(collection(db, 'companies', session.companyId, 'projects', pdoc.id, col));
        projectEntry.data[col] = colSnap.docs.map(d => ({ id:d.id, ...cleanDocData(d.data()) }));
      } catch { projectEntry.data[col] = []; }
    }
    backup.projects.push(projectEntry);
  }
  return backup;
}

  const status = document.getElementById('settings-backup-status');
  status.textContent = 'Preparing backup — this can take a moment for larger companies…';

    downloadBlob(blob, `projecttracker-backup-${(session.companyName||session.companyId).replace(/[^\w-]+/g,'_')}-${todayStr()}.json`);
    status.textContent = 'Backup downloaded ✓'; status.className = 'text-xs text-emerald-600';

  }
}

async function saveCloudBackup() {
  const backup = await buildCompanyBackup();
  const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
  const fileRef = ref(storage, `companies/${session.companyId}/backups/backup-${todayStr()}.json`);
  await uploadBytes(fileRef, blob, { contentType: 'application/json' });
  const iso = new Date().toISOString();
  await updateDoc(doc(db, 'companies', session.companyId), { lastBackupAt: iso });
  session.lastBackupAt = iso;
}
// Weekly automatic backup. There is no server here to run on a timer, so it
// runs quietly in the background when a Company Admin is signed in and the
// last cloud backup is more than 7 days old.
async function maybeAutoBackup() {
  if (!isCompanyAdmin() || !session.autoBackup || !navigator.onLine) return;
  const last = session.lastBackupAt ? new Date(session.lastBackupAt).getTime() : 0;
  if (Date.now() - last < 7 * 86400000) return;
  try { await saveCloudBackup(); } catch (err) { console.warn('Automatic backup skipped:', err?.message || err); }
}

async function restoreCompanyBackup(backup, statusEl) {
  if (!backup || !Array.isArray(backup.projects)) throw new Error('This file is not a ProjectTracker backup.');
  const fromOther = backup.company?.id && backup.company.id !== session.companyId;
  const summary = `${backup.projects.length} project(s), exported ${backup.exportedAt ? formatDateTime(new Date(backup.exportedAt)) : 'at an unknown time'}${fromOther ? `\n\nWARNING: this backup came from a different company (${backup.company?.name || backup.company?.id}).` : ''}`;
  const typed = await uiDialog({
    title: 'Restore from backup', message: `${summary}\n\nRecords with the same ID will be overwritten with the backup's version. The Activity Log and user logins are not restored. Type RESTORE to continue.`,
    input: true, requireText: 'RESTORE', okText: 'Restore', cancelText: 'Cancel', danger: true
  });
  if (typed === null) return;
  const say = (t, cls = 'text-slate-500') => { statusEl.textContent = t; statusEl.className = 'text-xs ' + cls; };
  const writer = makeBatchWriter();
  for (const c of (backup.customCategories || [])) {
    await writer.set(doc(db, 'companies', session.companyId, 'customCategories', c.id), reviveDocData(c));
  }
  for (const p of backup.projects) {
    say(`Restoring ${p.name || p.id}…`);
    const { data, ...projectFields } = p;
    await writer.set(doc(db, 'companies', session.companyId, 'projects', p.id), reviveDocData(projectFields));
    for (const [col, docs] of Object.entries(data || {})) {
      if (col === 'activityLog') continue; // audit trail is append-only — never rewritten
      for (const rec of (docs || [])) {
        if (!rec || !rec.id) continue;
        await writer.set(doc(db, 'companies', session.companyId, 'projects', p.id, col, rec.id), reviveDocData(rec));
      }
    }
  }
  await writer.flush();
  Object.keys(customCategoryCache).forEach(k => delete customCategoryCache[k]);
  say(`Restore complete ✓ ${writer.total} record(s) written.`, 'text-emerald-600');
}

// ── Project cloning: copies only the STRUCTURE (towers, floors, unit
// types) as a fresh template — not snags/tasks/budget/any actual progress
// data. New units all start at status "pending", exactly like a brand new
// project would, so project #2 onward doesn't need towers rebuilt by hand.
async function openCloneProjectFlow(sourceProjectId) {
  const source = (projectsCache || []).find(p => p.id === sourceProjectId);
  if (!source) return;
  const [towersSnap, unitsSnap] = await Promise.all([
    getDocs(collection(db, 'companies', session.companyId, 'projects', sourceProjectId, 'towers')),
    getDocs(collection(db, 'companies', session.companyId, 'projects', sourceProjectId, 'units'))
  ]);
  const sourceTowers = towersSnap.docs.map(d => ({ id: d.id, name: d.data().name }));
  const sourceUnits = unitsSnap.docs.map(d => d.data());
  const uniqueTypes = [...new Set(sourceUnits.map(u => u.unit_type).filter(Boolean))];

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-sm w-full max-h-[85vh] overflow-y-auto space-y-2 relative">
        <button id="cp-close-x" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-xl leading-none w-8 h-8 flex items-center justify-center">✕</button>
        <h3 class="font-bold text-sm pr-8">Clone "${escapeHtml(source.name)}"'s structure</h3>
        <p class="text-xs text-slate-500">Copies the tower/floor layout as a fresh template. Units start at "pending" — no snags, tasks, budget, or other data is copied. If the new project uses different tower names or unit types, rename them below before cloning.</p>
        <input id="cp-name" placeholder="New project name *" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
        <input id="cp-location" placeholder="Location" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
        ${sourceTowers.length ? `
        <div>
          <p class="eyebrow text-slate-500 mb-1">Tower names in new project</p>
          <div class="space-y-1">
            ${sourceTowers.map(t => `<div class="flex items-center gap-2 text-xs"><span class="text-slate-400 w-20 shrink-0 truncate">${escapeHtml(t.name)} →</span><input data-tower-rename="${escapeHtml(t.id)}" value="${escapeHtml(t.name)}" class="flex-1 border rounded-lg px-2 py-1"/></div>`).join('')}
          </div>
        </div>` : ''}
        ${uniqueTypes.length ? `
        <div>
          <p class="eyebrow text-slate-500 mb-1">Unit types in new project</p>
          <div class="space-y-1">
            ${uniqueTypes.map(t => `<div class="flex items-center gap-2 text-xs"><span class="text-slate-400 w-20 shrink-0 truncate">${escapeHtml(t)} →</span><input data-type-rename="${escapeHtml(t)}" value="${escapeHtml(t)}" class="flex-1 border rounded-lg px-2 py-1"/></div>`).join('')}
          </div>
        </div>` : ''}
        <label class="flex items-center gap-2 text-xs"><input id="cp-templates" type="checkbox" checked/> Also copy the Payment Plan stages and Material Norms</label>
        <div class="flex gap-2 pt-2">
          <button id="cp-go" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Clone</button>
          <button id="cp-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="cp-status" class="text-xs"></p>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#cp-close-x').addEventListener('click', () => wrap.remove());
  wrap.querySelector('#cp-cancel').addEventListener('click', () => wrap.remove());
  wrap.querySelector('#cp-go').addEventListener('click', async () => {
    const name = wrap.querySelector('#cp-name').value.trim();
    const status = wrap.querySelector('#cp-status');
    if (!name) { status.textContent = 'Give the new project a name.'; status.className = 'text-xs text-red-600'; return; }
    const btn = wrap.querySelector('#cp-go');
    btn.disabled = true; status.textContent = 'Cloning towers and units…'; status.className = 'text-xs text-slate-500';
    try {
      const towerNameMap = {};
      wrap.querySelectorAll('[data-tower-rename]').forEach(el => { towerNameMap[el.dataset.towerRename] = el.value.trim() || el.defaultValue; });
      const typeNameMap = {};
      wrap.querySelectorAll('[data-type-rename]').forEach(el => { typeNameMap[el.dataset.typeRename] = el.value.trim() || el.defaultValue; });

      const newProjectRef = await addDoc(collection(db, 'companies', session.companyId, 'projects'), {
        name, location: wrap.querySelector('#cp-location').value.trim(), created_at: serverTimestamp()
      });
      const base = ['companies', session.companyId, 'projects', newProjectRef.id];
      const writer = makeBatchWriter();
      const oldToNewTowerName = {};
      for (const t of sourceTowers) {
        const newTowerRef = doc(collection(db, ...base, 'towers'));
        const newName = towerNameMap[t.id] || t.name;
        oldToNewTowerName[t.name] = newName;
        await writer.set(newTowerRef, { name: newName });
        for (const u of sourceUnits.filter(u => u.tower_id === t.id)) {
          await writer.set(doc(collection(db, ...base, 'units')), {
            unit_number: u.unit_number, tower_id: newTowerRef.id,
            floor_name: u.floor_name || '', unit_type: u.unit_type ? (typeNameMap[u.unit_type] || u.unit_type) : '',
            status: 'pending', completion_pct: 0,
            created_at: serverTimestamp(), updated_by: session.email
          });
        }
      }
      if (wrap.querySelector('#cp-templates').checked) {
        for (const col of ['stages', 'norms']) {
          const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects', sourceProjectId, col)).catch(() => ({ docs: [] }));
          for (const dd of snap.docs) {
            const data = { ...dd.data(), created_at: serverTimestamp(), created_by: session.email };
            delete data.updated_at; delete data.updated_by;
            if (col === 'stages') { data.status = 'upcoming'; data.reached_date = ''; if (oldToNewTowerName[data.tower]) data.tower = oldToNewTowerName[data.tower]; }
            await writer.set(doc(collection(db, ...base, col)), data);
          }
        }
      }
      await writer.flush();
      status.textContent = 'Done ✓ New project created.'; status.className = 'text-xs text-emerald-600';
      setTimeout(() => wrap.remove(), 1200);
    } catch (err) {
      status.textContent = err.message; status.className = 'text-xs text-red-600';
      btn.disabled = false;
    }
  });
}

// ── BELL: alerts for the project chosen in the header — overdue tasks,
// high-severity snags, SLA risks, NOC/AMC/RERA dates, safety incidents, bills
// waiting on you, overdue demands and low stock. Tapping one opens it. ─
let bellCache = {};
let bellUnsubs = [];
function startBellWatchers() {
  bellUnsubs.forEach(u => u());
  bellUnsubs = [];
  bellCache = {};
  renderBellAlerts();
  const projectId = activeProjectId;
  if (!projectId || session.isSuperAdmin || !session.profile || !session.companyId) return;
  ['snags','tasks','sla','nocs','amc','safety','bills','rera','demands','stock','diary'].filter(canViewModule).forEach(m => {
    const colRef = collection(db, 'companies', session.companyId, 'projects', projectId, m);
    const unsub = onSnapshot(colRef, (snap) => {
      bellCache[m] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderBellAlerts();
    }, () => { bellCache[m] = []; });
    bellUnsubs.push(unsub);
  });
}

function computeBellAlerts() {
  const today = todayStr();
  const lead = session.expiryWarningDays ?? 30;
  const alerts = [];
  const push = (icon, text, sub, module) => alerts.push({ icon, text, sub, module });
  (bellCache.safety || []).filter(s => s.type === 'incident_report' && s.status === 'open')
    .forEach(s => push('🚨', `Open safety incident: ${s.title || ''}`, s.date || '', 'safety'));
  (bellCache.tasks || []).filter(t => t.status !== 'done' && t.due_date && t.due_date < today)
    .forEach(t => push('⏰', `Overdue task: ${t.title}`, `Due ${formatDateOnly(t.due_date)}`, 'tasks'));
  (bellCache.snags || []).filter(s => s.severity === 'high' && s.status !== 'resolved')
    .forEach(s => push('🔴', `High-severity snag: ${s.title}`, s.unit_number || '', 'snags'));
  (bellCache.snags || []).filter(s => s.status === 'fix_submitted')
    .forEach(s => push('🛠️', `Fix waiting to be verified: ${s.title}`, s.unit_number || '', 'snags'));
  (bellCache.sla || []).filter(s => s.status === 'at_risk' || s.status === 'breached')
    .forEach(s => push('⚠️', `SLA ${String(s.status).replace('_',' ')}: ${s.title}`, s.category || '', 'sla'));
  (bellCache.nocs || []).forEach(n => {
    const dleft = daysUntilDate(n.expiry_date);
    if (dleft !== null && dleft < 0) push('📄', `NOC expired: ${n.name}`, `Expired ${formatDateOnly(n.expiry_date)}`, 'nocs');
    else if (dleft !== null && dleft <= lead) push('📄', `NOC expiring in ${dleft} day(s): ${n.name}`, formatDateOnly(n.expiry_date), 'nocs');
    else if (n.status !== 'received') push('📄', `NOC pending: ${n.name}`, n.status || '', 'nocs');
  });
  (bellCache.amc || []).forEach(a => {
    const dleft = daysUntilDate(a.expiry_date);
    if (dleft !== null && dleft < 0) push('🔧', `AMC expired: ${a.name}`, `Expired ${formatDateOnly(a.expiry_date)}`, 'amc');
    else if (dleft !== null && dleft <= lead) push('🔧', `AMC expiring in ${dleft} day(s): ${a.name}`, formatDateOnly(a.expiry_date), 'amc');
    else if (dleft === null && (a.status === 'expiring' || a.status === 'expired')) push('🔧', `AMC ${a.status}: ${a.name}`, a.vendor || '', 'amc');
  });
  (bellCache.rera || []).filter(r => r.status !== 'filed' && r.due_date).forEach(r => {
    const dleft = daysUntilDate(r.due_date);
    if (dleft < 0) push('🏛️', `RERA item overdue: ${r.title}`, `Was due ${formatDateOnly(r.due_date)}`, 'rera');
    else if (dleft <= lead) push('🏛️', `RERA item due in ${dleft} day(s): ${r.title}`, formatDateOnly(r.due_date), 'rera');
  });
  const myBills = (bellCache.bills || []).filter(b => canActOnBill(b.status));
  if (myBills.length) push('🧾', `${myBills.length} vendor bill(s) waiting for your approval`, '', 'bills');
  (bellCache.demands || []).filter(dm => !['paid','cancelled'].includes(dm.status) && dm.due_date && dm.due_date < today)
    .forEach(dm => push('💰', `Demand overdue: ${dm.booking || ''}`, `${inrFmt(dm.amount)} · due ${formatDateOnly(dm.due_date)}`, 'demands'));
  if (bellCache.stock) {
    computeStockBalances(bellCache.stock, bellCache.diary || []).filter(r => r.min > 0 && r.balance <= r.min)
      .forEach(r => push('📦', `Low stock: ${r.name}`, `${r.balance} ${r.unit} left (alert level ${r.min})`, 'stock'));
  }
  return alerts;
}

// ── PORTFOLIO: every project on one screen — the owner's view. Read once
// when opened (with a Refresh button) rather than live, to keep reads low. ─
async function loadProjectMetrics(p) {
  const read = async (col, perm) => {
    if (!canViewModule(perm)) return null;
    try { return (await getDocs(collection(db, 'companies', session.companyId, 'projects', p.id, col))).docs.map(dd => ({ id: dd.id, ...dd.data() })); }
    catch { return null; }
  };
  const [units, tasks, snags, bills, payments, nocs, amc, rera, bookings, demands, collections] = await Promise.all([
    read('units', 'visual'), read('tasks', 'tasks'), read('snags', 'snags'), read('bills', 'bills'), read('payments', 'payments'),
    read('nocs', 'nocs'), read('amc', 'amc'), read('rera', 'rera'), read('bookings', 'bookings'), read('demands', 'demands'), read('collections', 'collections')
  ]);
  const today = todayStr();
  const lead = session.expiryWarningDays ?? 30;
  const m = { project: p };
  if (units) {
    m.units = units.length;
    m.handedOver = units.filter(u => unitStatus(u) === 'handed_over').length;
    m.delayed = units.filter(u => u.status === 'delayed').length;
    m.pct = units.length ? Math.round(m.handedOver / units.length * 100) : 0;
  }
  if (tasks) m.overdueTasks = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;
  if (snags) {
    m.openSnags = snags.filter(s => s.status !== 'resolved').length;
    m.highSnags = snags.filter(s => s.severity === 'high' && s.status !== 'resolved').length;
  }
  if (bills) {
    const led = computeBillLedger(bills, payments || []);
    m.outstanding = led.outstanding; m.inApproval = led.inApprovalCount;
  }
  const dateAlerts = (list, doneTest) => (list || []).filter(x => {
    if (doneTest && doneTest(x)) return false;
    const dl = daysUntilDate(x.expiry_date || x.due_date);
    return dl !== null && dl <= lead;
  }).length;
  if (nocs || amc || rera) {
    m.compliance = dateAlerts(nocs) + dateAlerts(amc) + dateAlerts(rera, r => r.status === 'filed')
      + (nocs || []).filter(n => n.status !== 'received' && !n.expiry_date).length;
  }
  if (bookings) {
    const sales = computeSalesLedger(bookings, demands || [], collections || []);
    m.sold = sales.sold; m.dues = sales.dues; m.overdueDues = sales.overdueAmt;
  }
  return m;
}

// ── Task timeline: start date (or the day the task was created, for older
// tasks) → due date. Shows how late each open task is, how late finished
// ones were, and which are waiting on another task. ──────────────────────
function taskStartDate(t) {
  return parseLocalDate(t.start_date) || (t.created_at?.toDate ? t.created_at.toDate() : null);
}
function renderGanttChart(tasks) {
  const host = document.getElementById('gantt-chart');
  if (!host) return;
  const withDates = tasks.filter(t => t.due_date && parseLocalDate(t.due_date) && taskStartDate(t))
    .sort((a, b) => taskStartDate(a) - taskStartDate(b));
  if (!withDates.length) { host.innerHTML = '<p class="text-slate-400 text-sm">No tasks with due dates yet.</p>'; return; }
  const DAY = 86400000;
  const span0 = (t) => {
    const s = taskStartDate(t).getTime();
    const e = Math.max(parseLocalDate(t.due_date).getTime() + DAY, s + DAY); // due date is inclusive
    return [s, e];
  };
  const rangeStart = Math.min(...withDates.map(t => span0(t)[0]));
  const rangeEnd = Math.max(...withDates.map(t => span0(t)[1]), Date.now());
  const span = Math.max(rangeEnd - rangeStart, DAY);
  const today = todayStr();
  const todayLeft = Math.min(100, Math.max(0, ((Date.now() - rangeStart) / span) * 100));

  const colorFor = (status, late) => status === 'done' ? 'bg-emerald-500' : late ? 'bg-red-500' : status === 'in_progress' ? 'bg-amber-500' : 'bg-slate-400';
  const shown = withDates.slice(0, 40);
  host.innerHTML = `<div class="min-w-[520px] space-y-2">` + shown.map(t => {
    const [s, e] = span0(t);
    const width = Math.min(100, Math.max(((e - s) / span) * 100, 3));
    const left = Math.min(Math.max(((s - rangeStart) / span) * 100, 0), 100 - width);
    const isDone = t.status === 'done';
    const lateDays = !isDone && t.due_date < today ? -daysUntilDate(t.due_date) : 0;
    let note = isDone ? 'Done' : t.status === 'in_progress' ? 'Active' : 'Planned';
    let tone = isDone ? 'text-emerald-600' : t.status === 'in_progress' ? 'text-amber-600' : 'text-slate-400';
    if (lateDays > 0) { note = `${lateDays}d late`; tone = 'text-red-600 font-semibold'; }
    else if (isDone && t.resolved_at?.toDate) {
      const finishedLate = Math.floor((t.resolved_at.toDate().getTime() - (parseLocalDate(t.due_date).getTime() + DAY)) / DAY) + 1;
      if (finishedLate > 0) { note = `Done ${finishedLate}d late`; tone = 'text-amber-600'; }
    }
    const dep = t.depends_on_id ? tasks.find(x => x.id === t.depends_on_id) : null;
    const blocked = dep && dep.status !== 'done' && !isDone;
    return `
      <div class="flex items-center gap-2">
        <div class="w-40 shrink-0"><p class="text-xs font-medium truncate">${escapeHtml(t.title||'')}</p><p class="text-[9px] text-slate-400 truncate">${formatDateOnly(localDateStr(new Date(s)))} → ${formatDateOnly(t.due_date)}${blocked ? ` · ⛓ waits on ${escapeHtml(dep.title || '')}` : ''}</p></div>
        <div class="flex-1 h-6 bg-slate-100 rounded-lg relative overflow-hidden">
          <div class="absolute top-0.5 bottom-0.5 rounded-md ${colorFor(t.status, lateDays > 0)}" style="left:${left}%;width:${width}%"></div>
          <div class="absolute top-0 bottom-0 w-px bg-blue-600" style="left:${todayLeft}%" title="Today"></div>
        </div>
        <span class="text-[10px] w-20 text-right ${tone}">${note}</span>
      </div>`;
  }).join('') + (withDates.length > shown.length ? `<p class="text-[11px] text-slate-400">Showing the first ${shown.length} of ${withDates.length} dated tasks.</p>` : '') + `<p class="text-[10px] text-slate-400">Blue line = today.</p></div>`;
}

// ── Priority Actions: reads the same real-time data already on the
// Dashboard and surfaces what actually needs attention, ordered by real
// urgency — rules over your live data. Handover Pack items are deliberately
// withheld until the project is far enough along (company-configurable in
// Settings) since flagging handover paperwork on a half-built site is noise.
function computePriorityRows(canView) {
  const units = dashboardCache.visual || [];
  const snags = dashboardCache.snags || [];
  const tasks = dashboardCache.tasks || [];
  const nocs = dashboardCache.nocs || [];
  const amc = dashboardCache.amc || [];
  const rera = dashboardCache.rera || [];
  const sla = dashboardCache.sla || [];
  const society = dashboardCache.society || [];
  const possession = (dashboardCache.possession || []).filter(p => p.tower);
  const safety = dashboardCache.safety || [];
  const today = todayStr();
  const overallPct = units.length ? Math.round((units.filter(u => unitStatus(u) === 'handed_over').length / units.length) * 100) : 0;
  const threshold = session.handoverThresholdPct ?? 50;
  const leadDays = session.expiryWarningDays ?? 30;
  const soon = (dateStr) => { const dl = daysUntilDate(dateStr); return dl !== null && dl >= 0 && dl <= leadDays; };
  const past = (dateStr) => { const dl = daysUntilDate(dateStr); return dl !== null && dl < 0; };

  const rows = [];
  const add = (key, text, module) => rows.push({ key, text, module });
  if (canView('safety')) {
    const n = safety.filter(s => s.type === 'incident_report' && s.status === 'open').length;
    if (n) add('safety-incidents', `${n} open incident report(s) — safety, resolve first.`, 'safety');
  }
  if (canView('snags')) {
    const n = snags.filter(s => s.severity === 'high' && s.status !== 'resolved').length;
    if (n) add('high-severity-snags', `${n} high-severity snag(s) still open.`, 'snags');
    const awaitingReview = snags.filter(s => s.status === 'fix_submitted').length;
    if (awaitingReview) add('snags-awaiting-review', `${awaitingReview} snag fix(es) submitted — waiting for someone to verify or reject.`, 'snags');
    const overdue = snags.filter(s => s.status !== 'resolved' && s.due_date && s.due_date < today).length;
    if (overdue) add('snags-overdue', `${overdue} snag(s) past their due date.`, 'snags');
  }
  if (canView('tasks')) {
    const n = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;
    if (n) add('overdue-tasks', `${n} task(s) overdue.`, 'tasks');
  }
  if (canView('sla')) {
    const n = sla.filter(s => s.status === 'at_risk' || s.status === 'breached').length;
    if (n) add('sla-risk', `${n} SLA item(s) at risk or breached.`, 'sla');
  }
  // Proactive expiry: looks at actual expiry DATES rather than waiting for
  // someone to manually flip a status to "expiring".
  if (canView('nocs')) {
    const n = nocs.filter(nc => nc.status !== 'received').length;
    if (n) add('noc-pending', `${n} NOC(s) pending — required for OC.`, 'nocs');
    const expiringSoon = nocs.filter(nc => soon(nc.expiry_date)).length;
    const alreadyExpired = nocs.filter(nc => past(nc.expiry_date)).length;
    if (expiringSoon) add('noc-expiring-soon', `${expiringSoon} NOC(s) expiring within ${leadDays} days — renew now.`, 'nocs');
    if (alreadyExpired) add('noc-expired', `${alreadyExpired} NOC(s) already past expiry date.`, 'nocs');
  }
  if (canView('amc')) {
    // An AMC with an expiry date is judged by the date; the manual status is
    // only used when no date was entered — so each AMC is counted once.
    const expiringSoon = amc.filter(a => soon(a.expiry_date)).length;
    const alreadyExpired = amc.filter(a => past(a.expiry_date)).length;
    const byStatus = amc.filter(a => !a.expiry_date && (a.status === 'expiring' || a.status === 'expired')).length;
    if (expiringSoon) add('amc-expiring-soon', `${expiringSoon} AMC(s) expiring within ${leadDays} days — renew now.`, 'amc');
    if (alreadyExpired) add('amc-expired-date', `${alreadyExpired} AMC(s) already past expiry date.`, 'amc');
    if (byStatus) add('amc-expiring', `${byStatus} AMC(s) marked expiring or expired.`, 'amc');
  }
  if (canView('rera')) {
    const open = rera.filter(r => r.status !== 'filed' && r.due_date);
    const overdue = open.filter(r => past(r.due_date)).length;
    const dueSoon = open.filter(r => soon(r.due_date)).length;
    if (overdue) add('rera-overdue', `${overdue} RERA filing(s) overdue.`, 'rera');
    if (dueSoon) add('rera-due-soon', `${dueSoon} RERA filing(s) due within ${leadDays} days.`, 'rera');
    const regLeft = daysUntilDate(dashboardProject?.rera_valid_until);
    if (regLeft !== null && regLeft < 0) add('rera-reg-expired', `RERA registration expired on ${formatDateOnly(dashboardProject.rera_valid_until)}.`, 'rera');
    else if (regLeft !== null && regLeft <= Math.max(leadDays, 90)) add('rera-reg-expiring', `RERA registration expires in ${regLeft} day(s) — apply for extension if needed.`, 'rera');
  }
  if (canView('bills')) {
    const mine = (dashboardCache.bills || []).filter(b => canActOnBill(b.status)).length;
    if (mine) add('bills-my-approval', `${mine} vendor bill(s) waiting for your approval.`, 'bills');
    const led = computeBillLedger(dashboardCache.bills || [], dashboardCache.payments || []);
    if (led.dueSoon.length) add('bills-due', `${led.dueSoon.length} approved bill(s) due for payment within 7 days — ${inrFmt(led.dueSoon.reduce((t, r) => t + r.balance, 0))}.`, 'bills');
  }
  if (canView('demands')) {
    const od = (dashboardCache.demands || []).filter(dm => !['paid','cancelled'].includes(dm.status) && dm.due_date && dm.due_date < today);
    if (od.length) add('demands-overdue', `${od.length} buyer demand(s) overdue.`, 'demands');
  }
  if (canView('visual')) {
    const n = units.filter(u => u.status === 'delayed').length;
    if (n) add('delayed-units', `${n} delayed unit(s) in Site Progress.`, 'visual');
    const tl = daysUntilDate(dashboardProject?.target_date);
    if (tl !== null && tl < 0 && units.length && overallPct < 100) add('target-missed', `Target completion date passed ${Math.abs(tl)} day(s) ago — project is ${overallPct}% handed over.`, 'visual');
  }
  if (canView('stock')) {
    const low = computeStockBalances(dashboardCache.stock || [], dashboardCache.diary || []).filter(r => r.min > 0 && r.balance <= r.min).length;
    if (low) add('stock-low', `${low} material(s) at or below the low-stock level.`, 'stock');
  }
  if (canView('possession')) {
    const n = possession.filter(p => p.status !== 'completed').length;
    if (n) add('possession-pending', `${n} Possession Checklist item(s) pending.`, 'possession');
  }
  if (canView('society') && overallPct >= threshold) {
    const n = society.filter(s => s.status !== 'completed').length;
    if (n) add('handover-open', `${n} Handover Pack item(s) still open — project is ${overallPct}% complete.`, 'society');
  }
  if (canView('budget')) {
    const b = computeBudgetRows(dashboardCache.budget || [], dashboardCache.bills || [], dashboardCache.orders || []).totals;
    if (b.budgeted && b.actual > b.budgeted) add('budget-overrun', `Budget over by ${Math.round((b.actual / b.budgeted - 1) * 100)}%.`, 'budget');
    else if (b.budgeted && b.committed > b.budgeted) add('budget-committed', `Orders committed exceed the budget by ${inrFmt(b.committed - b.budgeted)}.`, 'budget');
  }
  return rows;
}

// ── Full Project Report: compiles the same live data already on the
// Dashboard into a single printable document — a client meeting/board
// update, distinct from the raw CSV/JSON exports. ──────────────────────
function generateProjectReport() {
  const canView = canViewModule;
  const p = dashboardProject || {};
  const units = dashboardCache.visual || [];
  const snags = dashboardCache.snags || [];
  const tasks = dashboardCache.tasks || [];
  const nocs = dashboardCache.nocs || [];
  const amc = dashboardCache.amc || [];
  const society = dashboardCache.society || [];
  const possession = (dashboardCache.possession || []).filter(x => x.tower);
  const sla = dashboardCache.sla || [];
  const safety = dashboardCache.safety || [];
  const today = todayStr();

  const total = units.length;
  const handedOver = units.filter(u => unitStatus(u) === 'handed_over').length;
  const kpiRows = [];
  const row = (k, v) => kpiRows.push([k, v]);
  if (p.target_date) { const tl = daysUntilDate(p.target_date); row('Target completion', `${formatDateOnly(p.target_date)} (${tl >= 0 ? tl + ' days left' : Math.abs(tl) + ' days over'})`); }
  if (p.rera_no) row('RERA registration', `${p.rera_no}${p.rera_valid_until ? ' · valid until ' + formatDateOnly(p.rera_valid_until) : ''}`);
  if (canView('visual')) {
    row('Total Units', total);
    row('Handed Over', `${handedOver}/${total} (${total ? Math.round(handedOver / total * 100) : 0}%)`);
    STATUS_LEGEND.filter(s => s.key !== 'handed_over').forEach(s => {
      const n = units.filter(u => unitStatus(u) === s.key).length;
      if (n) row(`Units — ${s.label}`, n);
    });
  }
  if (canView('snags')) row('Open Snags', `${snags.filter(s => s.status !== 'resolved').length} (${snags.filter(s => s.severity === 'high' && s.status !== 'resolved').length} high severity)`);
  if (canView('tasks')) row('Overdue Tasks', tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length);
  if (canView('budget')) {
    const b = computeBudgetRows(dashboardCache.budget || [], dashboardCache.bills || [], dashboardCache.orders || []).totals;
    row('Budget', b.budgeted ? `${Math.round(b.actual / b.budgeted * 100)}% used — ${inrFmt(b.actual)} of ${inrFmt(b.budgeted)} (committed ${inrFmt(b.committed)})` : 'No budget set');
  }
  if (canView('bills')) {
    const led = computeBillLedger(dashboardCache.bills || [], dashboardCache.payments || []);
    row('Vendor bills', `${inrFmt(led.billed)} approved · ${inrFmt(led.paid)} paid · ${inrFmt(led.outstanding)} outstanding · ${led.inApprovalCount} in approval`);
  }
  if (canView('bookings')) {
    const s = computeSalesLedger(dashboardCache.bookings || [], dashboardCache.demands || [], dashboardCache.collections || []);
    row('Sales', `${s.sold} unit(s) sold · agreement value ${inrFmt(s.agreementValue)}`);
    row('Collections', `${inrFmt(s.demanded)} demanded · ${inrFmt(s.collected)} collected · ${inrFmt(s.dues)} due`);
  }
  if (canView('nocs')) row('NOC', `${nocs.filter(n => n.status === 'received').length}/${nocs.length} received`);
  if (canView('amc')) row('AMC', `${amc.filter(a => a.status === 'active').length}/${amc.length} active`);
  if (canView('sla')) row('SLA at risk/breached', sla.filter(s => s.status === 'at_risk' || s.status === 'breached').length);
  if (canView('safety')) row('Open Safety Incidents', safety.filter(s => s.type === 'incident_report' && s.status === 'open').length);
  if (canView('society')) row('Handover Pack', `${society.filter(s => s.status === 'completed').length}/${society.length} complete`);
  if (canView('possession')) row('Possession Checklist', `${possession.filter(x => x.status === 'completed').length}/${possession.length} complete`);

  const priorityRows = computePriorityRows(canView).map(r => r.text);
  const html = `
    <h1 style="margin-bottom:2px">${escapeHtml(session.companyName || 'ProjectTracker')} — Project Report</h1>
    <p style="color:#555;margin-top:0">Project: <b>${escapeHtml(p.name || '')}</b>${p.location ? ' · ' + escapeHtml(p.location) : ''} · ${formatDateTime(new Date())} · ${escapeHtml(session.email||'')}</p>

    <h2 style="margin-top:24px">Key Metrics</h2>
    <table style="border-collapse:collapse;width:100%;font-size:13px">
      ${kpiRows.map(([k,v]) => `<tr><td style="border:1px solid #ddd;padding:6px 10px;font-weight:600;width:40%">${escapeHtml(k)}</td><td style="border:1px solid #ddd;padding:6px 10px">${escapeHtml(String(v))}</td></tr>`).join('')}
    </table>

    ${priorityRows.length ? `<h2 style="margin-top:24px">Priority Actions</h2><ol style="font-size:13px;line-height:1.8">${priorityRows.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ol>` : ''}

    <p style="margin-top:32px;color:#999;font-size:11px">Generated automatically from live project data.</p>`;
  openPrintWindow(`${p.name || 'Project'} — Report`, html);
}

function renderPriorityActions(canView) {
  const host = document.getElementById('priority-actions');
  if (!host) return;
  const rows = computePriorityRows(canView);
  const snoozeKey = (key) => `snooze_${session.companyId}_${dashboardProjectId}_${key}`;
  const visibleRows = rows.filter(r => {
    let until = null;
    try { until = localStorage.getItem(snoozeKey(r.key)); } catch {}
    return !(until && Number(until) > Date.now());
  });

  if (!visibleRows.length) { host.innerHTML = ''; return; }
  host.innerHTML = `
    <div class="glass rounded-2xl p-4 border border-slate-200">
      <h3 class="font-semibold text-sm mb-3">Priority Actions — What Needs Attention</h3>
      <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
        ${visibleRows.map((r,i) => `
          <div class="flex items-start gap-2 text-sm">
            <span class="w-5 h-5 rounded-full bg-blue-600 text-white text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">${i+1}</span>
            <p class="flex-1">${escapeHtml(r.text)} <button data-nav-module="${escapeHtml(r.module)}" class="text-blue-600 font-medium">Go →</button></p>
            <button data-snooze-key="${escapeHtml(r.key)}" class="text-[10px] px-2 py-1 rounded-lg border text-slate-400 shrink-0" title="Hide for 3 days">⏰ Snooze</button>
          </div>`).join('')}
      </div>
    </div>`;
  host.querySelectorAll('[data-nav-module]').forEach(el => el.addEventListener('click', () => renderView(el.dataset.navModule)));
  host.querySelectorAll('[data-snooze-key]').forEach(el => el.addEventListener('click', () => {
    try { localStorage.setItem(snoozeKey(el.dataset.snoozeKey), String(Date.now() + 3*86400000)); } catch {}
    renderPriorityActions(canView);
  }));
}

function renderDashboardAggregates(canView) {
  const updatedEl = document.getElementById('dash-updated-at');
  if (updatedEl) updatedEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Live · updated ${formatDateTime(new Date())}`;

  renderPriorityActions(canView);

  const units = dashboardCache.visual || [];
  const snags = dashboardCache.snags || [];
  const tasks = dashboardCache.tasks || [];
  const nocs = dashboardCache.nocs || [];
  const assets = dashboardCache.assets || [];
  const amenities = dashboardCache.amenities || [];
  const sla = dashboardCache.sla || [];
  const society = dashboardCache.society || [];

  // "Handover Progress" = handed-over units ÷ total units.
  const handoverPct = units.length ? Math.round((units.filter(u => unitStatus(u) === 'handed_over').length / units.length) * 100) : null;
  if (canView('visual')) { renderKPIs(units, handoverPct); renderStatusBreakdown(units); renderPipelineRow(units); }

  const today = todayStr();
  const cards2 = [];

  if (canView('snags')) {
    const open = snags.filter(s => s.status !== 'resolved').length;
    const high = snags.filter(s => s.severity === 'high' && s.status !== 'resolved').length;
    cards2.push({ label:'Open Snags', value: open, sub: high ? `${high} high severity` : '', tone: open ? 'text-amber-600' : '', blink: high > 0, module:'snags' });
  }
  if (canView('tasks')) {
    const overdue = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;
    const pending = tasks.filter(t => t.status !== 'done').length;
    cards2.push({ label:'Overdue Tasks', value: overdue, sub: `${pending} pending total`, tone: overdue ? 'text-red-600' : '', blink: overdue > 0, module:'tasks' });
    renderGanttChart(tasks);
  }
  if (canView('budget')) {
    const b = computeBudgetRows(dashboardCache.budget || [], dashboardCache.bills || [], dashboardCache.orders || []).totals;
    const pct = b.budgeted ? Math.round((b.actual / b.budgeted) * 100) : 0;
    cards2.push({ label:'Budget Used', value: pct + '%', sub: b.budgeted ? `${inrFmt(b.actual)} of ${inrFmt(b.budgeted)} · ${inrFmt(b.toComplete)} to complete` : 'No budget entries yet', tone: pct > 100 ? 'text-red-600' : 'text-blue-600', module:'budget' });
  }
  if (canView('nocs')) {
    const pending = nocs.filter(n => n.status !== 'received').length;
    cards2.push({ label:'NOC', value: `${nocs.length - pending}/${nocs.length}`, sub: `${pending} pending`, tone: 'text-purple-600', blink: pending > 0, module:'nocs' });
  }
  if (canView('amc')) {
    const amc = dashboardCache.amc || [];
    const risk = amc.filter(a => { const dl = daysUntilDate(a.expiry_date); return dl !== null ? dl <= (session.expiryWarningDays ?? 30) : (a.status === 'expiring' || a.status === 'expired'); }).length;
    cards2.push({ label:'AMC', value: `${amc.length - risk}/${amc.length}`, sub: risk ? `${risk} expiring/expired` : 'All current', tone: 'text-orange-600', blink: risk > 0, module:'amc' });
  }
  if (canView('assets')) {
    const ok = assets.filter(a => a.status === 'completed').length;
    cards2.push({ label:'Assets', value: `${ok}/${assets.length}`, sub: 'operational', tone: 'text-cyan-600', module:'assets' });
  }
  if (canView('amenities')) {
    const done = amenities.filter(a => a.status === 'completed').length;
    cards2.push({ label:'Amenities', value: `${done}/${amenities.length}`, sub: 'completed', tone: 'text-teal-600', module:'amenities' });
  }
  if (canView('sla')) {
    const risks = sla.filter(s => s.status === 'at_risk' || s.status === 'breached').length;
    cards2.push({ label:'SLA risks', value: risks, sub: 'At risk + breached', tone: 'text-red-600', blink: risks > 0, module:'sla' });
  }
  if (canView('society')) {
    const done = society.filter(s => s.status === 'completed').length;
    const pct = society.length ? Math.round((done / society.length) * 100) : null;
    cards2.push({ label:'Handover Pack', value: society.length ? `${done}/${society.length}` : '—', sub: pct != null ? `${pct}% complete` : 'No checklist items yet', tone: 'text-indigo-600', module:'society' });
  }
  if (canView('possession')) {
    const possession = (dashboardCache.possession || []).filter(p => p.tower); // exclude orphaned pre-redesign records
    const done = possession.filter(p => p.status === 'completed').length;
    const pct = possession.length ? Math.round((done / possession.length) * 100) : null;
    cards2.push({ label:'Possession Checklist', value: possession.length ? `${done}/${possession.length}` : '—', sub: pct != null ? `${pct}% complete` : 'No checklist items yet', tone: 'text-cyan-600', module:'possession' });
    renderPossessionByTower(possession);
  }

  if (canView('bills') || canView('payments')) {
    const bills = dashboardCache.bills || [], pays = dashboardCache.payments || [];
