// Wires "+Add new…" behavior for any select-addable fields in a form,
// and shows/hides conditional fields (Safety type-dependent fields).
function wireDynamicFieldBehavior(cfg, prefix, projectId) {
  cfg.fields.filter(f => f.type === 'select-addable').forEach(f => {
    const el = document.getElementById(`${prefix}-${f.key}`);
    if (!el) return;
    el.addEventListener('change', async () => {
      if (el.value !== '__add_new__') return;
      const newVal = prompt(`New ${f.label}:`);
      if (!newVal) { el.value = f.options[0] || ''; return; }
      await addCustomCategory(cfg.id, f.key, newVal);
      const opt = document.createElement('option');
      opt.value = newVal; opt.textContent = newVal;
      el.insertBefore(opt, el.lastElementChild);
      el.value = newVal;
    });
  });
  if (cfg.conditionalOn) {
    const typeEl = document.getElementById(`${prefix}-${cfg.conditionalOn}`);
    if (!typeEl) return;
    const applyVisibility = () => {
      cfg.fields.forEach(f => {
        const wrap = document.querySelector(`[data-field-wrap="${f.key}"]`);
        // only toggle wraps that belong to THIS form instance (share prefix scope via closest form/modal)
        if (!wrap) return;
        const belongsHere = wrap.querySelector(`#${prefix}-${f.key}`);
        if (!belongsHere) return;
        wrap.style.display = fieldVisible(f, typeEl.value) ? '' : 'none';
      });
    };
    typeEl.addEventListener('change', applyVisibility);
    applyVisibility();
  }

  // Annotate button: appears when an image is selected for a file/multifile field.
  cfg.fields.filter(f => f.type === 'file' || f.type === 'multifile').forEach(f => {
    const id = `${prefix}-${f.key}`;
    const fileInput = document.getElementById(`${id}-file`);
    const cameraInput = document.getElementById(`${id}-camera`);
    const annotateBtn = document.getElementById(`${id}-annotate-btn`);
    if (!annotateBtn) return;
    const onPick = () => {
      const file = getChosenFile(id);
      delete annotatedBlobs[id];
      const statusEl = document.getElementById(`${id}-annotate-status`);
      if (statusEl) statusEl.classList.add('hidden');
      annotateBtn.classList.toggle('hidden', !(file && file.type.startsWith('image/')));
    };
    if (fileInput) fileInput.addEventListener('change', onPick);
    if (cameraInput) cameraInput.addEventListener('change', onPick);
    annotateBtn.addEventListener('click', async () => {
      const file = getChosenFile(id);
      if (!file) return;
      const blob = await openImageAnnotator(file);
      annotatedBlobs[id] = blob;
      const statusEl = document.getElementById(`${id}-annotate-status`);
      if (statusEl) statusEl.classList.remove('hidden');
    });
  });

  // Multifile: render current list with Remove buttons, wire "Add to list".
  cfg.fields.filter(f => f.type === 'multifile').forEach(f => {
    const id = `${prefix}-${f.key}`;
    const listEl = document.getElementById(`${id}-list`);
    if (!listEl) return;
    if (!multiFileState[id]) {
      try { multiFileState[id] = JSON.parse(listEl.dataset.initial || '[]'); } catch { multiFileState[id] = []; }
    }
    function paintList() {
      const urls = multiFileState[id].map(x => x.url);
      listEl.innerHTML = multiFileState[id].map((item, i) => `
        <div class="border rounded-lg p-2 flex items-start gap-2">
          <div class="flex-1 min-w-0">${filePreviewHTML(item.url, urls, i)}${item.name ? `<p class="text-xs mt-1">${escapeHtml(item.name)}</p>` : ''}</div>
          <button type="button" data-remove-idx="${i}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600 shrink-0">Remove</button>
        </div>`).join('') || `<p class="text-xs text-slate-400">No attachments yet.</p>`;
      listEl.querySelectorAll('[data-remove-idx]').forEach(b => b.addEventListener('click', () => {
        multiFileState[id].splice(Number(b.dataset.removeIdx), 1);
        paintList();
      }));
      wireLightboxThumbnails(listEl);
    }
    paintList();

    const addBtn = document.getElementById(`${id}-add-btn`);
    if (!addBtn) return;
    addBtn.addEventListener('click', async () => {
      const urlEl = document.getElementById(`${id}-url`);
      const fileEl = document.getElementById(`${id}-file`);
      const cameraEl = document.getElementById(`${id}-camera`);
      const statusEl = document.getElementById(`${id}-add-status`);
      const chosenFile = getChosenFile(id);
      addBtn.disabled = true; statusEl.textContent = 'Adding…'; statusEl.className = 'text-[11px] mt-1 text-slate-500';
      try {
        let url = '';
        if (annotatedBlobs[id]) {
          url = await uploadFileOrBlob(annotatedBlobs[id], cfg.id, 'annotated.jpg', projectId);
        } else if (chosenFile) {
          url = await uploadFileOrBlob(chosenFile, cfg.id, chosenFile.name, projectId);
        } else if (urlEl.value.trim()) {
          url = urlEl.value.trim();
        } else {
          statusEl.textContent = 'Paste a link or choose a file first.'; statusEl.className = 'text-[11px] mt-1 text-red-600';
          addBtn.disabled = false; return;
        }
        multiFileState[id].push({ url, name: (chosenFile?.name || '') });
        paintList();
        urlEl.value = ''; if (fileEl) fileEl.value = ''; if (cameraEl) cameraEl.value = '';
        delete annotatedBlobs[id];
        document.getElementById(`${id}-annotate-btn`)?.classList.add('hidden');
        document.getElementById(`${id}-annotate-status`)?.classList.add('hidden');
        statusEl.textContent = 'Added ✓'; statusEl.className = 'text-[11px] mt-1 text-emerald-600';
      } catch (err) {
        statusEl.textContent = err.message; statusEl.className = 'text-[11px] mt-1 text-red-600';
      } finally {
        addBtn.disabled = false;
      }
    });
  });
}

// Shared upload helper: compresses images automatically, sets correct
// contentType so images/videos preview inline instead of force-downloading.
async function uploadFileOrBlob(fileOrBlob, moduleId, name, projectId) {
  let toUpload = fileOrBlob;
  let contentType = fileOrBlob.type || 'application/octet-stream';
  let finalName = name;
  if (contentType.startsWith('image/') && contentType !== 'image/jpeg') {
    toUpload = await compressImage(fileOrBlob);
    contentType = 'image/jpeg';
  } else if (contentType === 'image/jpeg' && fileOrBlob.size > 900000) {
    toUpload = await compressImage(fileOrBlob); // already jpeg but large — still shrink it
  }
  // Photos are always re-encoded as JPEG above, but the original filename
  // (from a phone) is often .HEIC, .PNG, or uppercase .JPG — if the stored
  // filename doesn't end in a lowercase image extension we recognize, the
  // app can't tell it's a photo later and shows a generic file icon instead
  // of the actual picture. Force the extension to match the real content.
  if (contentType === 'image/jpeg') {
    finalName = name.replace(/\.[^.]+$/, '') + '.jpg';
  }
  const fileRef = ref(storage, `companies/${session.companyId}/projects/${projectId}/${moduleId}/${Date.now()}-${finalName}`);
  await uploadBytes(fileRef, toUpload, { contentType });
  return getDownloadURL(fileRef);
}

// ── Image compression: resize + re-encode as JPEG before upload. Runs on
// every photo uploaded anywhere in the app (single-file and multi-file). ─
function compressImage(fileOrBlob, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(fileOrBlob);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob); }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Image annotation editor: pen, arrow, rectangle, circle, text — each
// with a color picker — drawn on a canvas over the photo before upload.
// Resolves with the flattened image as a Blob (already compressed size). ─
function openImageAnnotator(fileOrBlob) {
  return new Promise((resolve) => {
    const modalHost = document.createElement('div');
    document.body.appendChild(modalHost);
    const img = new Image();
    const objUrl = URL.createObjectURL(fileOrBlob);

    img.onload = () => {
      const maxW = Math.min(window.innerWidth - 40, 640);
      const scale = Math.min(1, maxW / img.width);
      const cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);

      modalHost.innerHTML = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3">
          <div class="bg-white rounded-2xl p-3 max-w-full space-y-2">
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              <button data-tool="pen" class="ann-tool px-2 py-1 rounded-lg border bg-slate-100">✏️ Pen</button>
              <button data-tool="arrow" class="ann-tool px-2 py-1 rounded-lg border">↗️ Arrow</button>
              <button data-tool="rect" class="ann-tool px-2 py-1 rounded-lg border">▭ Rectangle</button>
              <button data-tool="circle" class="ann-tool px-2 py-1 rounded-lg border">◯ Circle</button>
              <button data-tool="text" class="ann-tool px-2 py-1 rounded-lg border">🅰️ Text</button>
              <span class="w-px h-5 bg-slate-200 mx-1"></span>
              ${['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#000000','#ffffff'].map(c => `<button data-color="${c}" class="ann-color w-5 h-5 rounded-full border-2 ${c==='#ef4444'?'border-slate-800':'border-slate-200'}" style="background:${c}"></button>`).join('')}
              <span class="w-px h-5 bg-slate-200 mx-1"></span>
              <button id="ann-undo" class="px-2 py-1 rounded-lg border">↶ Undo</button>
              <button id="ann-clear" class="px-2 py-1 rounded-lg border">Clear</button>
            </div>
            <canvas id="ann-canvas" width="${cw}" height="${ch}" class="border rounded-lg touch-none max-w-full"></canvas>
            <div class="flex gap-2">
              <button id="ann-use" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Use This Photo</button>
              <button id="ann-skip" class="flex-1 py-2 rounded-xl border text-sm">Skip Annotation</button>
            </div>
          </div>
        </div>`;

      const canvas = modalHost.querySelector('#ann-canvas');
      const ctx = canvas.getContext('2d');
      let tool = 'pen', color = '#ef4444';
      const shapes = []; // committed shapes, for undo + redraw
      let current = null;

      function redraw() {
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        [...shapes, current].filter(Boolean).forEach(drawShape);
      }
      function drawShape(s) {
        ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
        if (s.type === 'pen') {
          ctx.beginPath();
          s.points.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
          ctx.stroke();
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x1, s.y1, s.x2-s.x1, s.y2-s.y1);
        } else if (s.type === 'circle') {
          const rx = Math.abs(s.x2-s.x1)/2, ry = Math.abs(s.y2-s.y1)/2;
          const cx = (s.x1+s.x2)/2, cy = (s.y1+s.y2)/2;
          ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2*Math.PI); ctx.stroke();
        } else if (s.type === 'arrow') {
          const angle = Math.atan2(s.y2-s.y1, s.x2-s.x1);
          ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
          const headLen = 12;
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - headLen*Math.cos(angle-Math.PI/6), s.y2 - headLen*Math.sin(angle-Math.PI/6));
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - headLen*Math.cos(angle+Math.PI/6), s.y2 - headLen*Math.sin(angle+Math.PI/6));
          ctx.stroke();
        } else if (s.type === 'text') {
          ctx.font = '20px Inter, sans-serif';
          ctx.textBaseline = 'top';
          const maxWidth = Math.max(cw - s.x1 - 10, 80);
          const words = s.text.split(' ');
          const lines = [];
          let line = '';
          words.forEach(word => {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
            else line = test;
          });
          if (line) lines.push(line);
          lines.forEach((ln, i) => {
            const ly = s.y1 + i * 24;
            ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.strokeText(ln, s.x1, ly); // white outline so text reads on any background
            ctx.fillStyle = s.color; ctx.fillText(ln, s.x1, ly);
          });
        }
      }
      redraw();

      modalHost.querySelectorAll('.ann-tool').forEach(b => b.addEventListener('click', () => {
        tool = b.dataset.tool;
        modalHost.querySelectorAll('.ann-tool').forEach(x => x.classList.remove('bg-slate-100'));
        b.classList.add('bg-slate-100');
      }));
      modalHost.querySelectorAll('.ann-color').forEach(b => b.addEventListener('click', () => {
        color = b.dataset.color;
        modalHost.querySelectorAll('.ann-color').forEach(x => x.classList.remove('border-slate-800'));
        b.classList.add('border-slate-800');
      }));
      modalHost.querySelector('#ann-undo').addEventListener('click', () => { shapes.pop(); redraw(); });
      modalHost.querySelector('#ann-clear').addEventListener('click', () => { shapes.length = 0; redraw(); });

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return [cx * (canvas.width/rect.width), cy * (canvas.height/rect.height)];
      }
      let drawing = false;
      canvas.addEventListener('pointerdown', (e) => {
        const [x,y] = getPos(e);
        if (tool === 'text') {
          const text = prompt('Text to add:');
          if (text) { shapes.push({ type:'text', x1:x, y1:y, text, color }); redraw(); }
          return;
        }
        drawing = true;
        if (tool === 'pen') current = { type:'pen', points:[[x,y]], color };
        else current = { type: tool, x1:x, y1:y, x2:x, y2:y, color };
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!drawing || !current) return;
        const [x,y] = getPos(e);
        if (tool === 'pen') current.points.push([x,y]);
        else { current.x2 = x; current.y2 = y; }
        redraw();
      });
      const finishStroke = () => { if (current) { shapes.push(current); current = null; } drawing = false; redraw(); };
      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointerleave', finishStroke);

      modalHost.querySelector('#ann-skip').addEventListener('click', () => {
        URL.revokeObjectURL(objUrl); modalHost.remove(); resolve(fileOrBlob);
      });
      modalHost.querySelector('#ann-use').addEventListener('click', () => {
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(objUrl); modalHost.remove(); resolve(blob);
        }, 'image/jpeg', 0.88);
      });
    };
    img.src = objUrl;
  });
}

async function readGenericFields(cfg, prefix, projectId, existingItem = {}) {
  const data = {};
  let missingRequired = false;
  for (const f of cfg.fields) {
    if (f.showFor && cfg.conditionalOn) {
      const typeEl = document.getElementById(`${prefix}-${cfg.conditionalOn}`);
      if (typeEl && !fieldVisible(f, typeEl.value)) { data[f.key] = ''; continue; }
    }
    if (f.type === 'file') {
      const id = `${prefix}-${f.key}`;
      const urlEl = document.getElementById(`${id}-url`);
      const chosenFile = getChosenFile(id);
      if (annotatedBlobs[id]) {
        data[f.key] = await uploadFileOrBlob(annotatedBlobs[id], cfg.id, 'annotated.jpg', projectId);
        delete annotatedBlobs[id];
      } else if (chosenFile) {
        data[f.key] = await uploadFileOrBlob(chosenFile, cfg.id, chosenFile.name, projectId);
      } else if (urlEl && urlEl.value.trim()) {
        data[f.key] = urlEl.value.trim();
      } else {
        data[f.key] = existingItem[f.key] || ''; // nothing new provided — keep what was already there
      }
      continue;
    }
    if (f.type === 'multifile') {
      const id = `${prefix}-${f.key}`;
      data[f.key] = multiFileState[id] || existingItem[f.key] || [];
      continue;
    }
    const el = document.getElementById(`${prefix}-${f.key}`);
    const val = el ? el.value.trim() : '';
    if (f.required && !val) missingRequired = true;
    data[f.key] = f.type === 'number' ? (val ? Number(val) : 0) : val;
  }
  return { data, missingRequired };
}

function semanticPillColor(value) {
  const v = String(value||'').toLowerCase();
  const red = ['open','pending','expired','delayed','breached','poor'];
  const amber = ['in_progress','in-progress','expiring','fair','applied','planned','issued','at_risk'];
  const green = ['resolved','completed','done','received','active','good','new','on_track','returned','closed'];
  if (red.includes(v)) return 'bg-red-100 text-red-700';
  if (amber.includes(v)) return 'bg-amber-100 text-amber-700';
  if (green.includes(v)) return 'bg-emerald-100 text-emerald-700';
  return 'bg-slate-100 text-slate-600';
}

// Only Snags and Tasks have a genuine "how long has this been open" concept —
// Budget, Drawings, Vendors, etc. don't, so we don't show it there.
const DAYS_OPEN_MODULES = ['snags', 'tasks'];

function daysOpenBadge(item, moduleId) {
  if (!DAYS_OPEN_MODULES.includes(moduleId)) return '';
  const doneStates = ['done','completed','resolved','received','closed','returned'];
  if (doneStates.includes(item.status)) return ''; // stops counting the moment it's resolved/done
  const createdAt = item.created_at?.toDate ? item.created_at.toDate() : null;
  if (!createdAt) return '';
  const days = Math.max(0, Math.floor((Date.now() - createdAt.getTime()) / 86400000));
  return `<span class="text-[11px] text-slate-400">· open ${days}d</span>`;
}

// "Updated by X · date time" — shown on every card so it's clear who
// touched a record last and when, matching an audit-trail expectation.
function lastUpdatedLine(item) {
  const who = item.updated_by || item.created_by;
  const ts = (item.updated_at || item.created_at);
  const when = ts?.toDate ? formatDateTime(ts.toDate()) : '';
  if (!who && !when) return '';
  return `<p class="text-[11px] text-slate-400 mt-1">${item.updated_by ? 'Updated' : 'Added'} by ${escapeHtml(who || 'unknown')}${when ? ' · '+when : ''}</p>`;
}

function genericItemCardHTML(cfg, item, canUpdate, canDelete) {
  // Snags get a distinctive high-visibility card: colored square by
  // severity, with open+high-severity ones blinking so they can't be missed.
  // Border matches the original app: green once resolved, red+pulsing while
  // open and high-severity, plain border otherwise.
  if (cfg.cardStyle === 'severity-square') {
    const isResolved = item.status === 'resolved';
    const isUrgent = item.severity === 'high' && !isResolved;
    const cardBorder = isResolved ? 'border-emerald-400' : (isUrgent ? 'border-red-400 alert-pulse' : 'border-slate-200');
    const sevPill = { high:'bg-red-100 text-red-700', medium:'bg-amber-100 text-amber-700', low:'bg-slate-100 text-slate-600' }[item.severity] || 'bg-slate-100 text-slate-600';
    const statusPill = { open:'bg-red-100 text-red-700', in_progress:'bg-amber-100 text-amber-700', resolved:'bg-emerald-100 text-emerald-700' }[item.status] || 'bg-slate-100 text-slate-600';
    return `<div data-gm-card="${item.id}" class="glass rounded-xl p-3 border-l-4 ${cardBorder} text-sm cursor-pointer hover:shadow-md transition">
      <div class="flex items-start justify-between gap-2">
        <p class="font-semibold">${escapeHtml(item.title || '(untitled)')}</p>
        <span class="shrink-0 px-2 py-0.5 rounded-full text-[11px] font-medium ${sevPill}">${escapeHtml(item.severity||'')}</span>
      </div>
      <p class="text-xs text-slate-500 mt-1">${escapeHtml(item.unit_number || '')}${item.assigned_to ? ' · Assigned: '+escapeHtml(item.assigned_to) : ''} ${daysOpenBadge(item, 'snags')}</p>
      ${lastUpdatedLine(item)}
      ${Array.isArray(item.photos) && item.photos.length ? `<div class="flex gap-1 mt-1">${item.photos.slice(0,4).map((p,i) => fileKind(p.url)==='image' ? `<img src="${escapeHtml(p.url)}" class="w-10 h-10 rounded object-cover cursor-pointer" data-lightbox-urls='${escapeHtml(JSON.stringify(item.photos.map(x=>x.url)))}' data-lightbox-index="${i}"/>` : `<span class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-xs">📎</span>`).join('')}</div>` : ''}
      <div class="flex items-center justify-between mt-2">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${statusPill}">${escapeHtml((item.status||'').replace('_',' '))}</span>
          <span class="text-[10px] text-slate-400">click for details</span>
        </div>
        ${canDelete ? `<button data-gm-delete="${item.id}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600">Delete</button>` : ''}
      </div>
    </div>`;
  }

  const primary = item[cfg.fields[0].key] || '(untitled)';
  const selectFields = cfg.fields.filter(f => f.type === 'select' && item[f.key]);
  const otherFields = cfg.fields.slice(1).filter(f => f.type !== 'select' && f.type !== 'file' && f.type !== 'multifile' && item[f.key]);
  const fileField = cfg.fields.find(f => f.type === 'file' && item[f.key]);
  // Normalize: older records may have saved this field as a plain string
  // before it became a multi-attachment field — treat that the same way.
  const multiFieldRaw = cfg.fields.find(f => f.type === 'multifile' && item[f.key] && (Array.isArray(item[f.key]) ? item[f.key].length : true));
  const multiField = multiFieldRaw ? { ...multiFieldRaw, _items: Array.isArray(item[multiFieldRaw.key]) ? item[multiFieldRaw.key] : [{ url: item[multiFieldRaw.key] }] } : null;

  const today = new Date().toISOString().slice(0,10);
  const isOverdue = cfg.id === 'tasks' && item.status !== 'done' && item.due_date && item.due_date < today;
  // Open/pending items get a red left border (as requested); completed/
  // resolved/done items get green; everything else stays neutral.
  const doneStates = ['done','completed','resolved','received','closed','returned'];
  const openStates = ['open','pending'];
  let cardBorder = '';
  if (cfg.id === 'sla' && item.status === 'breached') cardBorder = 'border-l-4 border-red-500 alert-pulse';
  else if (cfg.id === 'sla' && item.status === 'at_risk') cardBorder = 'border-l-4 border-amber-400 alert-pulse';
  else if (isOverdue) cardBorder = 'border-l-4 border-red-400 alert-pulse';
  else if (item.status && openStates.includes(item.status)) cardBorder = 'border-l-4 border-red-400 alert-pulse';
  else if (item.status && doneStates.includes(item.status)) cardBorder = 'border-l-4 border-emerald-400';

  return `<div data-gm-card="${item.id}" class="glass rounded-xl p-3 text-sm flex justify-between items-start gap-2 cursor-pointer hover:shadow-md transition ${cardBorder}">
    <div class="flex-1">
      <div class="flex items-center gap-2 flex-wrap">
        <p class="font-semibold">${escapeHtml(primary)}</p>
        ${isOverdue ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-100 text-red-700 animate-pulse">overdue</span>` : ''}
        ${selectFields.map(f => `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${semanticPillColor(item[f.key])}">${escapeHtml(String(item[f.key]).replace('_',' '))}</span>`).join('')}
      </div>
      ${otherFields.length ? `<p class="text-xs text-slate-500 mt-1 break-all line-clamp-2">${otherFields.map(f=>`${f.label}: ${escapeHtml(String(item[f.key]).slice(0,80))}${String(item[f.key]).length>80?'…':''}`).join(' · ')} ${daysOpenBadge(item, cfg.id)}</p>` : (daysOpenBadge(item, cfg.id) ? `<p class="text-xs text-slate-400 mt-1">${daysOpenBadge(item, cfg.id)}</p>` : '')}
      ${lastUpdatedLine(item)}
      ${fileField ? (fileKind(item[fileField.key])==='image'
          ? `<img src="${escapeHtml(item[fileField.key])}" class="w-full h-20 object-cover rounded-lg mt-1 cursor-pointer" data-lightbox-urls='${escapeHtml(JSON.stringify([item[fileField.key]]))}' data-lightbox-index="0"/>`
          : `<a href="${escapeHtml(item[fileField.key])}" target="_blank" class="text-xs text-blue-600 underline" onclick="event.stopPropagation()">📎 ${fileField.label}</a>`) : ''}
      ${multiField ? `<div class="flex gap-1 mt-1">${multiField._items.slice(0,4).map((f,i) => fileKind(f.url)==='image' ? `<img src="${escapeHtml(f.url)}" class="w-10 h-10 rounded object-cover cursor-pointer" data-lightbox-urls='${escapeHtml(JSON.stringify(multiField._items.map(x=>x.url)))}' data-lightbox-index="${i}"/>` : `<span class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-xs">📎</span>`).join('')}${multiField._items.length>4?`<span class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-[10px] text-slate-500">+${multiField._items.length-4}</span>`:''}</div>` : ''}
    </div>
    ${canDelete ? `<button data-gm-delete="${item.id}" class="text-xs px-2 py-1 rounded-lg border border-red-300 text-red-600 shrink-0">Delete</button>` : ''}
  </div>`;
}

async function renderGenericModule(view, cfg) {
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projects = await loadCompanyProjects();
  if (!projects.length) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet. Ask your Company Admin to add one under "Projects" first.</p>`; return; }
  if (!genericProjectId[cfg.id] || !projects.some(p => p.id === genericProjectId[cfg.id])) genericProjectId[cfg.id] = projects[0].id;
  const projectId = genericProjectId[cfg.id];

  const role = session.profile?.role;
  const perms = session.profile?.permissions?.[cfg.id] || {};
  const canAdd = role === 'company_admin' || !!perms.add;
  const canUpdate = role === 'company_admin' || !!perms.update;
  const canDelete = role === 'company_admin' || !!perms.delete;

  view.innerHTML = `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-xl font-bold">${cfg.label}</h2>
      <div class="flex items-center gap-2 flex-wrap">
        ${projects.length > 1
          ? `<select id="gm-project-select" class="border rounded-lg px-2 py-1.5 text-xs">${projects.map(p => `<option value="${p.id}" ${p.id===projectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>`
          : `<span class="eyebrow text-slate-400">${escapeHtml(projects[0].name)}</span>`}
        <button id="gm-csv-btn" class="text-xs px-3 py-1.5 rounded-xl border">↓ CSV</button>
        <button id="gm-pdf-btn" class="text-xs px-3 py-1.5 rounded-xl border">↓ PDF</button>
        ${canAdd && cfg.id === 'tour' ? `<button id="gm-bulk-photo-btn" class="text-xs px-3 py-1.5 rounded-xl border bg-amber-50">⇪ Bulk Upload Photos</button>` : ''}
        ${canAdd ? `<button id="gm-add-btn" class="text-xs px-3 py-1.5 rounded-xl bg-blue-600 text-white font-semibold">+ ${cfg.label}</button>` : ''}
      </div>
    </div>
    ${cfg.id === 'society' ? '<div id="handover-progress" class="glass rounded-2xl p-4 mb-4"></div>' : ''}
    <input id="gm-search" type="text" placeholder="🔍 Search ${cfg.label.toLowerCase()}…" class="w-full max-w-sm border rounded-lg px-3 py-1.5 text-sm mb-3"/>
    <div id="gm-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    <div id="gm-add-modal"></div>
    <div id="gm-edit-modal"></div>
    <div id="gm-detail-modal"></div>
    <div id="gm-bulk-modal"></div>`;

  if (projects.length > 1) {
    document.getElementById('gm-project-select').addEventListener('change', (e) => {
      genericProjectId[cfg.id] = e.target.value;
      renderGenericModule(view, cfg);
    });
  }
  if (canAdd) document.getElementById('gm-add-btn').addEventListener('click', () => openGenericAdd(cfg, projectId));
  if (canAdd && cfg.id === 'tour') document.getElementById('gm-bulk-photo-btn').addEventListener('click', () => openTourBulkUpload(projectId));

  let latestItems = [];
  const activeProjectName = projects.find(p => p.id === projectId)?.name || '';
  document.getElementById('gm-csv-btn').addEventListener('click', () => exportGenericCSV(cfg, latestItems, activeProjectName));
  document.getElementById('gm-pdf-btn').addEventListener('click', () => exportGenericPDF(cfg, latestItems, activeProjectName));

  function paintGmList(items) {
    document.getElementById('gm-list').innerHTML = items.map(item => genericItemCardHTML(cfg, item, canUpdate, canDelete)).join('')
      || `<p class="text-slate-400 text-sm">No ${cfg.label.toLowerCase()} ${latestItems.length ? 'match your search' : 'yet'}.</p>`;
    document.querySelectorAll('[data-gm-card]').forEach(card => card.addEventListener('click', (e) => {
      if (e.target.closest('[data-gm-delete]')) return;
      openGenericDetail(cfg, projectId, items.find(i => i.id === card.dataset.gmCard), canUpdate);
    }));
    if (canDelete) document.querySelectorAll('[data-gm-delete]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); genericDeleteFlow(cfg, projectId, items.find(i => i.id === b.dataset.gmDelete)); }));
    wireLightboxThumbnails(document.getElementById('gm-list'));
  }

  document.getElementById('gm-search').addEventListener('input', (e) => {
    const term = e.target.value.trim().toLowerCase();
    const filtered = term
      ? latestItems.filter(item => cfg.fields.some(f => String(item[f.key] ?? '').toLowerCase().includes(term)))
      : latestItems;
    paintGmList(filtered);
  });

  const colRef = collection(db, 'companies', session.companyId, 'projects', projectId, cfg.id);
  const unsub = onSnapshot(colRef, (snap) => {
    const items = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    latestItems = items;
    const term = document.getElementById('gm-search')?.value.trim().toLowerCase() || '';
    const filtered = term
      ? items.filter(item => cfg.fields.some(f => String(item[f.key] ?? '').toLowerCase().includes(term)))
      : items;
    paintGmList(filtered);

    // Handover Pack gets a progress bar: % of to-do items marked completed
    if (cfg.id === 'society') {
      const total = items.length || 1;
      const done = items.filter(i => i.status === 'completed').length;
      const pct = Math.round((done / total) * 100);
      const bar = document.getElementById('handover-progress');
      if (bar) bar.innerHTML = `
        <div class="flex justify-between text-xs mb-1"><span class="font-semibold">Handover Progress</span><span class="data-mono">${done} / ${items.length} (${pct}%)</span></div>
        <div class="w-full bg-slate-200 rounded-full h-3"><div class="bg-emerald-500 h-3 rounded-full transition-all" style="width:${pct}%"></div></div>`;
    }
  }, (err) => { document.getElementById('gm-list').innerHTML = `<p class="text-red-600 text-sm">Error: ${err.message}</p>`; });
  unsubscribers.push(unsub);
}

// ── Virtual Tour: bulk photo upload. Pick multiple photos at once; each
// gets its own Location + Notes before uploading, so a site walk-through
// can be logged in one batch instead of one form per photo. ──────────────
function openTourBulkUpload(projectId) {
  const modal = document.getElementById('gm-bulk-modal');
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-3">
        <h3 class="font-bold text-sm">Bulk Upload Photos — Virtual Tour</h3>
        <p class="text-xs text-slate-500">All photos you pick here go into <b>one</b> tour spot (like a folder) — open that spot afterward to browse them with next/previous, same as photos on a computer. Uploading to a name that already exists adds these photos to it instead of making a duplicate.</p>
        <input id="tbu-location" placeholder="Folder / Location name * (e.g. Clubhouse, Tower A Lobby)" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
        <textarea id="tbu-notes" placeholder="Notes for this spot (optional)" rows="2" class="w-full border rounded-lg px-2 py-1.5 text-sm"></textarea>
        <div class="flex gap-2">
          <label class="flex-1 text-xs px-2 py-1.5 rounded-lg border text-center cursor-pointer bg-slate-50">📷 Take Photo<input id="tbu-camera" type="file" accept="image/*" capture="environment" multiple class="hidden"/></label>
          <label class="flex-1 text-xs px-2 py-1.5 rounded-lg border text-center cursor-pointer bg-slate-50">🖼️ Choose Photos<input id="tbu-files" type="file" accept="image/*" multiple class="hidden"/></label>
        </div>
        <div id="tbu-preview" class="flex flex-wrap gap-2"></div>
        <div class="flex gap-2 pt-1">
          <button id="tbu-upload" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold" disabled>Upload All</button>
          <button id="tbu-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="tbu-status" class="text-xs"></p>
      </div>
    </div>`;
  document.getElementById('tbu-cancel').addEventListener('click', () => modal.innerHTML = '');

  let selectedFiles = [];
  function handlePick(e) {
    selectedFiles = selectedFiles.concat(Array.from(e.target.files));
    document.getElementById('tbu-preview').innerHTML = selectedFiles.map(f => `<img src="${URL.createObjectURL(f)}" class="w-14 h-14 rounded object-cover"/>`).join('');

  }
  document.getElementById('tbu-files').addEventListener('change', handlePick);
  document.getElementById('tbu-camera').addEventListener('change', handlePick);

  document.getElementById('tbu-upload').addEventListener('click', async () => {
    const btn = document.getElementById('tbu-upload');
    const status = document.getElementById('tbu-status');
    const location = document.getElementById('tbu-location').value.trim();
    const notes = document.getElementById('tbu-notes').value.trim();
    if (!location) { status.textContent = 'Give this batch a folder/location name.'; status.className = 'text-xs text-red-600'; return; }
    if (!selectedFiles.length) { status.textContent = 'Pick at least one photo.'; status.className = 'text-xs text-red-600'; return; }
    btn.disabled = true;

    // If a tour spot with this exact name already exists, add to it instead of duplicating.
    const existingSnap = await getDocs(query(
      collection(db, 'companies', session.companyId, 'projects', projectId, 'tour'),
      where('name', '==', location)
    ));

    const uploadedPhotos = [];
    for (let i = 0; i < selectedFiles.length; i++) {
      status.textContent = `Uploading ${i+1} of ${selectedFiles.length}…`; status.className = 'text-xs text-slate-500';
      try {
        const url = await uploadFileOrBlob(selectedFiles[i], 'tour', selectedFiles[i].name, projectId);
        uploadedPhotos.push({ url, name: selectedFiles[i].name });
      } catch (err) {
        status.textContent = `Failed uploading photo ${i+1}: ${err.message}`; status.className = 'text-xs text-red-600';
        btn.disabled = false; return;
      }
    }

    if (!existingSnap.empty) {
      const existingDoc = existingSnap.docs[0];
      const existingPhotos = Array.isArray(existingDoc.data().photos) ? existingDoc.data().photos : [];
      await updateDoc(doc(db, 'companies', session.companyId, 'projects', projectId, 'tour', existingDoc.id), {
        photos: [...existingPhotos, ...uploadedPhotos],
        notes: notes || existingDoc.data().notes || '',
        updated_by: session.email, updated_at: serverTimestamp()
      });
    } else {
      await addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'tour'), {
        name: location, notes, photos: uploadedPhotos,
        created_at: serverTimestamp(), created_by: session.email
      });
    }

    addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'activityLog'), {
      actor: session.email, action: `Bulk uploaded ${uploadedPhotos.length} photo(s) to "${location}"`, at: serverTimestamp()
    }).catch(() => {});
    status.textContent = `${uploadedPhotos.length} photo(s) uploaded to "${location}" ✓`; status.className = 'text-xs text-emerald-600';
    setTimeout(() => { modal.innerHTML = ''; }, 1200);
  });
}

async function openGenericAdd(cfg, projectId) {
  const modal = document.getElementById('gm-add-modal');
  const extraCats = {};
  for (const f of cfg.fields.filter(f => f.type === 'select-addable')) {
    extraCats[f.key] = await loadCustomCategories(cfg.id, f.key);
  }
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-md w-full max-h-[85vh] overflow-y-auto space-y-2">
        <h3 class="font-bold text-sm">Add ${cfg.label}</h3>
        ${cfg.fields.map(f => genericFieldHTML(f, '', 'gm-f', extraCats[f.key])).join('')}
        <div class="flex gap-2 pt-2">
          <button id="gm-f-save" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Add</button>
          <button id="gm-f-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="gm-f-error" class="hidden text-xs text-red-600"></p>
      </div>
    </div>`;
  wireDynamicFieldBehavior(cfg, 'gm-f', projectId);
  document.getElementById('gm-f-cancel').addEventListener('click', () => modal.innerHTML = '');
  document.getElementById('gm-f-save').addEventListener('click', async () => {
    const btn = document.getElementById('gm-f-save');
    const errEl = document.getElementById('gm-f-error');
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      const { data, missingRequired } = await readGenericFields(cfg, 'gm-f', projectId);
      if (missingRequired) { errEl.textContent = 'Please fill required fields.'; errEl.classList.remove('hidden'); btn.disabled=false; btn.textContent='Add'; return; }
      await addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, cfg.id), {
        ...data, created_at: serverTimestamp(), created_by: session.email
      });
      addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'activityLog'), {
        actor: session.email, action: `Added ${cfg.label} — ${data[cfg.fields[0].key] || ''}`, at: serverTimestamp()
      }).catch(() => {});
      modal.innerHTML = '';
    } catch (err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Add';
    }
  });
}

// Clicking any card opens this — full detail view for everyone. If the
// person has update permission, fields are editable with a Save button;
// otherwise it's a clean read-only detail panel (fixes "clicking a
// snag/task does nothing" for view-only roles).
const LOCKED_STATES = ['done','completed','resolved','received','closed','returned'];

async function openGenericDetail(cfg, projectId, item, canUpdate) {
  const modal = document.getElementById('gm-detail-modal');
  const isLocked = LOCKED_STATES.includes(item.status) && session.profile?.role !== 'company_admin';
  const effectiveEdit = canUpdate && !isLocked;

  if (!effectiveEdit) {
    modal.innerHTML = `
      <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-4 max-w-md w-full max-h-[85vh] overflow-y-auto space-y-2">
          <h3 class="font-bold text-sm">${escapeHtml(item[cfg.fields[0].key] || cfg.label)}</h3>
          ${isLocked ? `<p class="text-xs bg-amber-50 text-amber-700 rounded-lg px-2 py-1.5">🔒 This item is marked "${escapeHtml(item.status)}" and is locked. Only a Company Admin can reopen it.</p>` : ''}
          ${cfg.fields.map(f => {
            const v = item[f.key];
            const hasValue = f.type === 'multifile' ? !!v : !!v;
            if (!hasValue) return '';
            let body;
            if (f.type === 'file') {
              body = filePreviewHTML(v);
            } else if (f.type === 'multifile') {
              const items = Array.isArray(v) ? v : [{ url: v }];
              const urls = items.map(a => a.url);
              body = `<div class="grid grid-cols-3 gap-2">${items.map((a,i) => `<div>${filePreviewHTML(a.url, urls, i)}${a.name ? `<p class="text-[10px] text-slate-400 mt-0.5 truncate">${escapeHtml(a.name)}</p>` : ''}</div>`).join('')}</div>`;
            } else {
              body = `<p class="text-sm break-all">${escapeHtml(String(v))}</p>`;
            }
            return `<div><p class="text-[10px] text-slate-500 uppercase">${f.label}</p>${body}</div>`;
          }).join('')}
          ${lastUpdatedLine(item)}
          <button id="gm-detail-close" class="w-full py-2 rounded-xl border text-sm mt-2">Close</button>
        </div>
      </div>`;
    document.getElementById('gm-detail-close').addEventListener('click', () => modal.innerHTML = '');
    wireLightboxThumbnails(modal);
    return;
  }

  const extraCats = {};
  for (const f of cfg.fields.filter(f => f.type === 'select-addable')) {
    extraCats[f.key] = await loadCustomCategories(cfg.id, f.key);
  }
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-md w-full max-h-[85vh] overflow-y-auto space-y-2">
        <h3 class="font-bold text-sm">${cfg.label} details</h3>
        ${cfg.fields.map(f => genericFieldHTML(f, item[f.key], 'gm-ef', extraCats[f.key])).join('')}
        ${lastUpdatedLine(item)}
        <div class="flex gap-2 pt-2">
          <button id="gm-ef-save" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Save</button>
          <button id="gm-ef-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="gm-ef-error" class="hidden text-xs text-red-600"></p>
      </div>
    </div>`;
  wireDynamicFieldBehavior(cfg, 'gm-ef', projectId);
  wireLightboxThumbnails(modal);
  document.getElementById('gm-ef-cancel').addEventListener('click', () => modal.innerHTML = '');
  document.getElementById('gm-ef-save').addEventListener('click', async () => {
    const btn = document.getElementById('gm-ef-save');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { data } = await readGenericFields(cfg, 'gm-ef', projectId, item);
      await updateDoc(doc(db, 'companies', session.companyId, 'projects', projectId, cfg.id, item.id), {
        ...data, updated_by: session.email, updated_at: serverTimestamp()
      });
      addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'activityLog'), {
        actor: session.email, action: `Updated ${cfg.label} — ${data[cfg.fields[0].key] || item[cfg.fields[0].key] || ''}`, at: serverTimestamp()
      }).catch(() => {});
      modal.innerHTML = '';
    } catch (err) {
      document.getElementById('gm-ef-error').textContent = err.message;
      document.getElementById('gm-ef-error').classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Save';
    }
  });
}

// ── CSV / PDF export — same approach as the original app: CSV as a
// downloadable Blob, PDF as a printable window (person hits Ctrl+P → Save as PDF).
function csvCell(value) {
  const str = String(value ?? '');
  // Only quote when necessary — quoting plain numbers makes spreadsheet
  // apps treat them as text and left-align them instead of right-aligning,
  // which is what "alignment isn't right" usually means in practice.
  if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
  return str;
}

function exportGenericCSV(cfg, items, projectName) {
  const headers = cfg.fields.map(f => f.label);
  const rows = [
    [`Project: ${projectName || ''}`],
    [`${cfg.label} — exported ${formatDateTime(new Date())}`],
    [],
    headers,
    ...items.map(item => cfg.fields.map(f => item[f.key] ?? ''))
  ];
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${cfg.id}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function exportGenericPDF(cfg, items, projectName) {
  const headers = cfg.fields.map(f => f.label);
  const isNumericField = f => f.type === 'number';
  let body = `
    <h1 style="margin-bottom:2px">ProjectTracker – ${escapeHtml(cfg.label)}</h1>
    <p style="color:#555;margin-top:0">Project: <b>${escapeHtml(projectName || '—')}</b> · ${formatDateTime(new Date())} · ${escapeHtml(session.email||'')}</p>
    <table style="border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed">
      <thead><tr>${headers.map(h => `<th style="border:1px solid #ccc;padding:6px 8px;background:#f1f5f9;text-align:left">${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>`;
  items.forEach((item, i) => {
    const rowBg = i % 2 === 0 ? '#ffffff' : '#fafafa';
    body += '<tr>' + cfg.fields.map(f => `<td style="border:1px solid #ddd;padding:6px 8px;background:${rowBg};text-align:${isNumericField(f)?'right':'left'};word-wrap:break-word">${escapeHtml(String(item[f.key] ?? ''))}</td>`).join('') + '</tr>';
  });
  body += '</tbody></table>';
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>${escapeHtml(cfg.label)} report</title></head><body style="font-family:system-ui;padding:24px">${body}<script>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}

async function genericDeleteFlow(cfg, projectId, item) {
  if (!confirm(`Delete this ${cfg.label} entry? This can't be undone.`)) return;
  const label = item[cfg.fields[0].key] || '';
  await deleteDoc(doc(db, 'companies', session.companyId, 'projects', projectId, cfg.id, item.id));
  addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'activityLog'), {
    actor: session.email, action: `Deleted ${cfg.label} — ${label}`, at: serverTimestamp()
  }).catch(() => {});
}

// ── ACTIVITY LOG (read-only — entries are written automatically by
//    the app itself whenever something changes; nobody adds these by hand) ─
let activityProjectId = null;
async function renderActivityLog(view) {
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projects = await loadCompanyProjects();
  if (!projects.length) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet.</p>`; return; }
  if (!activityProjectId || !projects.some(p => p.id === activityProjectId)) activityProjectId = projects[0].id;
  const isAdmin = session.profile?.role === 'company_admin';

  view.innerHTML = `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-xl font-bold">Activity Log</h2>
      <div class="flex items-center gap-2">
        ${projects.length > 1
          ? `<select id="activity-project-select" class="border rounded-lg px-2 py-1.5 text-xs">${projects.map(p => `<option value="${p.id}" ${p.id===activityProjectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>`
          : `<span class="eyebrow text-slate-400">${escapeHtml(projects[0].name)}</span>`}
        ${isAdmin ? `<button id="activity-csv-btn" class="text-xs px-3 py-1.5 rounded-xl border">↓ CSV (admin)</button>` : ''}
      </div>
    </div>
    <div id="activity-list" class="space-y-2"></div>`;

  if (projects.length > 1) {
    document.getElementById('activity-project-select').addEventListener('change', (e) => {
      activityProjectId = e.target.value;
      renderActivityLog(view);
    });
  }

  let latestEntries = [];
  if (isAdmin) {
    document.getElementById('activity-csv-btn').addEventListener('click', () => {
      const projectName = projects.find(p => p.id === activityProjectId)?.name || '';
      const rows = [
        [`Project: ${projectName}`], [`Activity Log — exported ${formatDateTime(new Date())}`], [],
        ['Actor','Action','Date/Time'],
        ...latestEntries.map(a => [a.actor||'System', a.action||'', a.at?.toDate ? formatDateTime(a.at.toDate()) : ''])
      ];
      const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'activity-log.csv'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  const q = query(
    collection(db, 'companies', session.companyId, 'projects', activityProjectId, 'activityLog'),
    orderBy('at', 'desc')
  );
  const unsub = onSnapshot(q, (snap) => {
    const entries = snap.docs.map(d => d.data()).slice(0, 100);
    latestEntries = entries;
    document.getElementById('activity-list').innerHTML = entries.map(a => `
      <div class="glass rounded-xl p-3 text-sm">
        <p class="font-medium">${escapeHtml(a.actor || 'System')}</p>
        <p class="text-slate-500 text-xs">${escapeHtml(a.action || '')}</p>
        <p class="text-[10px] text-slate-400 mt-1">${a.at?.toDate ? formatDateTime(a.at.toDate()) : ''}</p>
      </div>`).join('') || '<p class="text-slate-400 text-sm">No activity recorded yet.</p>';
  }, (err) => { document.getElementById('activity-list').innerHTML = `<p class="text-red-600 text-sm">Error: ${err.message}</p>`; });
  unsubscribers.push(unsub);
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// DD/MM/YYYY, h:mm AM/PM — built explicitly rather than relying on
// .toLocaleString(), which uses whatever locale the browser reports and
// can come out as MM/DD/YYYY or otherwise look "wrong" depending on device
// settings. Uses the Date object's local-time getters, so it always shows
// the viewer's own local time, correctly.
function formatDateTime(date) {
  const dd = String(date.getDate()).padStart(2, '0');
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const yyyy = date.getFullYear();
  let h = date.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const min = String(date.getMinutes()).padStart(2, '0');
  return `${dd}/${mm}/${yyyy}, ${h}:${min} ${ampm}`;
}

// ── PWA: register service worker so the app becomes installable ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {
      // Fails silently if service-worker.js wasn't uploaded alongside
      // index.html — the app still works fully, just isn't installable.
    });
  });
}

// ── Scroll lock: whenever any popup/modal is open (photo viewer, add/edit
// forms, etc.) the page behind it should not scroll — that's what was
// causing the "screen jumps around while scrolling" issue. Every modal in
// this app uses the same "fixed inset-0" backdrop pattern, so instead of
// wiring lock/unlock into every single open/close function individually,
// this watches the whole page once and locks/unlocks automatically based
// on whether any modal is currently present.
function updateScrollLock() {
  const modalOpen = !!document.querySelector('.fixed.inset-0:not(#login-screen)');
  document.body.style.overflow = modalOpen ? 'hidden' : '';
}
new MutationObserver(updateScrollLock).observe(document.body, { childList: true, subtree: true });
</script>
