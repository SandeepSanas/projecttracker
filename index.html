    if (canView('bills')) cards2.push({ label:'Bills Outstanding', value: inrFmt(st.outstanding), sub: `${inrFmt(st.billed)} approved · ${st.inApprovalCount} in approval`, tone: st.outstanding ? 'text-red-600' : 'text-emerald-600', blink: st.inApprovalCount > 0, module:'bills' });
    if (canView('payments')) cards2.push({ label:'Payments Made', value: inrFmt(st.paid), sub: `${pays.length} payment(s)`, tone:'text-emerald-600', module:'payments' });
    const fp = document.getElementById('finance-panel');
    if (fp) {
      const pct = st.billed ? Math.min(Math.round(st.paid / st.billed * 100), 100) : 0;
      const cell = (label, value, cls = '') => `<div><p class="eyebrow text-slate-500">${label}</p><p class="font-bold data-mono ${cls}">${value}</p></div>`;
      fp.innerHTML = `<h3 class="font-semibold text-sm mb-3">Billing &amp; Payments</h3>
        <div class="flex flex-wrap gap-4 mb-2">${cell('Approved bills', inrFmt(st.billed))}${cell('Paid', inrFmt(st.paid), 'text-emerald-600')}${cell('Outstanding', inrFmt(st.outstanding), 'text-red-600')}${cell('In approval', `${st.inApprovalCount} · ${inrFmt(st.inApprovalAmt)}`)}${st.retentionHeld ? cell('Retention held', inrFmt(st.retentionHeld)) : ''}</div>
        <div class="w-full bg-slate-200 rounded-full h-2 mb-2"><div class="bg-emerald-500 h-2 rounded-full" style="width:${pct}%"></div></div>
        <p class="text-[11px] text-slate-500 mb-2">Unpaid by age: <b>${inrFmt(st.ageing.a)}</b> 0–30 days · <b>${inrFmt(st.ageing.b)}</b> 31–60 · <b class="${st.ageing.c ? 'text-red-600' : ''}">${inrFmt(st.ageing.c)}</b> over 60</p>
        ${st.vendors.filter(v => v.due > 0).slice(0, 5).map(v => `<div class="flex justify-between text-xs py-1 border-t"><span>${escapeHtml(v.name)}</span><span class="data-mono font-semibold">${inrFmt(v.due)} due</span></div>`).join('') || '<p class="text-xs text-slate-400">No outstanding vendor dues.</p>'}`;
    }
  }
  if (canView('bookings')) {
    const s = computeSalesLedger(dashboardCache.bookings || [], dashboardCache.demands || [], dashboardCache.collections || []);
    cards2.push({ label:'Units Sold', value: units.length ? `${s.sold}/${units.length}` : s.sold, sub: `${inrFmt(s.agreementValue)} agreement value`, tone:'text-blue-600', module:'bookings' });
    if (canView('demands') || canView('collections')) cards2.push({ label:'Buyer Dues', value: inrFmt(s.dues), sub: s.overdueCount ? `${s.overdueCount} demand(s) overdue · ${inrFmt(s.overdueAmt)}` : `${inrFmt(s.collected)} collected`, tone: s.overdueAmt ? 'text-red-600' : 'text-amber-600', blink: s.overdueCount > 0, module:'demands' });
    const sp = document.getElementById('sales-panel');
    if (sp) {
      const pct = s.demanded ? Math.min(Math.round(s.collected / s.demanded * 100), 100) : 0;
      const cell = (label, value, cls = '') => `<div><p class="eyebrow text-slate-500">${label}</p><p class="font-bold data-mono ${cls}">${value}</p></div>`;
      sp.innerHTML = `<h3 class="font-semibold text-sm mb-3">Sales &amp; Collections</h3>
        <div class="flex flex-wrap gap-4 mb-2">${cell('Units sold', s.sold)}${cell('Agreement value', inrFmt(s.agreementValue))}${cell('Demanded', inrFmt(s.demanded))}${cell('Collected', inrFmt(s.collected), 'text-emerald-600')}${cell('Due', inrFmt(s.dues), 'text-amber-600')}${cell('Overdue', inrFmt(s.overdueAmt), s.overdueAmt ? 'text-red-600' : '')}</div>
        <div class="w-full bg-slate-200 rounded-full h-2"><div class="bg-emerald-500 h-2 rounded-full" style="width:${pct}%"></div></div>
        <p class="text-[11px] text-slate-400 mt-1">${pct}% of demanded amount collected</p>`;
    }
  }
  if (canView('stock')) {
    const bal = computeStockBalances(dashboardCache.stock || [], dashboardCache.diary || []);
    const low = bal.filter(r => r.balance < 0 || (r.min > 0 && r.balance <= r.min));
    cards2.push({ label:'Material Stock', value: bal.length ? `${low.length} low` : '—', sub: `${bal.length} material(s) tracked`, tone: low.length ? 'text-red-600' : 'text-slate-700', blink: low.length > 0, module:'stock' });
    const sp = document.getElementById('stock-panel');
    if (sp) sp.innerHTML = `<h3 class="font-semibold text-sm mb-3">Material Stock Balance</h3>` + (bal.length ? bal.slice(0, 12).map(r => {
      const isLow = r.balance < 0 || (r.min > 0 && r.balance <= r.min);
      return `<div class="flex justify-between text-xs py-1 border-t"><span>${escapeHtml(r.name)}</span><span class="data-mono font-semibold ${isLow ? 'text-red-600' : ''}">${r.balance} ${escapeHtml(r.unit)}${isLow ? ' ⚠' : ''}</span></div>`;
    }).join('') : '<p class="text-xs text-slate-400">No stock entries yet.</p>');
  }

  const kpi2El = document.getElementById('kpi-cards-2');
  if (kpi2El) {
    kpi2El.innerHTML = cards2.map(c => `
      <div class="glass rounded-2xl p-4 border border-slate-200 ${c.blink ? 'alert-pulse border-amber-300' : ''} ${c.module?'cursor-pointer hover:shadow-md hover:border-blue-300 transition':''}" ${c.module?`data-nav-module="${c.module}"`:''}>
        <p class="text-2xl font-bold ${c.tone||''} ${c.blink ? 'blink' : ''}">${escapeHtml(String(c.value))}</p>
        <p class="eyebrow text-slate-500 mt-1">${escapeHtml(c.label)}</p>
        ${c.sub ? `<p class="text-[10px] text-slate-400 mt-0.5">${escapeHtml(c.sub)}</p>` : ''}
      </div>`).join('');

// Hand-rolled SVG pie/donut chart — no external chart library needed,
// so it can never fail to load regardless of network/CDN restrictions.
function pieSVG(counts, hexColors) {
  const total = Object.values(counts).reduce((a,b) => a+b, 0) || 1;
  let angle = -90, paths = '', labels = '';
  Object.entries(counts).forEach(([k,v]) => {
    if (!v) return;
    const slice = (v/total)*360;
    const x1 = 50 + 40*Math.cos(angle*Math.PI/180);
    const y1 = 50 + 40*Math.sin(angle*Math.PI/180);
    const midAngle = angle + slice/2;
    angle += slice;
    const x2 = 50 + 40*Math.cos(angle*Math.PI/180);
    const y2 = 50 + 40*Math.sin(angle*Math.PI/180);
    const large = slice > 180 ? 1 : 0;
    paths += `<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${hexColors[k]}"/>`;
    // Count label on the slice itself, in its own color's slice, positioned
    // partway out from center — skipped for slivers too thin to read.
    if (slice >= 18) {
      const lx = 50 + 28*Math.cos(midAngle*Math.PI/180);
      const ly = 50 + 28*Math.sin(midAngle*Math.PI/180);
      labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#ffffff">${v}</text>`;
    }
  });
  const realTotal = Object.values(counts).reduce((a,b) => a+b, 0);
  return `<svg viewBox="0 0 100 100" class="w-full h-full">${paths}${labels}<circle cx="50" cy="50" r="18" class="donut-hole"/>
    <text x="50" y="47" text-anchor="middle" font-size="16" font-weight="700" class="donut-total">${realTotal}</text>
    <text x="50" y="59" text-anchor="middle" font-size="6" fill="#94a3b8" letter-spacing="0.5">UNITS</text>
  </svg>`;
}

function renderStatusBreakdown(units) {
  // Driven by the pipeline definition so the donut and bars stay in step
  // with the stages automatically.
  const order = STATUS_LEGEND.map(s => s.key);
  const colors = Object.fromEntries(STATUS_LEGEND.map(s => [s.key, s.dot]));
  const hexColors = {
    pending:'#cbd5e1', in_progress:'#3b82f6', quality_review:'#a855f7',
    crm_review:'#06b6d4', ready:'#14b8a6', handed_over:'#059669',
    delayed:'#ef4444', on_hold:'#f59e0b'
  };
  const labels = Object.fromEntries(STATUS_LEGEND.map(s => [s.key, s.label]));
  const total = units.length || 1;
  const counts = {}; order.forEach(k=>counts[k]=0);
  units.forEach(u => { const s = unitStatus(u); if (counts[s] !== undefined) counts[s]++; });
  document.getElementById('status-breakdown').innerHTML = order.filter(k => counts[k] > 0).map(k => `
    <div>
      <div class="flex justify-between text-xs mb-1">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${colors[k]} inline-block"></span>${labels[k]}</span>
        <span>${counts[k]} (${Math.round(counts[k]/total*100)}%)</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2"><div class="${colors[k]} h-2 rounded-full" style="width:${counts[k]/total*100}%"></div></div>
    </div>`).join('');

  const donutEl = document.getElementById('status-donut');
  if (donutEl) donutEl.innerHTML = pieSVG(counts, hexColors);
}

// ── VISUAL PLAN (real-time, add tower/floor/unit, update status) ─
let visualCtx = null;
let visualProjectId = null;
let activeStatusBox = ''; // which pipeline count box is currently filtering the grid
function circularProgressSVG(pct, size, strokeWidth, color) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (Math.min(pct,100) / 100) * circumference;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0">
    <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="${strokeWidth}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"
      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy="0.35em" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace" fill="#1e293b" class="ring-text">${pct}%</text>
  </svg>`;
}

// The unit handover pipeline. Construction stages first, then the
// review/handover stages; delayed and on_hold are side-states that can
// happen at any point rather than steps in the sequence.
const UNIT_PIPELINE = [
  { key:'pending',        label:'Pending',          dot:'bg-slate-300',   pct:0 },
  { key:'in_progress',    label:'In Progress',      dot:'bg-blue-500',    pct:25 },
  { key:'quality_review', label:'Quality Review',   dot:'bg-purple-500',  pct:50 },
  { key:'crm_review',     label:'CRM/Sales Review', dot:'bg-cyan-500',    pct:70 },
  { key:'ready',          label:'Ready for Handover', dot:'bg-teal-500',  pct:90 },
  { key:'handed_over',    label:'Handed Over',      dot:'bg-emerald-600', pct:100 }
];
const UNIT_SIDE_STATES = [
  { key:'delayed', label:'Delayed', dot:'bg-red-500',   pct:25 },
  { key:'on_hold', label:'On Hold', dot:'bg-amber-500', pct:25 }
];
const STATUS_LEGEND = [...UNIT_PIPELINE, ...UNIT_SIDE_STATES];

// Everything the Site Progress screen needs while it is open. Units for the
// open tower are taken from the one project-wide units listener, so there is
// never more than one source painting the grid.
let visualPerms = { canAdd: false, canUpdate: false, canDelete: false };
let visualTowers = [];
let visualAllUnits = [];
let visualTowerId = null;
let visualBookingsByUnit = {};

async function renderVisual(view) {

      <span class="flex items-center gap-1.5 text-[11px] text-slate-600"><span class="w-2.5 h-2.5 rounded-full bg-yellow-300 border border-yellow-600 inline-block"></span>Sold</span>
    </div>
    <div id="overall-progress" class="glass rounded-2xl p-3 mb-4"></div>

  }

  function repaintOverallProgress() {
    const host = document.getElementById('overall-progress');
    if (!host) return;
    const total = visualAllUnits.length;
    if (!total) { host.innerHTML = '<p class="text-sm text-slate-400">No units added yet.</p>'; return; }

    const counts = {};

    host.innerHTML = `
      <div class="flex justify-between text-xs mb-1"><span class="font-semibold">Handover Progress — ${escapeHtml(projectName)}</span><span class="data-mono">${done}/${total} handed over (${pct}%)</span></div>
      <div class="w-full bg-slate-200 rounded-full h-2.5 mb-3"><div class="bg-emerald-600 h-2.5 rounded-full transition-all" style="width:${pct}%"></div></div>
      <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2">
        ${STATUS_LEGEND.map(s => `
          <button data-status-box="${s.key}" class="text-left rounded-xl border px-2 py-1.5 hover:shadow-md transition ${activeStatusBox === s.key ? 'ring-2 ring-blue-400' : ''}">
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-sm ${s.dot} inline-block shrink-0"></span>
              <span class="text-lg font-bold leading-none">${counts[s.key] || 0}</span>

      renderFilteredUnitGrid();
    }, () => {}));
  }
}

function renderTowerCards() {
  const wrap = document.getElementById('tower-list');
  if (!wrap) return;
  if (!visualTowers.length) {
    wrap.innerHTML = `<p class="text-slate-400 text-sm col-span-full">No towers yet in this project.${visualPerms.canAdd ? ' Use "+ Tower" or "Bulk Import" to add them.' : ''}</p>`;
    return;
  }
  wrap.innerHTML = visualTowers.map(t => {
    const tUnits = visualAllUnits.filter(u => u.tower_id === t.id);
    const total = tUnits.length;
    const avgPct = total ? Math.round(tUnits.reduce((s,u) => s + (Number(u.completion_pct)||0), 0) / total) : 0;
    const floors = new Set(tUnits.map(u => u.floor_name).filter(Boolean)).size;
    // Counted through unitStatus() so both pipeline stages and older
    // "completed" records land in the right bucket.
    const c = {};
    tUnits.forEach(u => { const s = unitStatus(u); c[s] = (c[s] || 0) + 1; });
    const n = (k) => c[k] || 0;
    const inReview = n('quality_review') + n('crm_review') + n('ready');
    const ringColor = avgPct >= 100 ? '#10b981' : n('delayed') > 0 ? '#ef4444' : '#3b82f6';
    const line = (dot, label, value) => `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm ${dot} inline-block"></span>${label} ${value}</span>`;
    return `<div class="relative">
      <div class="absolute top-2 right-2 z-10 flex gap-1">
        ${visualPerms.canUpdate ? `<button data-rename-tower="${escapeHtml(t.id)}" class="text-[10px] px-2 py-1 rounded-lg border bg-white">Rename</button>` : ''}
        ${visualPerms.canDelete ? `<button data-delete-tower="${escapeHtml(t.id)}" class="text-[10px] px-2 py-1 rounded-lg border border-red-300 text-red-600 bg-white">Delete</button>` : ''}
      </div>
      <button data-tower="${escapeHtml(t.id)}" class="tower-card text-left glass rounded-2xl p-4 hover:shadow-lg transition w-full h-full ${t.id === visualTowerId ? 'ring-2 ring-blue-400' : ''}">
      <div class="flex items-center gap-3">
        ${circularProgressSVG(avgPct, 52, 5, ringColor)}
        <div>
          <p class="font-semibold text-sm">${escapeHtml(t.name)}</p>
          <p class="text-xs text-slate-500 data-mono">${floors || '—'} floors · ${total} units</p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-x-2 gap-y-1 mt-3 text-xs text-slate-600">
        ${line('bg-emerald-600', 'Handed over', n('handed_over'))}
        ${line('bg-teal-500', 'In review / ready', inReview)}
        ${line('bg-blue-500', 'In progress', n('in_progress'))}
        ${line('bg-slate-300', 'Pending', n('pending'))}
        ${line('bg-red-500', 'Delayed', n('delayed'))}
        ${line('bg-amber-500', 'On hold', n('on_hold'))}
      </div>
    </button></div>`;
  }).join('');
  wrap.querySelectorAll('.tower-card').forEach(b => b.addEventListener('click', () => showUnits(b.dataset.tower)));
  wrap.querySelectorAll('[data-delete-tower]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); deleteTowerFlow(b.dataset.deleteTower); }));
  wrap.querySelectorAll('[data-rename-tower]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); renameTowerFlow(b.dataset.renameTower); }));
}

// Removes a tower and every unit inside it — the way to undo a bad bulk
// import without hand-deleting hundreds of units one at a time.
async function deleteTowerFlow(towerId) {
  const tower = visualTowers.find(t => t.id === towerId);
  if (!tower) return;
  const unitCount = visualAllUnits.filter(u => u.tower_id === towerId).length;
  const typed = await uiDialog({
    title: `Delete "${tower.name}"?`,
    message: `This deletes the tower and all ${unitCount} unit(s) inside it. It can't be undone.\n\nType DELETE to confirm.`,
    input: true, requireText: 'DELETE', okText: 'Delete', cancelText: 'Cancel', danger: true
  });
  if (typed === null) return;
  try {
    const unitsSnap = await getDocs(query(
      collection(db, 'companies', session.companyId, 'projects', visualProjectId, 'units'),
      where('tower_id', '==', towerId)
    ));
    const writer = makeBatchWriter();
    for (const dd of unitsSnap.docs) await writer.del(dd.ref);
    await writer.del(doc(db, 'companies', session.companyId, 'projects', visualProjectId, 'towers', towerId));
    await writer.flush();
    logActivity(visualProjectId, `Deleted tower "${tower.name}" and ${unitsSnap.docs.length} unit(s)`);
  } catch (err) {
    await uiAlert('Could not delete: ' + err.message);
  }
}

async function addTowerFlow() {
  const name = ((await uiPrompt('Tower name (e.g. Tower A):')) || '').trim();
  if (!name) return;
  if (visualTowers.some(t => String(t.name || '').trim().toLowerCase() === name.toLowerCase())) { await uiAlert(`A tower called "${name}" already exists.`); return; }
  try {
    await settleWrite(addDoc(collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'towers'), { name }));
  } catch (err) { await uiAlert('Could not add the tower: ' + err.message); }
}

// Renames a tower and carries the new name to the records that store the
// tower by name (Possession Checklist, Payment Plan, Bookings).
async function renameTowerFlow(towerId) {
  const tower = visualTowers.find(t => t.id === towerId);
  if (!tower) return;
  const name = ((await uiPrompt('New name for this tower:', tower.name)) || '').trim();
  if (!name || name === tower.name) return;
  if (visualTowers.some(t => t.id !== towerId && String(t.name || '').trim().toLowerCase() === name.toLowerCase())) { await uiAlert(`A tower called "${name}" already exists.`); return; }
  const base = ['companies', session.companyId, 'projects', visualProjectId];
  try {
    await updateDoc(doc(db, ...base, 'towers', towerId), { name });
    const writer = makeBatchWriter();
    for (const col of ['possession', 'stages', 'bookings', 'defects']) {
      try {
        const snap = await getDocs(query(collection(db, ...base, col), where('tower', '==', tower.name)));
        for (const dd of snap.docs) await writer.update(dd.ref, { tower: name });
      } catch { /* no access to that module — nothing to carry over */ }
    }
    await writer.flush();
    logActivity(visualProjectId, `Renamed tower "${tower.name}" to "${name}"`);
  } catch (err) { await uiAlert('Could not rename: ' + err.message); }
}

        </p>

        <div class="flex gap-2">

          <button id="bi-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>

  if (typeof Papa === 'undefined') document.getElementById('bi-result').innerHTML = '<p class="text-red-600">The CSV reader did not load. Check that papaparse.min.js was uploaded next to index.html.</p>';

async function runBulkImport(projects) {
  const btn = document.getElementById('bi-run');
  const resultEl = document.getElementById('bi-result');
  const fileInput = document.getElementById('bi-file');
  const pasteText = document.getElementById('bi-paste').value.trim();
  resultEl.innerHTML = '';

  let csvText = pasteText;
  if (fileInput.files[0]) csvText = await fileInput.files[0].text();
  if (!csvText) { resultEl.innerHTML = '<p class="text-red-600">Choose a file or paste CSV text first.</p>'; return; }

  // Trim whitespace and strip any BOM from header names — spreadsheet
  // exports very often produce headers like "status " or "\ufeffproject",
  // which previously didn't match and silently defaulted every row.
  const parsed = Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    transformHeader: (h) => h.replace(/^\ufeff/, '').trim().toLowerCase(),
    transform: (v) => typeof v === 'string' ? v.trim() : v
  });
  if (parsed.errors.length) {
    resultEl.innerHTML = `<p class="text-red-600">CSV problem: ${escapeHtml(parsed.errors[0].message)} (row ${parsed.errors[0].row})</p>`;
    return;
  }
  const rows = parsed.data;
  if (!rows.length) { resultEl.innerHTML = '<p class="text-red-600">No data rows found.</p>'; return; }

  btn.disabled = true; btn.textContent = 'Importing…';

  const projectByName = {};
  projects.forEach(p => projectByName[String(p.name || '').trim().toLowerCase()] = p.id);
  const errors = [];
  const toCreate = [];
  let skippedExisting = 0;

  // Per project: existing towers (matched without regard to upper/lower
  // case) and the unit numbers already in each tower, loaded once.
  const projectCtx = {};
  async function ctxFor(projectId) {
    if (!projectCtx[projectId]) {
      const base = ['companies', session.companyId, 'projects', projectId];
      const [towersSnap, unitsSnap] = await Promise.all([getDocs(collection(db, ...base, 'towers')), getDocs(collection(db, ...base, 'units'))]);
      const towers = {};
      towersSnap.docs.forEach(t => { towers[String(t.data().name || '').trim().toLowerCase()] = t.id; });
      const existing = new Set(unitsSnap.docs.map(u => `${u.data().tower_id}::${String(u.data().unit_number || '').trim().toLowerCase()}`));
      projectCtx[projectId] = { towers, existing };
    }
    return projectCtx[projectId];
  }

  try {
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const rowNum = i + 2;
      const unitNumber = (row.unit_number || '').trim();
      const towerName = (row.tower || '').trim();
      const floorName = (row.floor || '').trim();
      const unitType = (row.type || '').trim();
      // Normalise spacing/casing/hyphens so "In Progress", "on-hold", "ON HOLD"
      // all map correctly.
      let status = (row.status || 'pending').trim().toLowerCase().replace(/[\s-]+/g, '_');
      const projectNameRaw = (row.project || '').trim();

      if (!unitNumber || !towerName) { errors.push(`Row ${rowNum}: missing unit_number or tower — skipped.`); continue; }
      if (LEGACY_STATUS_MAP[status]) status = LEGACY_STATUS_MAP[status]; // e.g. "completed" from older sheets
      if (!VALID_STATUSES.includes(status)) { errors.push(`Row ${rowNum}: unknown status "${status}" — defaulted to "pending".`); status = 'pending'; }

      let projectId = visualProjectId;
      if (projectNameRaw) {
        const match = projectByName[projectNameRaw.toLowerCase()];
        if (!match) { errors.push(`Row ${rowNum}: project "${projectNameRaw}" not found — skipped. Add it under Projects first.`); continue; }
        projectId = match;
      }

      const ctx = await ctxFor(projectId);
      const towerKey = towerName.toLowerCase();
      if (!ctx.towers[towerKey]) {
        ctx.towers[towerKey] = (await addDoc(collection(db, 'companies', session.companyId, 'projects', projectId, 'towers'), { name: towerName })).id;
      }
      const towerId = ctx.towers[towerKey];
      const unitKey = `${towerId}::${unitNumber.toLowerCase()}`;
      if (ctx.existing.has(unitKey)) { skippedExisting++; continue; }
      ctx.existing.add(unitKey);

      toCreate.push({
        projectId,
        data: {
          unit_number: unitNumber, tower_id: towerId, floor_name: floorName, unit_type: unitType,
          status, completion_pct: (STATUS_LEGEND.find(s => s.key === status)?.pct) ?? 0,
          created_at: serverTimestamp(), updated_by: session.email
        }
      });
    }
  } catch (err) {
    errors.push(`Import stopped: ${err.message}`);
  }

  let created = 0;
  for (let i = 0; i < toCreate.length; i += 450) { // Firestore batch limit is 500 writes
    const chunk = toCreate.slice(i, i + 450);
    const batch = writeBatch(db);
    chunk.forEach(item => {
      const unitRef = doc(collection(db, 'companies', session.companyId, 'projects', item.projectId, 'units'));
      batch.set(unitRef, item.data);
    });
    try { await batch.commit(); created += chunk.length; }
    catch (err) { errors.push(`Batch write failed: ${err.message}`); }
  }
  if (created) logActivity(visualProjectId, `Bulk imported ${created} unit(s)`);

  btn.disabled = false; btn.textContent = 'Import';
  resultEl.innerHTML = `
    <p class="text-emerald-600 font-semibold">${created} unit(s) imported successfully.</p>
    ${skippedExisting ? `<p class="text-slate-500">${skippedExisting} unit(s) already existed and were skipped.</p>` : ''}
    ${errors.length ? `<div class="text-amber-600 max-h-32 overflow-y-auto space-y-0.5">${errors.map(e => `<p>⚠ ${escapeHtml(e)}</p>`).join('')}</div>` : ''}
  `;
}

// Recomputes the open tower's units from the project-wide list.
function refreshOpenTower() {
  if (!visualTowerId) return;
  currentTowerUnitsCache = visualAllUnits.filter(u => u.tower_id === visualTowerId);
  const typeSelect = document.getElementById('unit-type-filter');
  if (typeSelect) {
    const existingTypes = [...new Set(currentTowerUnitsCache.map(u => u.unit_type).filter(Boolean))].sort();
    const currentVal = existingTypes.includes(typeSelect.dataset.keep) ? typeSelect.dataset.keep : '';
    typeSelect.innerHTML = `<option value="">All types</option>` + existingTypes.map(t => `<option value="${escapeHtml(t)}" ${t===currentVal?'selected':''}>${escapeHtml(t)}</option>`).join('');
  }
  renderFilteredUnitGrid();
}

const STATUS_COLORS = Object.fromEntries(STATUS_LEGEND.map(s => [s.key, s.dot]));
// Reads a unit's status, translating any pre-pipeline value so older
// records still slot into the right stage instead of showing as unknown.
function unitStatus(u) {
  const s = u?.status || 'pending';
  return LEGACY_STATUS_MAP[s] || s;
}
function renderFilteredUnitGrid() {
  const grid = document.getElementById('unit-grid');
  if (!grid) return;
  const statusFilter = document.getElementById('unit-status-filter')?.value || '';
  const typeFilter = document.getElementById('unit-type-filter')?.value || '';
  const units = currentTowerUnitsCache.filter(u =>
    (!statusFilter || unitStatus(u) === statusFilter) && (!typeFilter || u.unit_type === typeFilter)
  );

  if (!units.length) { grid.innerHTML = `<p class="text-slate-400 text-sm">${currentTowerUnitsCache.length ? 'No units match this filter.' : 'No units in this tower yet.'}</p>`; return; }

  // Group by floor so it reads like an actual building — top floor first.
  const floors = {};
  units.forEach(u => {
    const f = u.floor_name || 'No floor set';
    (floors[f] = floors[f] || []).push(u);
  });
  const floorNames = Object.keys(floors).sort((a, b) => {
    const na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return nb - na; // numeric floors: highest first
    if (!isNaN(na)) return -1;
    if (!isNaN(nb)) return 1;
    return a.localeCompare(b);
  });

  grid.innerHTML = floorNames.map(floorName => {
    // Sort within the floor so units read in natural order (1001, 1002,
    // 1003...) rather than whatever order the database returned them in.
    const floorUnits = [...floors[floorName]].sort((a, b) => String(a.unit_number).localeCompare(String(b.unit_number), undefined, { numeric: true }));
    const floorDone = floorUnits.filter(u => unitStatus(u) === 'handed_over').length;
    return `
    <div class="mb-3">
      <p class="eyebrow text-slate-500 mb-1.5 flex items-center gap-2">
        ${floorName === 'No floor set' ? 'No floor set' : 'Floor ' + escapeHtml(floorName)}
        <span class="data-mono normal-case ${floorDone === floorUnits.length ? 'text-emerald-600' : 'text-slate-400'}">${floorDone}/${floorUnits.length} done</span>
      </p>
      <div class="flex flex-wrap gap-1.5">
        ${floorUnits.map(u => {
          const sold = visualBookingsByUnit[u.id] && ['booked','registered'].includes(visualBookingsByUnit[u.id].status);
          const light = unitStatus(u) === 'pending';
          return `<div data-unit="${escapeHtml(u.id)}" class="unit-box relative w-14 h-14 rounded-lg ${STATUS_COLORS[unitStatus(u)]||'bg-slate-300'} flex items-center justify-center ${light ? 'text-slate-700' : 'text-white'} text-[10px] font-bold cursor-pointer hover:ring-2 hover:ring-blue-400" title="${escapeHtml(u.unit_number)}${u.unit_type?' · '+escapeHtml(u.unit_type):''}${sold ? ' · sold' : ''} — tap for details">
            ${unitStatus(u) === 'handed_over' ? '<span class="absolute top-0 right-0.5 text-[9px]">🔑</span>' : ''}
            ${sold ? '<span class="absolute -top-1 -left-1 w-3 h-3 rounded-full bg-yellow-300 border border-yellow-600" title="Sold"></span>' : ''}
            <span class="data-mono">${escapeHtml(u.unit_number)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-unit]').forEach(box => {
    const unit = currentTowerUnitsCache.find(u => u.id === box.dataset.unit);
    if (unit) box.addEventListener('click', () => updateUnitFlow(unit.id, unit));
  });
}

// Roles allowed to approve at each review gate. Company Admin can always
// act. Set these role names up under Users; anyone else sees the stage but
// not the approve/reject buttons.
// Approval rights are granted per user in the Users screen (not by role
// name) — two people can share a role while only one of them is the actual
// approver, so this needs to be an explicit per-person permission.
function canApproveStage(stage) {
  if (session.profile?.role === 'company_admin') return true; // admin can always unblock
  if (stage === 'quality_review') return !!session.profile?.canApproveQuality;
  if (stage === 'crm_review') return !!session.profile?.canApproveCRM;
  return false;
}

// Which statuses a given person is allowed to set directly from the
// dropdown. Without this, anyone with plain update rights could simply
// pick "Handed Over" and skip the review gates entirely, which would make
// the approval permissions meaningless.
function selectableStatuses(current) {
  const isAdmin = session.profile?.role === 'company_admin';
  if (isAdmin) return STATUS_LEGEND.map(s => s.key); // admin can always correct anything

  const allowed = new Set();
  // Everyone with update rights can move a unit through the pre-review
  // construction stages, and can send it INTO a review queue.
  ['pending', 'in_progress', 'delayed', 'on_hold', 'quality_review'].forEach(k => allowed.add(k));
  // Passing OUT of a gate is done with the Pass/Fail buttons, not the
  // dropdown — but approvers can still set those stages directly.
  if (canApproveStage('quality_review')) allowed.add('crm_review');
  // "Handed over" is deliberately NOT offered in the dropdown — it's set
  // through the Mark as Handed Over action so the date and buyer get
  // recorded rather than it being a silent status flip.
  if (canApproveStage('crm_review')) allowed.add('ready');
  // Never let someone silently drop a unit out of a gate it's sitting in.
  if (current === 'quality_review' && !canApproveStage('quality_review')) {
    return ['quality_review'];
  }
  if (current === 'crm_review' && !canApproveStage('crm_review')) {
    return ['crm_review'];
  }
  allowed.add(current); // always keep the current value visible
  return STATUS_LEGEND.map(s => s.key).filter(k => allowed.has(k));
}

function updateUnitFlow(unitId, unit) {
  const projectId = visualCtx.projectId;
  const canUpdate = visualPerms.canUpdate;
  const isAdmin = isCompanyAdmin();
  const current = unitStatus(unit);
  // A handed-over unit is locked for everyone except Company Admin.
  const locked = current === 'handed_over' && !isAdmin;
  const canEditThis = canUpdate && !locked;
  const atGate = current === 'quality_review' || current === 'crm_review';
  const mayApprove = canUpdate && atGate && canApproveStage(current);
  const allowedStatuses = selectableStatuses(current);
  const statusLocked = !canEditThis || allowedStatuses.length <= 1;
  const gateLabel = current === 'quality_review' ? 'Quality' : 'CRM/Sales';
  const nextStage = current === 'quality_review' ? 'crm_review' : 'ready';
  // Handover is the real-world moment keys change hands — a deliberate,
  // dated action rather than just another dropdown value.
  const atReady = current === 'ready';
  const mayHandOver = canUpdate && atReady && canApproveStage('crm_review');
  const towerName = visualTowers.find(t => t.id === unit.tower_id)?.name || '';
  const booking = visualBookingsByUnit[unitId] || null;
  const unitRef = doc(db, 'companies', session.companyId, 'projects', projectId, 'units', unitId);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl p-4 max-w-sm w-full max-h-[90vh] overflow-y-auto space-y-2 relative">

        <h3 class="font-bold text-sm pr-8">${escapeHtml(towerName)} · Unit ${escapeHtml(unit.unit_number)}</h3>
        ${locked ? `<p class="text-xs bg-amber-50 text-amber-700 rounded-lg px-2 py-1.5">🔒 Handed over — only a Company Admin can change this unit.</p>` : ''}
        ${booking ? `<div class="rounded-lg border bg-slate-50 p-2">
          <p class="text-xs font-semibold">${escapeHtml(booking.buyer_name || 'Buyer not recorded')} <span class="px-1.5 py-0.5 rounded-full text-[10px] ${semanticPillColor(booking.status)}">${escapeHtml(booking.status || '')}</span></p>
          <p class="text-[10px] text-slate-500">${booking.phone ? '📞 ' + escapeHtml(booking.phone) + ' · ' : ''}${booking.agreement_value ? 'Agreement ' + inrFmt(booking.agreement_value) : ''}</p>
        </div>` : ''}
        ${unit.approval_history?.length ? `<div class="rounded-lg border bg-slate-50 p-2 space-y-1">
          ${unit.approval_history.slice(-3).map(h => `<p class="text-[10px] text-slate-500">${h.result === 'pass' ? '✅' : '❌'} ${escapeHtml(String(h.stage || '').replace('_',' '))} — ${escapeHtml(h.by)}${h.note ? ': ' + escapeHtml(h.note) : ''}</p>`).join('')}
        </div>` : ''}
        ${atGate ? (mayApprove ? `
          <div class="rounded-lg border border-blue-200 bg-blue-50 p-2 space-y-2">
            <p class="text-xs font-semibold text-blue-800">Awaiting ${gateLabel} approval</p>
            <div class="flex gap-2">
              <button id="uu-pass" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">✅ Pass</button>
              <button id="uu-fail" class="flex-1 py-1.5 rounded-lg bg-red-500 text-white text-xs font-semibold">❌ Fail</button>
            </div>
          </div>` : `
          <p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">Awaiting ${gateLabel} approval — you can't approve at this stage.</p>`) : ''}
        ${atReady ? (mayHandOver ? `
          <div class="rounded-lg border border-emerald-200 bg-emerald-50 p-2 space-y-2">
            <p class="text-xs font-semibold text-emerald-800">Approved and ready — record the handover when keys are given.</p>
            <div>
              <label class="text-[10px] text-slate-500">Handover date</label>
              <input id="uu-handover-date" type="date" value="${todayStr()}" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
            </div>
            <input id="uu-handover-to" placeholder="Handed over to (buyer name)" value="${escapeHtml(booking?.buyer_name || '')}" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
            <button id="uu-handover" class="w-full py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">🔑 Mark as Handed Over</button>
          </div>` : `
          <p class="text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1.5">Ready for handover — a CRM/Sales approver records the actual handover.</p>`) : ''}
        ${current === 'handed_over' && unit.handover ? `
          <div class="rounded-lg border border-emerald-200 bg-emerald-50 p-2">
            <p class="text-xs font-semibold text-emerald-800">🔑 Handed over${unit.handover.date ? ' on ' + formatDateOnly(unit.handover.date) : ''}</p>
            ${unit.handover.to ? `<p class="text-[10px] text-slate-600">To: ${escapeHtml(unit.handover.to)}</p>` : ''}
            <p class="text-[10px] text-slate-500">Recorded by ${escapeHtml(unit.handover.by || '')}</p>
          </div>` : ''}
        <div>
          <label class="text-[10px] text-slate-500">Status</label>
          <select id="uu-status" class="w-full border rounded-lg px-2 py-1.5 text-sm" ${statusLocked ? 'disabled' : ''}>
            ${STATUS_LEGEND.filter(s => allowedStatuses.includes(s.key) || s.key === current).map(s => `<option value="${s.key}" ${s.key===current?'selected':''}>${s.label}</option>`).join('')}
          </select>
          ${!canUpdate ? '' : statusLocked
            ? (atGate ? `<p class="text-[10px] text-slate-400 mt-1">Locked while awaiting ${gateLabel} approval — only an approver can move it on.</p>` : '')
            : `<p class="text-[10px] text-slate-400 mt-1">Only stages you're permitted to set are listed.</p>`}
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="text-[10px] text-slate-500">Unit no.</label><input id="uu-number" value="${escapeHtml(unit.unit_number)}" ${canEditThis ? '' : 'disabled'} class="w-full border rounded-lg px-2 py-1.5 text-sm"/></div>
          <div><label class="text-[10px] text-slate-500">Floor</label><input id="uu-floor" value="${escapeHtml(unit.floor_name || '')}" ${canEditThis ? '' : 'disabled'} class="w-full border rounded-lg px-2 py-1.5 text-sm"/></div>
          <div><label class="text-[10px] text-slate-500">Type</label><input id="uu-type" value="${escapeHtml(unit.unit_type || '')}" ${canEditThis ? '' : 'disabled'} class="w-full border rounded-lg px-2 py-1.5 text-sm"/></div>
        </div>
        <p id="uu-error" class="hidden text-xs text-red-600"></p>
        <div class="flex gap-2 pt-2">
          ${canEditThis ? `<button id="uu-save" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Save</button>` : ''}
          <button id="uu-cancel" class="flex-1 py-2 rounded-xl border text-sm">${canEditThis ? 'Cancel' : 'Close'}</button>
        </div>
        <div class="flex flex-wrap gap-2 pt-1">
          ${canDo('snags', 'add') ? `<button id="uu-snag" class="text-xs px-2 py-1.5 rounded-lg border">+ Raise snag</button>` : ''}
          <button id="uu-pack" class="text-xs px-2 py-1.5 rounded-lg border">📄 Possession pack</button>
          ${visualPerms.canDelete && !locked ? `<button id="uu-delete" class="text-xs px-2 py-1.5 rounded-lg border border-red-300 text-red-600 ml-auto">Delete unit</button>` : ''}
        </div>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const statusSelect = wrap.querySelector('#uu-status');
  const showErr = (m) => { const el = wrap.querySelector('#uu-error'); el.textContent = m; el.classList.remove('hidden'); };
  wrap.querySelector('#uu-close-x').addEventListener('click', () => wrap.remove());
  wrap.querySelector('#uu-cancel').addEventListener('click', () => wrap.remove());

  const applyStatus = async (next, approval, handover, extraFields = {}) => {
    const pct = (STATUS_LEGEND.find(s => s.key === next)?.pct) ?? 0;
    const payload = { ...extraFields, status: next, completion_pct: pct, updated_by: session.email, updated_at: serverTimestamp() };
    if (approval) payload.approval_history = arrayUnion(approval);
    if (handover) payload.handover = handover;
    try {
      await settleWrite(updateDoc(unitRef, payload));
    } catch (err) { showErr(err.message); return; }
    logActivity(projectId, handover
      ? `🔑 Handed over unit ${unit.unit_number}${handover.to ? ' to ' + handover.to : ''} on ${handover.date}`
      : approval
        ? `${approval.result === 'pass' ? 'Passed' : 'Failed'} ${approval.stage.replace('_',' ')} for unit ${unit.unit_number}${approval.note ? ' — ' + approval.note : ''}`
        : `Updated unit ${unit.unit_number}${next !== current ? ' → ' + next : ''}${Object.keys(extraFields).length ? ' (details edited)' : ''}`);
    wrap.remove();
  };

  wrap.querySelector('#uu-handover')?.addEventListener('click', async () => {
    const date = wrap.querySelector('#uu-handover-date').value;
    const to = wrap.querySelector('#uu-handover-to').value.trim();
    if (!date) { showErr('Pick the handover date.'); return; }
    if (!await uiConfirm(`Mark ${unit.unit_number} as handed over on ${formatDateOnly(date)}?${to ? '\nTo: ' + to : ''}`, { okText: 'Hand over' })) return;
    applyStatus('handed_over', null, { date, to, by: session.profile?.name || session.email, at: new Date().toISOString() });
  });

  wrap.querySelector('#uu-pass')?.addEventListener('click', async () => {
    const note = await uiPrompt(`${gateLabel} approval note (optional):`, '', { okText: 'Pass' });
    if (note === null) return;
    applyStatus(nextStage, { stage: current, result: 'pass', by: session.profile?.name || session.email, note: note.trim(), at: new Date().toISOString() });
  });
  wrap.querySelector('#uu-fail')?.addEventListener('click', async () => {
    const note = await uiPrompt('What needs fixing? (the unit goes back to In Progress)', '', { okText: 'Fail' });
    if (note === null) return;
    applyStatus('in_progress', { stage: current, result: 'fail', by: session.profile?.name || session.email, note: note.trim(), at: new Date().toISOString() });
  });
  wrap.querySelector('#uu-save')?.addEventListener('click', async () => {
    // Re-check on save rather than trusting the dropdown alone.
    const next = statusSelect.value;
    if (next !== current && !allowedStatuses.includes(next)) { showErr("You don't have permission to set that status."); return; }
    const number = wrap.querySelector('#uu-number').value.trim();
    const floor = wrap.querySelector('#uu-floor').value.trim();
    const type = wrap.querySelector('#uu-type').value.trim();
    if (!number) { showErr('Unit number cannot be blank.'); return; }
    if (number.toLowerCase() !== String(unit.unit_number).trim().toLowerCase() &&
        visualAllUnits.some(u => u.id !== unitId && u.tower_id === unit.tower_id && String(u.unit_number).trim().toLowerCase() === number.toLowerCase())) {
      showErr(`Unit ${number} already exists in this tower.`); return;
    }
    const details = {};
    if (number !== unit.unit_number) details.unit_number = number;
    if (floor !== (unit.floor_name || '')) details.floor_name = floor;
    if (type !== (unit.unit_type || '')) details.unit_type = type;
    if (next === current && !Object.keys(details).length) { wrap.remove(); return; }
    if (next === current) {
      try {
        await settleWrite(updateDoc(unitRef, { ...details, updated_by: session.email, updated_at: serverTimestamp() }));
        logActivity(projectId, `Edited unit ${unit.unit_number} details`);
        wrap.remove();
      } catch (err) { showErr(err.message); }
      return;
    }
    applyStatus(next, null, null, details);
  });

  wrap.querySelector('#uu-snag')?.addEventListener('click', () => {
    wrap.remove();
    openGenericAdd(GENERIC_MODULES.find(m => m.id === 'snags'), projectId,
      { unit_number: `${towerName ? towerName + ' · ' : ''}${unit.unit_number}` },
      { unit_id: unitId, tower: towerName });
  });
  wrap.querySelector('#uu-pack').addEventListener('click', () => generatePossessionPack(projectId, { id: unitId, ...unit }, towerName));
  wrap.querySelector('#uu-delete')?.addEventListener('click', async () => {
    if (!await uiConfirm(`Delete unit ${unit.unit_number}? This can't be undone.`, { danger: true, okText: 'Delete' })) return;
    try {
      await settleWrite(deleteDoc(unitRef));
      logActivity(projectId, `Deleted unit ${unit.unit_number} (${towerName})`);
      wrap.remove();
    } catch (err) { showErr(err.message); }
  });
}

// ── GENERIC MODULE ENGINE ────────────────────────────────────────
// Powers every module in GENERIC_MODULES: project-scoped, permission-
// gated (view/add/update/delete), real-time list, "+" button opens an
// add modal (matches the original app's UX), edit modal, delete with
// confirm, file uploads, addable categories, and conditional fields.
let annotatedBlobs = {}; // id -> Blob, set when a photo has been annotated before upload
let multiFileState = {}; // id -> array of {url, name}, staged attachments for multifile fields
const multiFilePainters = {}; // id -> function that repaints that field's attachment list
const formRefOptions = {}; // id -> options loaded for a ref-select field
const customCategoryCache = {}; // `${moduleId}-${fieldKey}` -> extra options added at runtime

// Every Add/Edit form starts from a clean slate. Without this, photos staged
// in one record's form were still there when the next record was opened and
// got saved into it.
function resetFormState(prefix) {
  [annotatedBlobs, multiFileState, multiFilePainters, formRefOptions].forEach(store => {
    Object.keys(store).forEach(k => { if (k.startsWith(prefix + '-')) delete store[k]; });
  });
}

async function loadCustomCategories(moduleId, fieldKey) {
  const cacheKey = `${moduleId}-${fieldKey}`;
  if (customCategoryCache[cacheKey]) return customCategoryCache[cacheKey];
  try {
    const snap = await getDoc(doc(db, 'companies', session.companyId, 'customCategories', cacheKey));
    customCategoryCache[cacheKey] = snap.exists() ? (snap.data().options || []) : [];
  } catch { return []; }
  return customCategoryCache[cacheKey];
}

async function loadProjectTowers(projectId) {
  try {
    const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects', projectId, 'towers'));
    return snap.docs.map(d => ({ id: d.id, name: d.data().name }))
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { numeric: true }));
  } catch { return []; }
}

// People for the "Assigned To" dropdowns. Kept for a minute at most, so a
// newly added person shows up without reloading the page.
let companyUsersCache = null;
let companyUsersAt = 0;
async function loadCompanyUsers() {
  if (companyUsersCache && Date.now() - companyUsersAt < 60000) return companyUsersCache;
  try {
    const snap = await getDocs(collection(db, 'companies', session.companyId, 'users'));
    companyUsersCache = snap.docs.map(d => ({ uid: d.id, name: d.data().name, email: d.data().email, suspended: !!d.data().suspended }))
      .filter(u => u.name && u.email && !u.suspended);
    companyUsersAt = Date.now();
  } catch { return companyUsersCache || []; }
  return companyUsersCache;
}

async function addCustomCategory(moduleId, fieldKey, newOption) {
  const cacheKey = `${moduleId}-${fieldKey}`;
  const current = await loadCustomCategories(moduleId, fieldKey);
  if (current.includes(newOption)) return;
  const updated = [...current, newOption];
  customCategoryCache[cacheKey] = updated;
  await settleWrite(setDoc(doc(db, 'companies', session.companyId, 'customCategories', cacheKey), { options: updated }));
}

// One vendor list for every screen: names from the Vendors screen plus any
// vendor typed into Bills, Payments, Orders or Snags.
async function loadVendorOptions(projectId) {
  const [a, b, c] = await Promise.all([
    loadCustomCategories('shared', 'vendor'), loadCustomCategories('bills', 'vendor'), loadCustomCategories('payments', 'vendor')
  ]);

// What a "pick a record" dropdown stores and shows, per source screen.
const REF_SOURCES = {
  bills:    { value: d => d.bill_no || '', label: d => `${d.bill_no || '(no number)'} · ${d.vendor || ''} · ${inrFmt(billPayableOf(d))}`, filter: d => d.status !== 'rejected' },
  orders:   { value: d => d.order_no || '', label: d => `${d.order_no || '(no number)'} · ${d.vendor || ''} · ${inrFmt(d.order_value)}`, filter: d => d.status !== 'cancelled' },
  budget:   { value: d => [d.category, d.item].filter(Boolean).join(' — ') },
  tasks:    { value: d => d.title || '', label: d => `${d.ref_id ? d.ref_id + ' · ' : ''}${d.title || ''}` },
  units:    { value: d => `${d._tower ? d._tower + ' · ' : ''}${d.unit_number || ''}` },
  bookings: { value: d => `${d.unit || ''}${d.buyer_name ? ' — ' + d.buyer_name : ''}`, filter: d => d.status !== 'cancelled' },
  stages:   { value: d => `${d.stage_name || ''}${d.tower && d.tower !== 'All towers' ? ' (' + d.tower + ')' : ''}` },
  demands:  { value: d => `${d.ref_id || ''} ${d.booking || ''}`.trim(), label: d => `${d.ref_id || ''} · ${d.booking || ''} · ${inrFmt(d.amount)}`, filter: d => d.status !== 'cancelled' },
  indents:  { value: d => `${d.ref_id || ''} ${d.material || ''}`.trim(), label: d => `${d.ref_id || ''} · ${d.material || ''} ${d.qty || ''} ${d.unit || ''}`, filter: d => d.status !== 'rejected' }
};
async function loadRefOptions(projectId, f, excludeId) {
  const src = REF_SOURCES[f.source];
  if (!src) return [];
  try {
    const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects', projectId, f.source));
    const towerNames = {};
    if (f.source === 'units') (await loadProjectTowers(projectId)).forEach(t => { towerNames[t.id] = t.name; });
    return snap.docs.map(d => {
      const data = { id: d.id, ...d.data() };
      if (f.source === 'units') data._tower = towerNames[data.tower_id] || '';
      return data;
    })
      .filter(dd => dd.id !== excludeId && (!src.filter || src.filter(dd)))
      .map(dd => ({ id: dd.id, value: String(src.value(dd) || ''), label: String((src.label || src.value)(dd) || ''), data: dd }))
      .filter(o => o.value)
      .sort((a, b) => a.label.localeCompare(b.label, undefined, { numeric: true }));
  } catch { return []; } // no access to that screen — the field just shows what was saved
}

// Loads whatever each field needs for its dropdown, all in parallel.
async function loadFieldExtras(cfg, projectId, item) {
  const extra = {};
  await Promise.all(cfg.fields.map(async (f) => {
    if (f.type === 'select-addable') extra[f.key] = f.vendorList ? await loadVendorOptions(projectId) : await loadCustomCategories(...(f.cat || [cfg.id, f.key]));
    else if (f.type === 'building-checklist' || f.type === 'tower-select') extra[f.key] = await loadProjectTowers(projectId);
    else if (f.type === 'user-select') extra[f.key] = await loadCompanyUsers();
    else if (f.type === 'ref-select') extra[f.key] = await loadRefOptions(projectId, f, item?.id);
  }));
  return extra;
}

// A field is shown unless it declares showFor and the current type-field
// value isn't in that list (used by Safety: training shows different
// fields than incident_report, etc).
function fieldVisible(f, currentTypeValue) {
  if (!f.showFor) return true;

// Photo fields render two separate inputs (camera capture + gallery/file
// picker) since relying on the OS's unified file picker to always offer a

// This returns whichever one the person actually used.
function getChosenFile(id) {
  const cameraEl = document.getElementById(`${id}-camera`);

const PAGE_SIZE = 30; // how many cards render before "Show more" appears

// Short human-friendly reference IDs (e.g. SNG-0042) so people can refer to
// a specific record on a phone call or WhatsApp instead of describing it.
const REF_PREFIXES = {
  snags:'SNG', tasks:'TSK', nocs:'NOC', amc:'AMC', budget:'BGT', drawings:'DRW',
  vendors:'VND', contacts:'CNT', society:'HOP', possession:'PSN', safety:'SAF',
  amenities:'AMN', assets:'AST', keys:'KEY', inventory:'INV', sla:'SLA',
  announcements:'ANN', tour:'TUR', diary:'DRY', bills:'BIL', payments:'PAY', stock:'STK',
  orders:'ORD', indents:'IND', norms:'NRM', bookings:'BKG', stages:'STG', demands:'DMD',
  collections:'RCT', rera:'RER', defects:'DEF'
};

// Next number comes from a per-screen counter updated in a transaction, so
// two people adding at the same moment can't get the same number, and the
// whole list no longer has to be downloaded just to count it. Offline (where
// transactions can't run) it falls back to "highest number seen + 1".
async function nextReferenceId(cfg, projectId) {
  return (await reserveReferenceIds(cfg, projectId, 1))[0];
}
async function reserveReferenceIds(cfg, projectId, count) {
  const prefix = REF_PREFIXES[cfg.id] || cfg.id.slice(0,3).toUpperCase();
  const block = (firstNumber) => Array.from({ length: count }, (_, i) => fmt(firstNumber + i));
  const fmt = (n) => `${prefix}-${String(n).padStart(4, '0')}`;
  const base = ['companies', session.companyId, 'projects', projectId];
  const highestExisting = async () => {
    const snap = await getDocs(collection(db, ...base, cfg.id));
    let highest = 0;
    snap.docs.forEach(d => {
      const num = parseInt(String(d.data().ref_id || '').split('-')[1], 10);
      if (!isNaN(num) && num > highest) highest = num;
    });
    return highest;
  };
  if (navigator.onLine) {
    try {
      const counterRef = doc(db, ...base, 'counters', cfg.id);
      const work = (async () => {
        const first = await getDoc(counterRef);
        const seed = first.exists() ? 0 : await highestExisting(); // first use: start after the existing records
        return runTransaction(db, async (tx) => {
          const snap = await tx.get(counterRef);
          const last = snap.exists() ? (Number(snap.data().last) || 0) : seed;
          tx.set(counterRef, { last: last + count });
          return last + 1;
        });
      })();
      const n = await Promise.race([work, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
      return block(n);
    } catch { /* fall back below */ }
  }
  try { return block(await highestExisting() + 1); }
  catch { return Array.from({ length: count }, (_, i) => `${prefix}-${(Date.now() + i).toString().slice(-5)}`); }
}

// ── Money helpers ───────────────────────────────────────────────
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const inrFmt = n => '₹' + round2(n).toLocaleString('en-IN');
const billTotalOf = b => (b.total_amount != null && b.total_amount !== '') ? (Number(b.total_amount) || 0) : (Number(b.amount) || 0) + (Number(b.gst) || 0);
// What actually has to be paid: bill total less retention, TDS and advance recovered.
const billPayableOf = b => (b.net_payable != null && b.net_payable !== '') ? (Number(b.net_payable) || 0) : billTotalOf(b);
const matKey = v => String(v || '').trim().toLowerCase();
let stockMaterialNames = [];
let normActivityNames = [];

// Approval chain for vendor bills: site certifies → accounts checks → owner approves.
const BILL_FLOW = {
  pending:   { next: 'certified', right: 'canCertifyBills', verb: 'Certify', who: 'site engineer' },
  certified: { next: 'checked',   right: 'canCheckBills',   verb: 'Check',   who: 'accounts' },
  checked:   { next: 'approved',  right: 'canApproveBills', verb: 'Approve', who: 'owner' }
};
function canActOnBill(status) {
  const step = BILL_FLOW[status || 'pending'];
  return !!step && (isCompanyAdmin() || !!session.profile?.[step.right]);
}

// Stock balance = inward − outward entries − materials consumed in Site
// Diary (DPR) reports. Kept separately per material AND unit, so bags are
// never added to kilograms.
function computeStockBalances(stock, diary) {
  const unitsSeen = {};
  const seeUnit = (name, unit) => { const k = matKey(name); (unitsSeen[k] = unitsSeen[k] || new Set()); if (unit) unitsSeen[k].add(String(unit).trim().toLowerCase()); };
  (stock || []).forEach(e => seeUnit(e.material || 'Unspecified', e.unit));
  (diary || []).forEach(d => (Array.isArray(d.materials_used) ? d.materials_used : []).forEach(u => { if (u.material) seeUnit(u.material, u.unit); }));
  // An entry with no unit belongs with the material's only unit, when there is exactly one.
  const unitFor = (name, unit) => {
    const u = String(unit || '').trim().toLowerCase();
    if (u) return u;
    const known = unitsSeen[matKey(name)];
    return known && known.size === 1 ? [...known][0] : '';
  };
  const m = {};
  const rowFor = (name, unit) => {
    const u = unitFor(name, unit);
    const k = matKey(name) + '|' + u;
    return m[k] || (m[k] = { name: String(name).trim(), unit: u, inward: 0, outward: 0, dpr: 0, min: 0 });
  };
  [...(stock || [])].sort((a, b) => (a.entry_date || '').localeCompare(b.entry_date || '')).forEach(e => {
    const r = rowFor(e.material || 'Unspecified', e.unit);
    const q = Number(e.qty) || 0;
    if (e.entry_type === 'outward') r.outward += q; else r.inward += q;
    if (Number(e.min_level) > 0) r.min = Number(e.min_level);
  });
  (diary || []).forEach(d => (Array.isArray(d.materials_used) ? d.materials_used : []).forEach(u => {
    if (!u.material) return;
    rowFor(u.material, u.unit).dpr += Number(u.qty) || 0;
  }));
  return Object.values(m).map(r => ({ ...r, inward: round2(r.inward), outward: round2(r.outward), dpr: round2(r.dpr), balance: round2(r.inward - r.outward - r.dpr) }))
    .sort((a, b) => a.name.localeCompare(b.name) || a.unit.localeCompare(b.unit));
}

// Material reconciliation: what the work recorded in the Site Diary SHOULD
// have consumed (quantity of work × the norm) against what was actually
// booked as consumed.
function computeReconciliation(norms, diary) {
  const theory = {};
  const normsByActivity = {};
  (norms || []).forEach(n => { (normsByActivity[matKey(n.activity)] = normsByActivity[matKey(n.activity)] || []).push(n); });
  (diary || []).forEach(d => (Array.isArray(d.activities) ? d.activities : []).forEach(a => {
    const qty = Number(a.qty) || 0;
    if (!qty) return;
    (normsByActivity[matKey(a.activity)] || []).forEach(n => {
      const k = matKey(n.material);
      const r = theory[k] || (theory[k] = { name: String(n.material).trim(), unit: n.material_unit || '', should: 0, allow: 0, allowWeight: 0 });
      const need = qty * (Number(n.qty_per_unit) || 0);
      r.should += need;
      r.allow += need * numOr(n.wastage_pct, 5);
      r.allowWeight += need;
    });
  }));
  const used = {};
  (diary || []).forEach(d => (Array.isArray(d.materials_used) ? d.materials_used : []).forEach(u => {
    if (u.material) used[matKey(u.material)] = (used[matKey(u.material)] || 0) + (Number(u.qty) || 0);
  }));
  return Object.entries(theory).filter(([, r]) => r.should > 0).map(([k, r]) => {
    const actual = used[k] || 0;
    const allowPct = r.allowWeight ? r.allow / r.allowWeight : 5;
    const variancePct = (actual - r.should) / r.should * 100;
    return { name: r.name, unit: r.unit, should: round2(r.should), used: round2(actual), variance: round2(actual - r.should), variancePct: Math.round(variancePct * 10) / 10, allowPct: Math.round(allowPct * 10) / 10, over: variancePct > allowPct };
  }).sort((a, b) => b.variancePct - a.variancePct);
}

// Bills ↔ payments. A payment is tied to its bill by the bill's ID (chosen
// from the list). Older payments that only carry a typed bill number are
// matched by number + vendor, and only when that points at exactly one bill.
function computeBillLedger(bills, pays) {
  bills = bills || []; pays = pays || [];
  const key = v => String(v || '').trim().toLowerCase();
  const byNo = {};
  bills.forEach(b => { (byNo[key(b.bill_no)] = byNo[key(b.bill_no)] || []).push(b); });
  const paidByBill = {};
  const vendorOfPayment = [];
  let unmatched = 0;
  pays.forEach(p => {
    let bill = p.bill_no_id ? bills.find(b => b.id === p.bill_no_id) : null;
    if (!bill) {
      const candidates = byNo[key(p.bill_no)] || [];
      const sameVendor = candidates.filter(b => key(b.vendor) === key(p.vendor));
      bill = sameVendor.length === 1 ? sameVendor[0] : (candidates.length === 1 ? candidates[0] : null);
    }
    const amt = Number(p.amount) || 0;
    if (bill) paidByBill[bill.id] = (paidByBill[bill.id] || 0) + amt; else unmatched++;
    vendorOfPayment.push([p.vendor || bill?.vendor || 'Unspecified', amt]);
  });
  const rows = bills.map(b => {
    const payable = billPayableOf(b), paid = paidByBill[b.id] || 0, balance = Math.max(round2(payable - paid), 0);
    const open = !!BILL_FLOW[b.status || 'pending'];
    const approved = b.status === 'approved' || b.status === 'paid';
    const state = b.status === 'rejected' ? 'Rejected' : open ? 'In approval' : paid <= 0 ? 'Unpaid' : balance > 0 ? 'Part paid' : 'Paid in full';
    return { bill: b, payable, paid, balance, open, approved, state,
      ageDays: b.bill_date ? Math.max(-daysUntilDate(b.bill_date), 0) : 0,
      dueIn: b.due_date ? daysUntilDate(b.due_date) : null };
  });
  const approvedRows = rows.filter(r => r.approved);
  const openRows = rows.filter(r => r.open);
  const byVendor = {};
  approvedRows.forEach(r => { const v = r.bill.vendor || 'Unspecified'; (byVendor[v] = byVendor[v] || { b: 0, p: 0 }).b += r.payable; });
  vendorOfPayment.forEach(([v, amt]) => { (byVendor[v] = byVendor[v] || { b: 0, p: 0 }).p += amt; });
  const ageing = { a: 0, b: 0, c: 0 };
  approvedRows.filter(r => r.balance > 0).forEach(r => { if (r.ageDays <= 30) ageing.a += r.balance; else if (r.ageDays <= 60) ageing.b += r.balance; else ageing.c += r.balance; });
  return {
    rows,
    billed: round2(approvedRows.reduce((t, r) => t + r.payable, 0)),
    paid: round2(pays.reduce((t, p) => t + (Number(p.amount) || 0), 0)),
    outstanding: round2(approvedRows.reduce((t, r) => t + r.balance, 0)),
    inApprovalCount: openRows.length,
    inApprovalAmt: round2(openRows.reduce((t, r) => t + r.payable, 0)),
    retentionHeld: round2(rows.filter(r => r.bill.status !== 'rejected').reduce((t, r) => t + (Number(r.bill.retention) || 0), 0)),
    unmatched,
    ageing,
    dueSoon: approvedRows.filter(r => r.balance > 0 && r.dueIn !== null && r.dueIn <= 7).sort((a, b) => a.dueIn - b.dueIn),
    vendors: Object.entries(byVendor).map(([name, r]) => ({ name, billed: round2(r.b), paid: round2(r.p), due: Math.max(round2(r.b - r.p), 0) })).sort((a, b) => b.due - a.due)
  };
}

// Budget heads with what has been committed (orders) and spent (bills tagged
// to the head, plus any "other actual" typed on the head itself).
function computeBudgetRows(budget, bills, orders) {
  const liveBills = (bills || []).filter(b => b.status !== 'rejected');
  const liveOrders = (orders || []).filter(o => o.status !== 'cancelled');
  const rows = (budget || []).map(h => {
    const budgeted = Number(h.budgeted_amount) || 0;
    const other = Number(h.actual_amount) || 0;
    const billed = liveBills.filter(b => b.budget_head_id === h.id).reduce((t, b) => t + billTotalOf(b), 0);
    const committed = liveOrders.filter(o => o.budget_head_id === h.id).reduce((t, o) => t + (Number(o.order_value) || 0), 0);
    const actual = billed + other;
    return { id: h.id, label: [h.category, h.item].filter(Boolean).join(' — '), budgeted, committed: round2(committed), billed: round2(billed), other,
      actual: round2(actual), toComplete: Math.max(round2(Math.max(budgeted, committed) - actual), 0), variance: round2(budgeted - Math.max(committed, actual)) };
  });
  const headIds = new Set(rows.map(r => r.id));
  const untaggedBilled = round2(liveBills.filter(b => !b.budget_head_id || !headIds.has(b.budget_head_id)).reduce((t, b) => t + billTotalOf(b), 0));
  const sum = (k) => round2(rows.reduce((t, r) => t + r[k], 0));
  return { rows, untaggedBilled, totals: { budgeted: sum('budgeted'), committed: sum('committed'), actual: sum('actual'), toComplete: sum('toComplete') } };
}

// Sales: demands and receipts per booking. Money received is applied to a
// booking's demands oldest-first to work out which demands are still due.
function computeSalesLedger(bookings, demands, collections) {
  bookings = bookings || []; demands = (demands || []).filter(d => d.status !== 'cancelled'); collections = collections || [];
  const today = todayStr();
  const sold = bookings.filter(b => b.status === 'booked' || b.status === 'registered');
  const rows = bookings.filter(b => b.status !== 'available').map(b => {
    const dms = demands.filter(d => d.booking_id === b.id).sort((x, y) => (x.due_date || x.demand_date || '').localeCompare(y.due_date || y.demand_date || ''));
    const collected = collections.filter(c => c.booking_id === b.id).reduce((t, c) => t + (Number(c.amount) || 0), 0);
    let pool = collected, overdue = 0, overdueCount = 0;
    const demandBalances = {};
    dms.forEach(d => {
      const amt = Number(d.amount) || 0;
      const applied = Math.min(pool, amt); pool -= applied;
      const bal = round2(amt - applied);
      demandBalances[d.id] = bal;
      if (bal > 0 && d.due_date && d.due_date < today) { overdue += bal; overdueCount++; }
    });
    const demanded = dms.reduce((t, d) => t + (Number(d.amount) || 0), 0);
    return { booking: b, demanded: round2(demanded), collected: round2(collected), due: Math.max(round2(demanded - collected), 0), overdue: round2(overdue), overdueCount, demandBalances,
      agreement: Number(b.agreement_value) || 0 };
  });
  const demandBalances = {};
  rows.forEach(r => Object.assign(demandBalances, r.demandBalances));
  const sum = (k) => round2(rows.reduce((t, r) => t + r[k], 0));
  return { rows, demandBalances, sold: sold.length, agreementValue: round2(sold.reduce((t, b) => t + (Number(b.agreement_value) || 0), 0)),
    demanded: round2(demands.reduce((t, d) => t + (Number(d.amount) || 0), 0)),
    collected: round2(collections.reduce((t, c) => t + (Number(c.amount) || 0), 0)),
    dues: sum('due'), overdueAmt: sum('overdue'), overdueCount: rows.reduce((t, r) => t + r.overdueCount, 0) };
}

// Shared status vocabulary + sort order used across every module: items
// still needing attention show first, items in progress next, finished ones
// last — and within each group, oldest-added first.
const DONE_STATUSES = ['done','completed','resolved','received','closed','returned','ready','paid','filed','cancelled','rejected','registered'];
const IN_PROGRESS_STATUSES = ['in_progress','applied','active','on_track','fix_submitted','certified','checked','approved','assigned','fixed','part_paid','ordered','booked','reached'];

function statusSortRank(status) {
  if (DONE_STATUSES.includes(status)) return 2;
  if (IN_PROGRESS_STATUSES.includes(status)) return 1;
  return 0; // open, pending, at_risk, breached, expiring, expired, issued, etc.
}

function sortItemsForDisplay(items) {
  return [...items].sort((a, b) => {
    const rankDiff = statusSortRank(a.status) - statusSortRank(b.status);
    if (rankDiff !== 0) return rankDiff;
    const aTime = a.created_at?.toDate ? a.created_at.toDate().getTime() : 0;
    const bTime = b.created_at?.toDate ? b.created_at.toDate().getTime() : 0;
    return aTime - bTime; // oldest first within the same status group
  });
}

function fileKind(url) {
  const clean = (url || '').split('?')[0].toLowerCase();
  if (/\.(jpg|jpeg|png|gif|webp)$/.test(clean)) return 'image';
  if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return 'video';
  if (/\.pdf$/.test(clean)) return 'pdf';
  return 'other';
}

function openSignaturePad(label, onSigned) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4">
      <div class="bg-white rounded-2xl p-4 max-w-sm w-full space-y-2 relative">
        <button id="sig-close-x" class="absolute top-3 right-3 text-slate-400 text-xl leading-none w-8 h-8 flex items-center justify-center">✕</button>
        <h3 class="font-bold text-sm pr-8">Sign off — ${escapeHtml(label)}</h3>
        <p class="text-[11px] text-slate-500">Sign below with your finger or mouse. Your name and the date/time are recorded automatically.</p>
        <canvas id="sig-canvas" width="320" height="160" class="border-2 border-dashed border-slate-300 rounded-lg w-full touch-none bg-white"></canvas>
        <div class="flex gap-2">
          <button id="sig-clear" class="flex-1 py-1.5 rounded-lg border text-xs">Clear</button>
        </div>
        <div class="flex gap-2 pt-1">
          <button id="sig-save" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold">Confirm Sign-off</button>
          <button id="sig-cancel" class="flex-1 py-2 rounded-xl border text-sm">Cancel</button>
        </div>
        <p id="sig-status" class="text-xs"></p>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const canvas = wrap.querySelector('#sig-canvas');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
  let drawing = false, hasDrawn = false;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return [cx * (canvas.width / r.width), cy * (canvas.height / r.height)];
  };
  canvas.addEventListener('pointerdown', (e) => { drawing = true; hasDrawn = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); });
  canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  ['pointerup','pointerleave'].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));

  wrap.querySelector('#sig-clear').addEventListener('click', () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; });
  wrap.querySelector('#sig-close-x').addEventListener('click', () => wrap.remove());
  wrap.querySelector('#sig-cancel').addEventListener('click', () => wrap.remove());
  wrap.querySelector('#sig-save').addEventListener('click', () => {
    const statusEl = wrap.querySelector('#sig-status');
    if (!hasDrawn) { statusEl.textContent = 'Please sign first.'; statusEl.className = 'text-xs text-red-600'; return; }
    const btn = wrap.querySelector('#sig-save');
    btn.disabled = true; statusEl.textContent = 'Saving…'; statusEl.className = 'text-xs text-slate-500';
    canvas.toBlob(async (blob) => {
      try {
        await onSigned(blob);
        wrap.remove();
      } catch (err) {
        statusEl.textContent = err.message; statusEl.className = 'text-xs text-red-600';
        btn.disabled = false;
      }
    }, 'image/png');
  });
}

function wireBeforeAfterSlider(uid) {
  const range = document.getElementById(`ba-range-${uid}`);

  const handle = document.getElementById(`ba-handle-${uid}`);
  const track = document.getElementById(`ba-track-${uid}`);

  if (!range || !clip || !handle || !track || !beforeImg) return;
  // The "before" image must render at the FULL track width regardless of

  // you drag. Fix its width to the track's width, not the clip's.
  const syncWidth = () => { beforeImg.style.width = track.offsetWidth + 'px'; };

}
