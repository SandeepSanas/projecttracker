<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectTracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .data-mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.5); }
  .blueprint-grid { background-image: linear-gradient(rgba(148,197,255,.09) 1px,transparent 1px), linear-gradient(90deg,rgba(148,197,255,.09) 1px,transparent 1px); background-size:28px 28px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<!-- LOGIN -->
<div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 overflow-hidden">
  <div class="absolute inset-0 blueprint-grid"></div>
  <form id="login-form" class="relative max-w-sm w-full mx-4 bg-white/[0.06] backdrop-blur-xl rounded-2xl p-6 shadow-2xl border border-white/10 space-y-3">
    <h1 class="text-2xl font-bold text-white text-center">ProjectTracker</h1>
    <p class="eyebrow text-sky-400 text-center mb-2">Real-time Site Monitor</p>
    <input id="login-email" type="email" required placeholder="Email" class="w-full text-sm rounded-xl px-3 py-2.5 bg-white/90" />
    <input id="login-password" type="password" required placeholder="Password" class="w-full text-sm rounded-xl px-3 py-2.5 bg-white/90" />
    <p id="login-error" class="hidden text-xs text-red-300"></p>
    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold">Sign In</button>
    <p class="text-center text-slate-500 eyebrow pt-1">No account yet? Ask your Super Admin / Company Admin to create one.</p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 border-b bg-white/90 backdrop-blur px-4 py-2 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-sm">ProjectTracker</h1>
      <p id="header-sub" class="text-[10px] text-slate-500 data-mono"></p>
    </div>
    <div class="flex items-center gap-3">
      <span id="role-label" class="eyebrow text-slate-500"></span>
      <button id="logout-btn" class="text-xs px-3 py-1.5 rounded-xl border">Sign out</button>
    </div>
  </header>
  <div class="flex flex-1 min-h-0">
    <aside class="w-52 shrink-0 border-r bg-white/90 p-2">
      <nav id="side-nav" class="flex flex-col gap-1 text-sm"></nav>
    </aside>
    <main id="view" class="flex-1 overflow-y-auto p-5"></main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, collection,
  onSnapshot, query, where, serverTimestamp, updateDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBudo4nJSg91lpbEUXuaHMhZ4C86252Slk",
  authDomain: "unittracker-41273.firebaseapp.com",
  projectId: "unittracker-41273",
  storageBucket: "unittracker-41273.firebasestorage.app",
  messagingSenderId: "563517467794",
  appId: "1:563517467794:web:8795f4a6b249a3db294a4b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// ── Session state ────────────────────────────────────────────────
let session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
let unsubscribers = []; // active Firestore listeners for the current view, cleared on nav change

function clearListeners() { unsubscribers.forEach(u => u()); unsubscribers = []; }

// ── Auth wiring ──────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  errBox.classList.add('hidden');
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    errBox.textContent = friendlyAuthError(err);
    errBox.classList.remove('hidden');
  }
});
document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

function friendlyAuthError(err) {
  if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') return 'Incorrect email or password.';
  if (err.code === 'auth/user-not-found') return 'No account with that email. Ask your admin to create one.';
  if (err.code === 'auth/too-many-requests') return 'Too many attempts — wait a moment and try again.';
  return err.message;
}

onAuthStateChanged(auth, async (user) => {
  clearListeners();
  if (!user) {
    session = { uid:null, email:null, isSuperAdmin:false, companyId:null, profile:null };
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  session.uid = user.uid;
  session.email = user.email;

  // Check super_admin first
  const adminSnap = await getDoc(doc(db, 'admins', user.uid));
  if (adminSnap.exists()) {
    session.isSuperAdmin = true;
    session.companyId = null;
    session.profile = { role:'super_admin', name: user.email, modules:[], perms:{} };
  } else {
    // Find which company this user belongs to via a small lookup doc
    // written when the account was created (see createAuthAccountWithoutSwitchingSession callers).
    const lookupSnap = await getDoc(doc(db, 'userCompanyLookup', user.uid));
    if (!lookupSnap.exists()) {
      alert('Your account is not linked to a company yet. Contact your Super Admin.');
      await signOut(auth);
      return;
    }
    session.companyId = lookupSnap.data().companyId;
    const profileSnap = await getDoc(doc(db, 'companies', session.companyId, 'users', user.uid));
    session.profile = profileSnap.exists() ? profileSnap.data() : null;
  }

  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('role-label').textContent = session.profile?.role || 'super_admin';
  document.getElementById('header-sub').textContent = session.isSuperAdmin ? 'Platform Admin' : (session.companyId || '');
  buildNav();
});

// ── Nav ──────────────────────────────────────────────────────────
function moduleList() {
  if (session.isSuperAdmin) return [{ id:'companies', label:'Companies' }];
  const base = [{ id:'dashboard', label:'Dashboard' }, { id:'visual', label:'Visual Plan' }];
  if (session.profile?.role === 'company_admin') base.push({ id:'users', label:'Users' }, { id:'projects', label:'Projects' });
  return base;
}

function buildNav() {
  const nav = document.getElementById('side-nav');
  const mods = moduleList();
  nav.innerHTML = mods.map(m => `<button data-mod="${m.id}" class="nav-btn text-left px-3 py-2 rounded-xl hover:bg-slate-100">${m.label}</button>`).join('');
  nav.querySelectorAll('[data-mod]').forEach(b => b.addEventListener('click', () => renderView(b.dataset.mod)));
  renderView(mods[0].id);
}

function renderView(id) {
  clearListeners();
  document.querySelectorAll('#side-nav [data-mod]').forEach(b => b.classList.toggle('bg-blue-50', b.dataset.mod === id));
  const view = document.getElementById('view');
  if (id === 'companies') return renderCompanies(view);
  if (id === 'users') return renderUsers(view);
  if (id === 'projects') return renderProjects(view);
  if (id === 'dashboard') return renderDashboard(view);
  if (id === 'visual') return renderVisual(view);
}

// ── SUPER ADMIN: Companies ──────────────────────────────────────
async function renderCompanies(view) {
  view.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Companies</h2>
    <form id="new-company-form" class="glass rounded-2xl p-4 mb-5 space-y-2 max-w-md">
      <h3 class="font-semibold text-sm">Add company + first admin</h3>
      <input id="nc-company" placeholder="Company name *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="nc-admin-name" placeholder="Company Admin name *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="nc-admin-email" type="email" placeholder="Company Admin email *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="nc-admin-pass" type="text" placeholder="Temporary password *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <button class="w-full py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Create</button>
      <p id="nc-error" class="hidden text-xs text-red-600"></p>
    </form>
    <div id="company-list" class="space-y-2"></div>`;

  document.getElementById('new-company-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('nc-error');
    errEl.classList.add('hidden');
    const companyName = document.getElementById('nc-company').value.trim();
    const adminName = document.getElementById('nc-admin-name').value.trim();
    const adminEmail = document.getElementById('nc-admin-email').value.trim();
    const adminPass = document.getElementById('nc-admin-pass').value;
    try {
      const companyRef = await addDoc(collection(db, 'companies'), { name: companyName, createdAt: serverTimestamp() });
      const newUid = await createAuthAccountWithoutSwitchingSession(adminEmail, adminPass);
      await setDoc(doc(db, 'companies', companyRef.id, 'users', newUid), {
        name: adminName, email: adminEmail, role:'company_admin',
        modules: ['dashboard','visual','users','projects'],
        perms: { add:true, edit:true, update:true, delete:true }
      });
      await setDoc(doc(db, 'userCompanyLookup', newUid), { companyId: companyRef.id });
      e.target.reset();
      loadCompanyList();
    } catch (err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
    }
  });
  loadCompanyList();
}

async function loadCompanyList() {
  const snap = await getDocs(collection(db, 'companies'));
  document.getElementById('company-list').innerHTML = snap.docs.map(d => `
    <div class="glass rounded-xl p-3 text-sm flex justify-between">
      <span>${escapeHtml(d.data().name)}</span>
      <span class="text-slate-400 text-xs data-mono">${d.id}</span>
    </div>`).join('') || '<p class="text-slate-400 text-sm">No companies yet.</p>';
}

// ── Create an Auth account WITHOUT logging the browser in as that
//    new user — uses a throwaway secondary Firebase App instance so
//    the admin's own session stays active. No Cloud Functions needed.
let secondaryAppCounter = 0;
async function createAuthAccountWithoutSwitchingSession(email, password) {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
  const secondary = appMod.initializeApp(firebaseConfig, 'secondary-' + (secondaryAppCounter++));
  const secondaryAuth = authMod.getAuth(secondary);
  const cred = await authMod.createUserWithEmailAndPassword(secondaryAuth, email, password);
  const uid = cred.user.uid;
  await authMod.signOut(secondaryAuth);
  await appMod.deleteApp(secondary);
  return uid;
}

// ── COMPANY ADMIN: Users ────────────────────────────────────────
const ROLES = ['company_admin','project_manager','chief_engineer','sales','crm','facility','management'];
const ALL_MODULES = ['dashboard','visual','snags','tasks','budget','drawings','vendors','contacts','nocs','amenities','assets','keys','safety','announcements','society'];

async function renderUsers(view) {
  view.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Users</h2>
    <form id="new-user-form" class="glass rounded-2xl p-4 mb-5 space-y-2 max-w-md">
      <input id="nu-name" placeholder="Full name *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="nu-email" type="email" placeholder="Email *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="nu-pass" placeholder="Temporary password *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <select id="nu-role" class="w-full border rounded-lg px-2 py-1.5 text-sm">${ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
      <div class="text-xs">
        <p class="eyebrow text-slate-500 mb-1">Modules</p>
        <div class="flex flex-wrap gap-2">${ALL_MODULES.map(m=>`<label class="flex items-center gap-1"><input type="checkbox" class="nu-mod" value="${m}"/> ${m}</label>`).join('')}</div>
      </div>
      <div class="text-xs flex gap-3">
        ${['add','edit','update','delete'].map(p=>`<label class="flex items-center gap-1"><input type="checkbox" class="nu-perm" value="${p}"/> ${p}</label>`).join('')}
      </div>
      <button class="w-full py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Add user</button>
      <p id="nu-error" class="hidden text-xs text-red-600"></p>
    </form>
    <div id="user-list" class="space-y-2"></div>`;

  document.getElementById('new-user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('nu-error');
    errEl.classList.add('hidden');
    const name = document.getElementById('nu-name').value.trim();
    const email = document.getElementById('nu-email').value.trim();
    const password = document.getElementById('nu-pass').value;
    const role = document.getElementById('nu-role').value;
    const modules = [...document.querySelectorAll('.nu-mod:checked')].map(c => c.value);
    const perms = {};
    ['add','edit','update','delete'].forEach(p => perms[p] = document.querySelector(`.nu-perm[value="${p}"]`).checked);
    try {
      const newUid = await createAuthAccountWithoutSwitchingSession(email, password);
      await setDoc(doc(db, 'companies', session.companyId, 'users', newUid), { name, email, role, modules, perms });
      await setDoc(doc(db, 'userCompanyLookup', newUid), { companyId: session.companyId });
      e.target.reset();
      loadUserList();
    } catch (err) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
  });
  loadUserList();
}

async function loadUserList() {
  const snap = await getDocs(collection(db, 'companies', session.companyId, 'users'));
  document.getElementById('user-list').innerHTML = snap.docs.map(d => {
    const u = d.data();
    return `<div class="glass rounded-xl p-3 text-sm">
      <p class="font-semibold">${escapeHtml(u.name)} <span class="eyebrow text-slate-400">${u.role}</span></p>
      <p class="text-xs text-slate-500">${escapeHtml(u.email)}</p>
      <p class="text-[10px] text-slate-400 mt-1">Modules: ${(u.modules||[]).join(', ') || '—'}</p>
    </div>`;
  }).join('') || '<p class="text-slate-400 text-sm">No users yet.</p>';
}

// ── COMPANY ADMIN: Projects ─────────────────────────────────────
async function renderProjects(view) {
  view.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Projects</h2>
    <form id="new-project-form" class="glass rounded-2xl p-4 mb-5 space-y-2 max-w-md">
      <input id="np-name" placeholder="Project name *" class="w-full border rounded-lg px-2 py-1.5 text-sm" required/>
      <input id="np-location" placeholder="Location" class="w-full border rounded-lg px-2 py-1.5 text-sm"/>
      <button class="w-full py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Add project</button>
    </form>
    <div id="project-list" class="space-y-2"></div>`;

  document.getElementById('new-project-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('np-name').value.trim();
    const location = document.getElementById('np-location').value.trim();
    await addDoc(collection(db, 'companies', session.companyId, 'projects'), { name, location });
    e.target.reset();
    loadProjectList();
  });
  loadProjectList();
}

async function loadProjectList() {
  const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects'));
  window._projectCache = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  document.getElementById('project-list').innerHTML = window._projectCache.map(p => `
    <div class="glass rounded-xl p-3 text-sm flex justify-between">
      <span>${escapeHtml(p.name)} <span class="text-slate-400">${p.location?'· '+escapeHtml(p.location):''}</span></span>
      <span class="text-slate-400 text-xs data-mono">${p.id}</span>
    </div>`).join('') || '<p class="text-slate-400 text-sm">No projects yet — add one, then use its ID in Dashboard/Visual Plan.</p>';
}

// ── Resolve active project (first project found for this company) ─
async function resolveActiveProject() {
  const snap = await getDocs(collection(db, 'companies', session.companyId, 'projects'));
  if (snap.empty) return null;
  return snap.docs[0].id;
}

// ── DASHBOARD (real-time) ───────────────────────────────────────
async function renderDashboard(view) {
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projectId = await resolveActiveProject();
  if (!projectId) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet. Ask your Company Admin to add one under "Projects".</p>`; return; }

  view.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Project Overview</h2>
    <div id="kpi-cards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>
    <div class="glass rounded-2xl p-4">
      <h3 class="font-semibold text-sm mb-3">Status Breakdown</h3>
      <div id="status-breakdown" class="space-y-2"></div>
    </div>`;

  const unitsQ = collection(db, 'companies', session.companyId, 'projects', projectId, 'units');
  const unsub = onSnapshot(unitsQ, (snap) => {
    const units = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderKPIs(units);
    renderStatusBreakdown(units);
  }, (err) => { view.innerHTML = `<p class="text-red-600 text-sm">Error loading units: ${err.message}</p>`; });
  unsubscribers.push(unsub);
}

function renderKPIs(units) {
  const total = units.length;
  const completed = units.filter(u => u.status === 'completed').length;
  const delayed = units.filter(u => u.status === 'delayed').length;
  const avgPct = total ? Math.round(units.reduce((s,u)=>s+(u.completion_pct||0),0)/total) : 0;
  const cards = [
    { label:'Total Units', value: total },
    { label:'Completed', value: completed, tone:'text-emerald-600' },
    { label:'Delayed', value: delayed, tone: delayed ? 'text-red-600':'' },
    { label:'Avg. Progress', value: avgPct+'%', tone:'text-blue-600' }
  ];
  document.getElementById('kpi-cards').innerHTML = cards.map(c => `
    <div class="glass rounded-2xl p-4">
      <p class="text-2xl font-bold data-mono ${c.tone||''}">${c.value}</p>
      <p class="eyebrow text-slate-500 mt-1">${c.label}</p>
    </div>`).join('');
}

function renderStatusBreakdown(units) {
  const order = ['completed','in_progress','delayed','on_hold','pending'];
  const colors = { completed:'bg-emerald-500', in_progress:'bg-blue-500', delayed:'bg-red-500', on_hold:'bg-amber-500', pending:'bg-slate-400' };
  const total = units.length || 1;
  const counts = {}; order.forEach(k=>counts[k]=0);
  units.forEach(u => { if (counts[u.status] !== undefined) counts[u.status]++; });
  document.getElementById('status-breakdown').innerHTML = order.map(k => `
    <div>
      <div class="flex justify-between text-xs mb-1"><span class="capitalize">${k.replace('_',' ')}</span><span class="data-mono">${counts[k]} (${Math.round(counts[k]/total*100)}%)</span></div>
      <div class="w-full bg-slate-200 rounded-full h-2"><div class="${colors[k]} h-2 rounded-full" style="width:${counts[k]/total*100}%"></div></div>
    </div>`).join('');
}

// ── VISUAL PLAN (real-time, add tower/floor/unit, update status) ─
let visualCtx = null;
async function renderVisual(view) {
  view.innerHTML = `<p class="text-slate-400 text-sm">Loading…</p>`;
  const projectId = await resolveActiveProject();
  if (!projectId) { view.innerHTML = `<p class="text-slate-500 text-sm">No project yet.</p>`; return; }
  visualCtx = { projectId };

  const canEdit = session.profile?.role === 'company_admin' || session.profile?.role === 'management' ||
    session.profile?.perms?.add || session.profile?.perms?.edit;

  view.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">Visual Plan</h2>
      ${canEdit ? `<button id="add-tower-btn" class="text-xs px-3 py-1.5 rounded-xl bg-blue-600 text-white">+ Tower</button>` : ''}
    </div>
    <div id="tower-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4"></div>
    <div id="unit-area"></div>`;

  if (canEdit) document.getElementById('add-tower-btn').addEventListener('click', addTowerFlow);

  const towersQ = collection(db, 'companies', session.companyId, 'projects', projectId, 'towers');
  const unsub = onSnapshot(towersQ, (snap) => {
    const towers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    document.getElementById('tower-list').innerHTML = towers.map(t => `
      <button data-tower="${t.id}" class="tower-card text-left glass rounded-2xl p-4 hover:shadow-lg transition">
        <p class="font-semibold text-sm">${escapeHtml(t.name)}</p>
      </button>`).join('') || '<p class="text-slate-400 text-sm col-span-full">No towers yet.</p>';
    document.querySelectorAll('.tower-card').forEach(b => b.addEventListener('click', () => showUnits(b.dataset.tower, canEdit)));
  });
  unsubscribers.push(unsub);
}

async function addTowerFlow() {
  const name = prompt('Tower name (e.g. Tower A):');
  if (!name) return;
  await addDoc(collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'towers'), { name });
}

function showUnits(towerId, canEdit) {
  const area = document.getElementById('unit-area');
  area.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <h3 class="font-semibold text-sm">Units</h3>
      ${canEdit ? `<button id="add-unit-btn" class="text-xs px-3 py-1.5 rounded-xl border">+ Unit</button>` : ''}
    </div>
    <div id="unit-grid" class="flex flex-wrap gap-2"></div>`;

  if (canEdit) document.getElementById('add-unit-btn').addEventListener('click', () => addUnitFlow(towerId));

  const STATUS_COLORS = { completed:'bg-emerald-500', in_progress:'bg-blue-500', delayed:'bg-red-500', on_hold:'bg-amber-500', pending:'bg-slate-300' };
  const unitsQ = query(
    collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'units'),
    where('tower_id', '==', towerId)
  );
  const unsub = onSnapshot(unitsQ, (snap) => {
    const units = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    document.getElementById('unit-grid').innerHTML = units.map(u => `
      <div data-unit="${u.id}" class="unit-box w-16 h-16 rounded-xl ${STATUS_COLORS[u.status]||'bg-slate-300'} flex flex-col items-center justify-center text-white text-[10px] font-bold ${canEdit?'cursor-pointer':''}" title="${escapeHtml(u.unit_number)}">
        <span class="data-mono">${escapeHtml(u.unit_number)}</span>
        <span class="opacity-80 data-mono">${u.completion_pct||0}%</span>
      </div>`).join('') || '<p class="text-slate-400 text-sm">No units yet in this tower.</p>';
    if (canEdit) {
      document.querySelectorAll('[data-unit]').forEach(box => {
        box.addEventListener('click', () => updateUnitFlow(box.dataset.unit, units.find(u=>u.id===box.dataset.unit)));
      });
    }
  });
  unsubscribers.push(unsub);
}

async function addUnitFlow(towerId) {
  const unitNumber = prompt('Unit number (e.g. A-101):');
  if (!unitNumber) return;
  await addDoc(collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'units'), {
    unit_number: unitNumber, tower_id: towerId, status:'pending', completion_pct:0,
    created_at: serverTimestamp(), updated_by: session.email
  });
}

async function updateUnitFlow(unitId, unit) {
  const next = prompt(`Update status for ${unit.unit_number}\n(pending / in_progress / completed / delayed / on_hold)`, unit.status);
  if (!next) return;
  const pct = next === 'completed' ? 100 : parseInt(prompt('Completion % (0-100):', unit.completion_pct || 0)) || 0;
  await updateDoc(doc(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'units', unitId), {
    status: next, completion_pct: pct, updated_by: session.email, updated_at: serverTimestamp()
  });
  await addDoc(collection(db, 'companies', session.companyId, 'projects', visualCtx.projectId, 'activityLog'), {
    actor: session.email, action: `Updated unit ${unit.unit_number} → ${next} (${pct}%)`, at: serverTimestamp()
  });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
